# https://taskfile.dev
version: "3"

vars:
  COMPOSE: process-compose.yml

tasks:
  default:
    desc: Run all quality checks
    cmds:
      - task: quality

  platform:up:
    desc: Start stack via CLI
    cmds:
      - cargo run -p agileplus-cli -- platform up --config {{.COMPOSE}}

  platform:down:
    desc: Stop process-compose daemon
    cmds:
      - cargo run -p agileplus-cli -- platform down --config {{.COMPOSE}}

  platform:status:
    desc: Show API / platform health
    cmds:
      - cargo run -p agileplus-cli -- platform status

  platform:logs:
    desc: Logs from running stack
    cmds:
      - cargo run -p agileplus-cli -- platform logs --config {{.COMPOSE}} {{.CLI_ARGS}}

  pc:up:
    desc: Raw process-compose TUI
    cmds:
      - process-compose up -f {{.COMPOSE}}

  pc:ps:
    desc: List processes in running project
    cmds:
      - process-compose list

  urls:
    desc: Print URLs for dashboard and Plane
    cmds:
      - 'echo "AgilePlus API/dashboard: http://localhost:3000/dashboard"'
      - 'echo "Plane web (optional): http://localhost:3100"'

  build:
    desc: cargo build workspace
    cmds:
      - cargo build --workspace

  test:
    desc: cargo test workspace
    cmds:
      - cargo test --workspace

  lint:
    desc: cargo clippy workspace
    cmds:
      - cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    desc: cargo fmt check
    cmds:
      - cargo fmt --all --check

  python-lint:
    desc: Run ruff linter on Python code
    cmds:
      - ruff check python/

  python-test:
    desc: Run pytest on Python tests
    cmds:
      - cd python && uv run pytest

  docs:dev:
    desc: VitePress dev server
    cmds:
      - bun run docs:dev

  docs:build:
    desc: Build static docs site
    cmds:
      - bun run docs:build

  quality:
    desc: Run all quality checks
    cmds:
      - task: lint
      - task: fmt
      - task: python-lint
      - task: test
      - task: python-test
