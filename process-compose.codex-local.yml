version: "0.5"

environment:
  - RUST_BACKTRACE=1

processes:
  orb-containers:
    command: bash -c "bash scripts/orb-up-codex-local.sh && exec tail -f /dev/null"
    shutdown:
      command: bash scripts/orb-down.sh
    depends_on: {}
    log_location: .agileplus/logs/orb-containers.log
    readiness_probe:
      exec:
        command: >-
          bash -c
          "redis-cli -h localhost -p ${AGILEPLUS_REDIS_PORT} ping | grep -q PONG &&
          pg_isready -h localhost -p ${AGILEPLUS_POSTGRES_PORT}"
      initial_delay_seconds: 30
      period_seconds: 5
      failure_threshold: 18

  nats:
    command: >-
      nats-server --jetstream --store_dir .agileplus/nats-data
      --port ${AGILEPLUS_NATS_PORT} --http_port ${AGILEPLUS_NATS_HTTP_PORT}
    depends_on: {}
    log_location: .agileplus/logs/nats.log
    readiness_probe:
      http_get:
        host: localhost
        port: ${AGILEPLUS_NATS_HTTP_PORT}
        path: /healthz
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 3

  minio:
    command: >-
      minio server .agileplus/minio-data
      --address :${AGILEPLUS_MINIO_PORT}
      --console-address :${AGILEPLUS_MINIO_CONSOLE_PORT}
    depends_on: {}
    log_location: .agileplus/logs/minio.log
    readiness_probe:
      http_get:
        host: localhost
        port: ${AGILEPLUS_MINIO_PORT}
        path: /minio/health/live
      initial_delay_seconds: 5
      period_seconds: 5
      failure_threshold: 3
    environment:
      - MINIO_ROOT_USER=agileplus
      - MINIO_ROOT_PASSWORD=agileplus-dev

  plane-api:
    command: >-
      bash -c
      "cd .agileplus/plane/apps/api &&
      export AMQP_URL=\${AMQP_URL:-memory://} &&
      .venv/bin/python manage.py wait_for_db --settings=plane.settings.local &&
      .venv/bin/python manage.py wait_for_migrations --settings=plane.settings.local &&
      export MACHINE_SIGNATURE=\$(hostname | shasum -a 256 | awk '{print \$1}') &&
      .venv/bin/python manage.py register_instance \"\$MACHINE_SIGNATURE\" --settings=plane.settings.local &&
      .venv/bin/python manage.py configure_instance --settings=plane.settings.local &&
      .venv/bin/python manage.py create_bucket --settings=plane.settings.local &&
      .venv/bin/python manage.py clear_cache --settings=plane.settings.local &&
      .venv/bin/python manage.py runserver 0.0.0.0:${AGILEPLUS_PLANE_API_PORT} --settings=plane.settings.local"
    depends_on:
      orb-containers:
        condition: process_healthy
      minio:
        condition: process_healthy
    log_location: .agileplus/logs/plane-api.log
    readiness_probe:
      http_get:
        host: localhost
        port: ${AGILEPLUS_PLANE_API_PORT}
        path: /
      initial_delay_seconds: 20
      period_seconds: 5
      failure_threshold: 6
    environment:
      - DATABASE_URL=postgresql://agileplus:${PLANE_POSTGRES_PASSWORD:-agileplus-dev}@localhost:${AGILEPLUS_POSTGRES_PORT}/plane
      - REDIS_URL=redis://localhost:${AGILEPLUS_REDIS_PORT}
      - SECRET_KEY=${PLANE_SECRET_KEY:-agileplus-dev-secret-key}
      - WEB_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - CORS_ALLOWED_ORIGINS=http://localhost:${AGILEPLUS_PLANE_WEB_PORT},http://localhost:${AGILEPLUS_API_PORT}
      - APP_BASE_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - LIVE_BASE_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - LIVE_BASE_PATH=/live
      - AWS_S3_ENDPOINT_URL=http://localhost:${AGILEPLUS_MINIO_PORT}
      - AWS_ACCESS_KEY_ID=agileplus
      - AWS_SECRET_ACCESS_KEY=agileplus-dev
      - AWS_S3_BUCKET_NAME=uploads
      - USE_MINIO=1
      - AMQP_URL=memory://
      - PYTHONUNBUFFERED=1

  plane-web:
    command: >-
      bash -c
      "cd .agileplus/plane/apps/web &&
      pnpm exec react-router dev --port ${AGILEPLUS_PLANE_WEB_PORT}"
    depends_on:
      plane-api:
        condition: process_healthy
    log_location: .agileplus/logs/plane-web.log
    readiness_probe:
      http_get:
        host: localhost
        port: ${AGILEPLUS_PLANE_WEB_PORT}
        path: /
      initial_delay_seconds: 20
      period_seconds: 5
      failure_threshold: 3
    environment:
      - VITE_API_BASE_URL=http://localhost:${AGILEPLUS_PLANE_API_PORT}
      - VITE_WEB_BASE_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - VITE_ADMIN_BASE_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - VITE_ADMIN_BASE_PATH=/god-mode
      - VITE_SPACE_BASE_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - VITE_SPACE_BASE_PATH=/spaces
      - VITE_LIVE_BASE_URL=http://localhost:${AGILEPLUS_PLANE_WEB_PORT}
      - VITE_LIVE_BASE_PATH=/live
