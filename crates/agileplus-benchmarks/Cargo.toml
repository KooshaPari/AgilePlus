[package]
name = "agileplus-benchmarks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Criterion performance benchmarks for all AgilePlus subsystems"

[dependencies]
agileplus-domain = { version = "0.2.1", path = "../agileplus-domain" }
agileplus-events = { version = "0.2.1", path = "../agileplus-events" }
agileplus-sqlite = { version = "0.2.1", path = "../agileplus-sqlite" }
agileplus-graph = { version = "0.2.1", path = "../agileplus-graph" }
agileplus-triage = { version = "0.2.1", path = "../agileplus-triage" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio.workspace = true
async-trait = "0.1"
rusqlite.workspace = true
uuid = { version = "1.10", features = ["v4", "serde"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
tokio = { workspace = true, features = ["full"] }
rusqlite.workspace = true

[[bench]]
name = "event_append_throughput"
harness = false

[[bench]]
name = "event_replay"
harness = false

[[bench]]
name = "api_response_times"
harness = false

[[bench]]
name = "sync_roundtrip"
harness = false

[[bench]]
name = "graph_query_perf"
harness = false

[[bench]]
name = "claim_engine_perf"
harness = false

[[bench]]
name = "trace_matrix_derivation"
harness = false
