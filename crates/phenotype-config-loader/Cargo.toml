[package]
name = "phenotype-config-loader"
version = "0.2.0"
edition = "2021"
authors = ["Phenotype Developers"]
description = "Generic configuration loading with TOML/YAML/JSON support"
license = "MIT"

[dependencies]
phenotype-error-core = { path = "../phenotype-error-core" }
thiserror = "1.0"
tokio = { version = "1.35", features = ["rt", "macros"], optional = true }
dirs-next = "2.0"
toml = { version = "0.8", optional = true }
serde_yaml = { version = "0.9", optional = true }
serde_json = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3.10"

[features]
default = ["toml", "yaml", "json"]
yaml = ["serde_yaml"]
json = ["serde_json"]
async = ["tokio"]
