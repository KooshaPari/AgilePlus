[package]
name = "agileplus-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/AgilePlus"
description = "agileplus api — Phenotype infrastructure crate (AgilePlus)"
documentation = "https://docs.rs/agileplus-api"
keywords = ["phenotype", "agileplus", "api"]
categories = ["network-programming"]
authors = ["kooshapari"]

[package.metadata.askama]
dirs = ["../../templates"]

[dependencies]
# workspace crates
agileplus-domain       = { path = "../agileplus-domain" }
agileplus-application  = { path = "../agileplus-application" }
agileplus-git          = { path = "../agileplus-git" }
agileplus-sqlite       = { path = "../agileplus-sqlite" }
agileplus-dashboard    = { path = "../agileplus-dashboard" }
agileplus-telemetry    = { workspace = true }
# workspace-managed external deps
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
tracing.workspace = true
chrono.workspace = true
utoipa.workspace = true
async-trait.workspace = true
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }

# Domain, storage, VCS, and related crates
agileplus-domain = { path = "../agileplus-domain" }
agileplus-git = { path = "../agileplus-git" }
agileplus-sqlite = { path = "../agileplus-sqlite" }
agileplus-dashboard = { path = "../agileplus-dashboard" }
