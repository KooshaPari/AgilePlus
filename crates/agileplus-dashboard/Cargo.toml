[package]
name = "agileplus-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.askama]
dirs = ["../../templates"]

[dependencies]
agileplus-domain = { version = "0.2.1", path = "../agileplus-domain" }
agileplus-events = { version = "0.2.1", path = "../agileplus-events" }
agileplus-sqlite = { version = "0.2.1", path = "../agileplus-sqlite" }
agileplus-fixtures = { version = "0.2.1", path = "../agileplus-fixtures" }
agileplus-governance = { version = "0.1.0", path = "../agileplus-governance" }
agileplus-plane = { version = "0.2.1", path = "../agileplus-plane" }
agileplus-api = { version = "0.2.1", path = "../agileplus-api" }
askama = "0.16"
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
async-stream = "0.3"
tokio-stream = "0.1"
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
rusqlite = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dirs-next.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
