[package]
name = "agileplus-dashboard"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[package.metadata.askama]
dirs = ["../../templates"]

[dependencies]
agileplus-domain = { version = "0.2.4", path = "../agileplus-domain" }
# agileplus-sqlite removed: unused by dashboard (uses rusqlite directly)
agileplus-fixtures = { version = "0.2.4", path = "../agileplus-fixtures" }
agileplus-governance = { version = "0.1.0", path = "../agileplus-governance" }
agileplus-plane = { version = "0.2.4", path = "../agileplus-plane" }
# agileplus-api removed: unused by dashboard
askama = "0.16"
axum = { version = "0.8", features = ["json", "macros", "tokio"] }
async-stream = "0.3"
tokio-stream = "0.1"
tower = { version = "0.5" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "1.1"
tracing.workspace = true
tracing-subscriber.workspace = true
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.39"
rusqlite = { workspace = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[package.metadata.dist]
dist = false
