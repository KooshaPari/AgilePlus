[package]
name = "agileplus-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared config-builder macro for AgilePlus crates"
license = "MIT OR Apache-2.0"
repository = "https://github.com/<REDACTED>/AgilePlus"
documentation = "https://docs.rs/agileplus-config"
keywords = ["phenotype", "agileplus", "config"]
categories = ["config"]
authors = ["<REDACTED>"]

[dependencies]
paste = "1"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[package.metadata.dist]
dist = false
