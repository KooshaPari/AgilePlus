[package]
name = "phenotype-test-fixtures"
version = "0.2.0"
edition = "2021"
authors = ["Phenotype Developers"]
description = "Test fixtures and property-based testing utilities"
license = "MIT"

[dependencies]
thiserror = "1.0"
rand = "0.8"
serde = { version = "1.0", features = ["derive"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
chrono = "0.4"
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
futures = { version = "0.3", optional = true }
mockall = { version = "0.12", optional = true }
uuid = { version = "1.7", features = ["v4", "serde"] }
toml = { version = "0.8", optional = true }
async-trait = { version = "0.1", optional = true }
once_cell = { version = "1.19", optional = true }
dashmap = "5.5"

[dev-dependencies]
proptest = "1.5"
tempfile = "3.10"

[features]
default = ["dep:serde", "dep:serde_json", "dep:toml"]
toml = ["dep:toml"]
serde_json = ["dep:serde_json"]
async = ["dep:async-trait", "dep:futures"]
mock = ["dep:mockall"]
yaml = ["dep:serde_yaml"]
fixtures = ["dep:serde", "dep:serde_json", "dep:once_cell"]
serde = ["dep:serde"]
