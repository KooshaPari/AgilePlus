# QC1-001 pre-commit baseline for AgilePlus.
# Install: pre-commit install
# Run all configured hooks: pre-commit run --all-files
# Run manual hooks only: pre-commit run --all-files --hook-stage manual

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        stages: [manual]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: ^(docs/worklogs/aggregate\.sh|history_cleanup\.sh|scripts/.*\.sh)$

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        files: \.rs$|Cargo\.toml$

      - id: cargo-clippy
        name: cargo clippy --workspace --all-targets --all-features -- -D warnings
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        pass_filenames: false
        files: \.rs$|Cargo\.toml$
        stages: [manual]

      - id: cargo-test
        name: cargo test --workspace --all-features
        entry: cargo test --workspace --all-features
        language: system
        pass_filenames: false
        files: \.rs$|Cargo\.toml$
        stages: [manual]

      - id: trufflehog
        name: trufflehog filesystem --no-update --only-verified --fail .
        entry: trufflehog filesystem --no-update --only-verified --fail .
        language: system
        pass_filenames: false
        stages: [manual]
