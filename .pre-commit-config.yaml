# L2 #33 pre-commit baseline, 2026-06-11.
# Install: pre-commit install
# Run default hooks: pre-commit run --all-files
# Run heavy language baselines: pre-commit run --all-files --hook-stage manual

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, chore, ci, build, revert]
