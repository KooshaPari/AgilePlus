name: OpenSSF Scorecard
on:
  branch_protection_rule:
  schedule:
    - cron: '17 3 * * 6'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fix submodule configuration
        run: |
          # Remove stale submodule entries that are not in .gitmodules
          if [ -d .git/modules ]; then
            for module_path in .git/modules/*/; do
              module_name=$(basename "$module_path")
              if ! git config -f .gitmodules --get "submodule.$module_name.path" > /dev/null 2>&1; then
                rm -rf "$module_path"
                git config --unset "submodule.$module_name.url" || true
              fi
            done
          fi

      - uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
