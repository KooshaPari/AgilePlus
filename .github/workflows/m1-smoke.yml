# M1 Smoke Test — end-to-end CLI validation.
# Builds the agileplus binary, runs every top-level subcommand, and
# exercises rubric/cockpit/dashboard flows against the repo itself.
name: M1 Smoke

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: m1-smoke-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    PACKAGE: agileplus-cli
    BIN_NAME: agileplus

jobs:
    smoke:
        name: CLI smoke (ubuntu)
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

            - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
              with:
                  version: "28.x"
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Install libdbus development files
              # keyring 3.6.3's sync-secret-service backend links against the
              # system libdbus via libdbus-sys, which resolves it with
              # pkg-config. Without this the build fails with
              # "Package 'dbus-1', required by 'virtual:world', not found".
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libdbus-1-dev pkg-config

            # ── 1. Build ──────────────────────────────────────────────────────────
            - name: Build release CLI
              run: cargo build --release --locked -p ${{ env.PACKAGE }}

            - name: Install built CLI to PATH
              run: |
                  mkdir -p "$HOME/.local/bin"
                  install -m 0755 "target/release/${{ env.BIN_NAME }}" "$HOME/.local/bin/${{ env.BIN_NAME }}"
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"
                  agileplus --version

            # ── 2. Verify all subcommands via --help ──────────────────────────────
            - name: Verify --help lists all subcommands
              run: |
                  echo "::group::agileplus --help"
                  agileplus --help
                  echo "::endgroup::"

                  # Every expected top-level subcommand must appear in help output
                  for cmd in cycle list specify queue module \
                             research plan implement validate ship retrospective \
                             triage dashboard cockpit rubric; do
                    if ! agileplus --help | grep -qw "$cmd"; then
                      echo "::error::subcommand '$cmd' missing from --help output"
                      exit 1
                    fi
                    echo "  present: $cmd"
                  done

            # ── 3. Rubric score ───────────────────────────────────────────────────
            - name: agileplus rubric score --repo .
              run: agileplus rubric score --repo .

            # ── 4. Cockpit publish ────────────────────────────────────────────────
            - name: agileplus cockpit publish --repo .
              run: agileplus cockpit publish --repo .

            # ── 5. Dashboard --json ───────────────────────────────────────────────
            - name: agileplus dashboard --json
              run: |
                  output=$(agileplus dashboard --json)
                  echo "$output" | jq .
                  # Verify key fields are present
                  echo "$output" | jq -e '.generated_at' > /dev/null
                  echo "$output" | jq -e '.work_packages' > /dev/null
                  echo "Dashboard JSON rendered successfully"
