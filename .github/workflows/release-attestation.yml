# Attest the actual artifacts published in a GitHub release, with SLSA Build L2.
# Triggered on `release: published` — at this point the release assets exist and
# have already been built by the upstream pipeline (cargo-dist for CLI,
# release-desktop for desktop, etc.). We do NOT rebuild here; we attest the
# exact bytes that the user downloads.
#
# Previously (R4 audit finding) this workflow rebuilt the workspace with
# 'cargo build --release --locked --workspace --all-targets', which produced
# a binary that was almost-but-not-exactly identical to the released one
# (different target triple, different build host, different timestamps). The
# attestation covered a different binary than the one users actually got.
#
# New behavior: download the release assets via `gh release download`, then
# attach SLSA Build L2 provenance to those exact bytes. The attestation
# links back to the release tag, not to a fresh build.
name: Release Attestation

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: "Release tag to attest (defaults to latest)"
                required: false
                type: string

permissions:
    contents: read
    id-token: write
    attestations: write

jobs:
    download-and-attest:
        name: Download release artifacts and attest (SLSA Build L2)
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            id-token: write
            attestations: write
        env:
            # Allow `gh release download` to read the release we just published.
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Resolve target tag
              id: tag
              run: |
                  if [ -n "${{ inputs.tag }}" ]; then
                    echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
                  else
                    tag="${{ github.event.release.tag_name }}"
                    echo "value=$tag" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download release assets
              env:
                  TAG: ${{ steps.tag.outputs.value }}
              run: |
                  set -euo pipefail
                  mkdir -p release-artifacts
                  gh release download "$TAG" \
                    --dir release-artifacts \
                    --pattern '*' \
                    --clobber

                  echo "=== Downloaded assets ==="
                  ls -la release-artifacts/

                  count=$(find release-artifacts -type f | wc -l)
                  if [ "$count" -eq 0 ]; then
                    echo "::error::No assets downloaded for release $TAG"
                    exit 1
                  fi
                  echo "Downloaded $count asset(s) for release $TAG"

            - name: Build provenance manifest
              run: |
                  set -euo pipefail
                  sha256sum release-artifacts/* > release-artifacts/SHA256SUMS
                  cat > release-artifacts/BUILD_MANIFEST.txt <<EOF
                  # Release Build Manifest
                  repository: ${{ github.repository }}
                  tag:        ${{ steps.tag.outputs.value }}
                  release_id: ${{ github.event.release.id }}
                  runner:     ${{ runner.os }}
                  attested_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
                  artifacts: see SHA256SUMS in this directory
                  EOF
                  echo "=== Provenance manifest ==="
                  cat release-artifacts/BUILD_MANIFEST.txt

            - name: Upload artifacts for provenance
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: release-artifacts
                  path: release-artifacts/
                  if-no-files-found: error
                  retention-days: 90

            - name: Attest build provenance (SLSA Build L2)
              uses: slsa-framework/slsa-github-generator/attest-build-provenance@v1
              with:
                  artifact-name: release-artifacts
