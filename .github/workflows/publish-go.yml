name: Tag Go Module Release

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Go module path (e.g., template-commons/phenotype-go-kit)'
        required: true
        type: string
      version:
        description: 'Version to tag (e.g., v0.1.0)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not actually create tag)'
        required: false
        type: boolean
        default: true

  push:
    tags:
      - '*/phenotype-go-*/v*'

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Parse tag (if triggered by tag push)
        if: github.event_name == 'push'
        id: parse-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Full tag: $TAG"
          # Parse <path>/<module>/v<version>
          if [[ $TAG =~ ^(.+)/phenotype-go-(.+)/v(.+)$ ]]; then
            echo "path=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "module=phenotype-go-${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
            echo "version=v${BASH_REMATCH[3]}" >> $GITHUB_OUTPUT
          else
            echo "Invalid tag format: $TAG"
            exit 1
          fi

      - name: Determine module info
        id: module-info
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "path=${{ steps.parse-tag.outputs.path }}" >> $GITHUB_OUTPUT
            echo "module=${{ steps.parse-tag.outputs.module }}" >> $GITHUB_OUTPUT
            echo "version=${{ steps.parse-tag.outputs.version }}" >> $GITHUB_OUTPUT
          else
            # Validate and set from inputs
            echo "path=${{ inputs.module }}" >> $GITHUB_OUTPUT
            MODULE=$(basename ${{ inputs.module }})
            echo "module=$MODULE" >> $GITHUB_OUTPUT
            # Ensure version starts with 'v'
            VERSION="${{ inputs.version }}"
            if [[ ! $VERSION =~ ^v ]]; then
              VERSION="v$VERSION"
            fi
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Validate Go module
        working-directory: ${{ steps.module-info.outputs.path }}
        run: |
          if [ ! -f "go.mod" ]; then
            echo "Error: go.mod not found in ${{ steps.module-info.outputs.path }}"
            exit 1
          fi

          # Extract module path from go.mod
          MODULE_PATH=$(grep "^module " go.mod | awk '{print $2}')
          echo "Module path: $MODULE_PATH"
          echo "module_path=$MODULE_PATH" >> $GITHUB_OUTPUT

          # Verify go.mod is valid
          go mod verify

      - name: Run tests
        working-directory: ${{ steps.module-info.outputs.path }}
        run: |
          go test ./... -v

      - name: Check module is publishable
        working-directory: ${{ steps.module-info.outputs.path }}
        run: |
          # Ensure go.sum exists for reproducible builds
          if [ ! -f "go.sum" ]; then
            echo "Warning: go.sum not found, running go mod tidy"
            go mod tidy
          fi

          # Check for any issues
          go vet ./...

      - name: Dry run - show tag that would be created
        if: ${{ inputs.dry_run && github.event_name == 'workflow_dispatch' }}
        run: |
          TAG="${{ steps.module-info.outputs.path }}/${{ steps.module-info.outputs.version }}"
          echo "DRY RUN: Would create tag: $TAG"
          echo "Target: ${{ steps.module-info.outputs.path }}/go.mod"
          echo ""
          echo "Module: ${{ steps.module-info.outputs.module }}"
          echo "Version: ${{ steps.module-info.outputs.version }}"

      - name: Create Git tag for Go module
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event_name == 'push' }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag was already pushed, just verify it
            TAG="${{ github.ref_name }}"
            echo "Using pushed tag: $TAG"
          else
            # Create the tag
            TAG="${{ steps.module-info.outputs.path }}/${{ steps.module-info.outputs.version }}"
            git config user.name "GitHub Actions"
            git config user.email "actions@github.com"
            git tag -a "$TAG" -m "Release ${{ steps.module-info.outputs.module }} ${{ steps.module-info.outputs.version }}"
            git push origin "$TAG"
            echo "Created tag: $TAG"
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
        id: create-tag

      - name: Verify module proxy accessibility
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event_name == 'push' }}
        run: |
          # Wait a moment for proxy to pick up the tag
          sleep 5

          MODULE_PATH=$(grep "^module " ${{ steps.module-info.outputs.path }}/go.mod | awk '{print $2}')
          VERSION="${{ steps.module-info.outputs.version }}"

          echo "Checking module availability at proxy.golang.org..."
          echo "Module: $MODULE_PATH"
          echo "Version: $VERSION"

          # Try to fetch from proxy (this primes the cache)
          GOPROXY=https://proxy.golang.org go list -m "$MODULE_PATH@$VERSION" || true

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('{0}/{1}', steps.module-info.outputs.path, steps.module-info.outputs.version) }}
          name: ${{ format('{0} {1}', steps.module-info.outputs.module, steps.module-info.outputs.version) }}
          body: |
            ## Go Module Release

            Module: `${{ steps.module-info.outputs.module }}`
            Version: `${{ steps.module-info.outputs.version }}`

            ### Installation

            ```bash
            go get github.com/KooshaPari/${{ steps.module-info.outputs.module }}@${{ steps.module-info.outputs.version }}
            ```

            ### Import

            ```go
            import "github.com/KooshaPari/${{ steps.module-info.outputs.module }}"
            ```
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
