name: cargo-audit
permissions: read-all

on:
    push:
        branches: [main]
        paths: ["Cargo.lock", "Cargo.toml"]
    pull_request:
        paths: ["Cargo.lock", "Cargo.toml"]
    schedule:
        - cron: "37 5 * * 3" # weekly Wednesday
    workflow_dispatch:

jobs:
    audit:
        runs-on: ubuntu-24.04
        # rustsec/audit-check@v2 fails while updating its check run with
        # "Not Found - https://docs.github.com/rest/checks/runs#update-a-check-run"
        # even when `cargo audit` reports "No vulnerabilities". Run the binary
        # directly so the audit exit code gates the job without requiring
        # checks/issues write permissions.
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            # Install prebuilt binaries rather than compiling on the pinned
            # nightly: that toolchain cannot build current `filetime`
            # (E0658 fs_set_times), which is why audit-check was replaced.
            # Running `cargo audit` directly (below) also removes the
            # checks/issues write permissions audit-check required.
            - name: Install cargo-audit
              uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
              with:
                  tool: cargo-audit
            - name: Run cargo audit
              run: cargo audit
