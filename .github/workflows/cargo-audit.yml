name: cargo-audit
permissions: read-all

on:
    push:
        branches: [main]
        paths: ["Cargo.lock", "Cargo.toml"]
    pull_request:
        paths: ["Cargo.lock", "Cargo.toml"]
    schedule:
        - cron: "37 5 * * 3" # weekly Wednesday
    workflow_dispatch:

jobs:
    audit:
        runs-on: ubuntu-24.04
        # rustsec/audit-check@v2 creates one GitHub issue per advisory
        # (incl. informational) when triggered on `schedule:`. Without
        # `issues: write` the POST /repos/.../issues call returns
        # "Resource not accessible by integration" and fails the step
        # even though `cargo audit` itself reports "No vulnerabilities".
        # Same root cause fixed in security.yml by 61f0aade; this
        # workflow has been failing every Wednesday cron since 2026-08-26
        # (run 32936521807 was the last success; 9 consecutive failures).
        permissions:
            contents: read
            checks: write
            issues: write
        steps:
            - uses: actions/checkout@v7
            - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
