# Cargo-dist powered release workflow for AgilePlus binaries.
# Produces real platform installers (MSI via cargo-wix, shell/powershell scripts) + source archives.
# Configuration from [workspace.metadata.dist] in Cargo.toml
name: Cargo Dist Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  PACKAGE: agileplus-cli
  BIN_NAME: agileplus

jobs:
  plan:
    name: Plan Distribution
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "version=dev" >> $GITHUB_OUTPUT
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset_name: agileplus-x86_64-unknown-linux-gnu
            archive_format: tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: agileplus-aarch64-apple-darwin
            archive_format: tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            asset_name: agileplus-x86_64-apple-darwin
            archive_format: tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: agileplus-x86_64-pc-windows-msvc
            archive_format: zip

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release binary
        run: cargo build --release --locked -p agileplus-cli --target ${{ matrix.target }}

      - name: Create distribution archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="dist/${{ matrix.asset_name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}" "$staging/"
          cp LICENSE "$staging/" 2>/dev/null || cp LICENSE.md "$staging/" 2>/dev/null || true
          mkdir -p release-artifacts
          tar -C dist -czf "release-artifacts/${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          ls -lh release-artifacts/

      - name: Create distribution archive (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          staging="dist/${{ matrix.asset_name }}"
          mkdir -p "$staging"
          cp "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}.exe" "$staging/"
          cp LICENSE "$staging/" 2>/dev/null || cp LICENSE.md "$staging/" 2>/dev/null || true
          mkdir -p release-artifacts
          cd dist && zip -r "../release-artifacts/${{ matrix.asset_name }}.zip" "${{ matrix.asset_name }}" && cd ..
          ls -lh release-artifacts/

      - name: Build MSI installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-wix --locked 2>&1 || true
          cd packaging
          cargo wix --insecure-uri -p agileplus-cli --output ../release-artifacts/ 2>&1 || {
            echo "cargo-wix build failed (WiX Toolset may not be installed on runner)"
            exit 0
          }
          ls -lh ../release-artifacts/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: release-artifacts/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish-crates:
    name: Publish to crates.io
    needs: [plan, build]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: arduino/setup-protoc@v3
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workspace crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh
