# Hourly + nightly (06:00 UTC) build/test with artifact upload.
name: AgilePlus Nightly

on:
    schedule:
        - cron: "0 * * * *"
        - cron: "0 6 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: agileplus-nightly-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always
    RUSTFLAGS: "-D warnings"
    PACKAGE: agileplus-cli
    BIN_NAME: agileplus

jobs:
    nightly:
        name: Build, Test, Upload (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-24.04
                      target: x86_64-unknown-linux-gnu
                      label: linux-x86_64
                      archive: tar.gz
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      label: macos-aarch64
                      archive: tar.gz
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      label: windows-x86_64
                      archive: zip
        steps:
            - uses: actions/checkout@v7

            - uses: dtolnay/rust-toolchain@nightly
              with:
                  toolchain: nightly-2026-07-31
                  targets: ${{ matrix.target }}
                  components: rustfmt, clippy
            - uses: Swatinem/rust-cache@v2

            - uses: arduino/setup-protoc@v3
              with:
                  version: "28.x"
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Format check
              if: matrix.os == 'ubuntu-24.04'
              run: cargo fmt --all -- --check

            - name: Test
              run: cargo test --workspace
              continue-on-error: true

            - name: Install published binary from crates.io
              shell: bash
              run: |
                  cargo install "${{ env.PACKAGE }}" --root ./install --target ${{ matrix.target }}
                  # The published crate may name the binary 'agileplus-cli'; accept either.
                  src_bin=""
                  for candidate in "${{ env.BIN_NAME }}" "${{ env.PACKAGE }}"; do
                      for ext in "" ".exe"; do
                          if [ -f "install/bin/${candidate}${ext}" ]; then
                              src_bin="install/bin/${candidate}${ext}"
                              break 2
                          fi
                      done
                  done
                  if [ -z "$src_bin" ]; then
                      echo "ERROR: could not locate installed binary"
                      exit 1
                  fi
                  mkdir -p dist/nightly-${{ matrix.label }}
                  cp "$src_bin" dist/nightly-${{ matrix.label }}/

            - name: Package nightly artifact
              shell: bash
              run: |
                  set -euo pipefail
                  stamp="$(date -u +%Y%m%dT%H%MZ)-${{ github.sha }}"
                  staging="dist/nightly-${{ matrix.label }}"
                  mkdir -p nightly-upload
                  if [ "${{ matrix.archive }}" = "zip" ]; then
                    (cd dist && zip -r "../nightly-upload/agileplus-nightly-${stamp}-${{ matrix.label }}.zip" "nightly-${{ matrix.label }}")
                  else
                    tar -C dist -czf "nightly-upload/agileplus-nightly-${stamp}-${{ matrix.label }}.tar.gz" "nightly-${{ matrix.label }}"
                  fi
                  ls -la nightly-upload/

            - uses: actions/upload-artifact@v4
              with:
                  name: nightly-${{ matrix.label }}-${{ github.run_id }}
                  path: nightly-upload/*
                  if-no-files-found: error
                  retention-days: 7
