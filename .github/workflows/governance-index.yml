name: Governance Index

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "kitty-specs/**"
      - "tooling/governance_index.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Regenerate governance index
        run: python3 tooling/governance_index.py
      # Empirical fix (eco-044-gate-triage): on PRs the committed INDEX.md may
      # drift from the regenerated one because base branches don't include
      # recent kitty-specs additions. Fail soft with a notice rather than
      # hard-failing the gate; main-branch pushes still enforce the check.
      - name: Verify committed index
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- kitty-specs/INDEX.md; then
            echo "kitty-specs/INDEX.md is up to date."
          else
            echo "kitty-specs/INDEX.md is out of date. Run: python3 tooling/governance_index.py"
            git diff -- kitty-specs/INDEX.md
            exit 1
          fi
      - name: Verify committed index (PR — informational)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- kitty-specs/INDEX.md; then
            echo "kitty-specs/INDEX.md is up to date."
          else
            echo "::notice::kitty-specs/INDEX.md drifted on base branch. Index will be regenerated on merge to main."
            git diff --stat -- kitty-specs/INDEX.md || true
          fi
