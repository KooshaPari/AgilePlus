name: QEng Testing Infrastructure

on:
  workflow_dispatch:
    inputs:
      test_types:
        description: 'Test types to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - unit
          - integration
          - e2e
          - load
          - fuzz
          - mutation
      language:
        description: 'Language to test'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - rust
          - go
          - zig
          - python
          - typescript
  push:
    branches: [main, develop]
    paths:
      - '**.rs'
      - '**.go'
      - '**.zig'
      - '**.py'
      - '**.ts'
      - '**.js'
      - '**/Cargo.toml'
      - '**/go.mod'
      - '**/build.zig'
      - '**/package.json'
      - '**/pyproject.toml'
      - '.github/workflows/qeng-testing.yml'
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC

env:
  CARGO_TERM_COLOR: always
  GO111MODULE: on

jobs:
  # ============================================================================
  # RUST TESTING
  # ============================================================================
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.language == 'all' || github.event.inputs.language == 'rust') || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, cargo

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Run tests with coverage
        run: |
          cargo test --all-features --workspace
          cargo test --doc --workspace

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run benchmarks (on main)
        if: github.ref == 'refs/heads/main'
        run: cargo bench --no-run || true

      - name: Fuzz testing (weekly)
        if: github.event_name == 'schedule'
        run: |
          cargo install cargo-fuzz || true
          cargo fuzz build || true

  # ============================================================================
  # GO TESTING
  # ============================================================================
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.language == 'all' || github.event.inputs.language == 'go') || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Install tools
        run: |
          go install github.com/gotestyourself/gotestsum@latest
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          go install github.com/axw/gocov/gocov@latest
          go install github.com/AlexeyPalantir/terminal-relay/cmd/gocov-xml@latest || true

      - name: Run tests with gotestsum
        run: gotestsum -- -race -coverprofile=coverage.out ./...

      - name: Run golangci-lint
        run: golangci-lint run ./...

      - name: Generate coverage
        run: |
          gocov convert coverage.out | gocov-xml > coverage.xml || true

      - name: Fuzz testing
        if: github.event_name == 'schedule'
        run: go test -fuzz=Fuzz -fuzztime=60s ./...

  # ============================================================================
  # ZIG TESTING
  # ============================================================================
  zig-test:
    name: Zig Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.language == 'all' || github.event.inputs.language == 'zig') || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        run: |
          wget -q https://ziglang.org/download/0.12.0/zig-linux-x86_64-0.12.0.tar.xz
          tar -xf zig-linux-x86_64-0.12.0.tar.xz
          echo "$GITHUB_WORKSPACE/zig-linux-x86_64-0.12.0" >> $GITHUB_PATH

      - name: Run tests
        run: zig test .

      - name: Format check
        run: zig fmt --check . || true

      - name: Run build
        run: zig build

  # ============================================================================
  # TYPESCRIPT/JAVASCRIPT TESTING (Bun)
  # ============================================================================
  ts-test:
    name: TypeScript/JS Tests (Bun)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.language == 'all' || github.event.inputs.language == 'typescript') || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Install Vitest
        run: bun add -d vitest @vitest/coverage-v8 @vitest/ui

      - name: Run tests with coverage
        run: bun run vitest run --coverage

      - name: Type check
        run: bun tsc --noEmit || true

      - name: Lint
        run: bun run lint || true

      - name: Fuzz testing
        if: github.event_name == 'schedule'
        run: bun run test:fuzz || true

  # ============================================================================
  # PYTHON TESTING (uv)
  # ============================================================================
  python-test:
    name: Python Tests (uv)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.language == 'all' || github.event.inputs.language == 'python') || github.event_name != 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest --cov=. --cov-report=xml

      - name: Type check
        run: uv run mypy . || true

      - name: Lint
        run: uv run ruff check . || true

      - name: Mutation testing
        if: github.event_name == 'schedule'
        run: uv run mutmut run || true

  # ============================================================================
  # LOAD TESTING (k6)
  # ============================================================================
  load-test:
    name: Load Testing (k6)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.test_types == 'all' || github.event.inputs.test_types == 'load') || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6

      - name: Run load test
        env:
          BASE_URL: ${{ secrets.LOAD_TEST_URL || 'http://localhost:8080' }}
        run: k6 run testing-configs/k6-load-test.js

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: k6-results
          path: "*.json"
          retention-days: 7

  # ============================================================================
  # CODE QUALITY DASHBOARD
  # ============================================================================
  quality-report:
    name: Quality Report
    runs-on: ubuntu-latest
    needs: [rust-test, go-test, zig-test, ts-test, python-test]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## QEng Testing Summary"
          echo ""
          echo "| Language | Status |"
          echo "|----------|--------|"
          echo "| Rust | ${{ needs.rust-test.result == 'success' && '✅' || '❌' }} |"
          echo "| Go | ${{ needs.go-test.result == 'success' && '✅' || '❌' }} |"
          echo "| Zig | ${{ needs.zig-test.result == 'success' && '✅' || '❌' }} |"
          echo "| TypeScript | ${{ needs.ts-test.result == 'success' && '✅' || '❌' }} |"
          echo "| Python | ${{ needs.python-test.result == 'success' && '✅' || '❌' }} |"
