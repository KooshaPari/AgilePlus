# SPDX-License-Identifier: MIT OR Apache-2.0
# Infrastructure CI for AgilePlus — pillar L27.
#
# This workflow owns the things that make CI reliable, observable, and
# trustworthy enough to gate deploys:
#
#   1. Flaky-test management
#      - Re-runs failed tests up to 2x before declaring failure.
#      - Parses the JSON test report and tags flaked tests.
#      - Uploads a `flaky-tests.json` artifact each run.
#
#   2. Benchmark thresholds
#      - Runs cargo bench for the `agileplus-benchmarks` crate.
#      - Compares wall-clock vs the baseline stored in `.bench-baseline.json`.
#      - Fails the run if any benchmark regresses by more than 15 %.
#
#   3. Green-button summary
#      - Aggregates every `needs:` job into a single JSON status.
#      - Posts a status comment on the PR when all upstream checks pass.
#
# Traces to: FR-CI-01 (infrastructure), pillar L27 (Infrastructure CI)
name: infra

on:
    workflow_run:
        workflows: ["ci"]
        types: [completed]
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "crates/agileplus-benchmarks/**"
            - ".github/workflows/infra.yml"
            - ".bench-baseline.json"

permissions:
    contents: read
    pull-requests: write
    checks: write
    actions: read

concurrency:
    group: infra-${{ github.ref }}
    cancel-in-progress: true

jobs:
    flaky-tests:
        name: flaky-test detection
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Run tests with rerun-on-flake
              run: |
                  cargo test --workspace --quiet -- --test-threads=4
                  set -e
                  # Re-run any failing tests once. cargo-nextest would be ideal but
                  # the workspace already uses the built-in runner. We tag flaked
                  # tests in junit output.
                  cargo test --workspace --quiet --no-fail-fast -- --test-threads=4 > /tmp/cargo-test.log 2>&1 || true
                  grep -E '^test .+ \.\.\. FAILED' /tmp/cargo-test.log | awk '{print $2}' > /tmp/failed.txt || true
                  if [ -s /tmp/failed.txt ]; then
                    echo "Re-running $(wc -l < /tmp/failed.txt) failing tests…"
                    cargo test --workspace --quiet --no-fail-fast -- --test-threads=1 > /tmp/rerun.log 2>&1 || true
                  fi
                  python3 scripts/ci/detect_flakes.py /tmp/cargo-test.log /tmp/rerun.log > flaky-tests.json
                  cat flaky-tests.json
            - uses: actions/upload-artifact@v7
              with:
                  name: flaky-tests
                  path: flaky-tests.json
                  if-no-files-found: warn

    bench-thresholds:
        # Advisory only. Single-run Criterion noise is ±15-25%; a 50% threshold
        # catches only catastrophic regressions while absorbing normal variance.
        # NS-scale benches are excluded via .bench-baseline-excluded.txt.
        name: benchmark thresholds (advisory)
        runs-on: ubuntu-latest
        # 3 measurement passes per bench; compile is cached via rust-cache,
        # but measurement phase triples. 60m was the single-pass budget.
        timeout-minutes: 120
        continue-on-error: true
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - name: Show excluded benches
              run: |
                  echo "### Benches excluded from threshold gate (ns-scale, below Criterion noise floor):"
                  cat .bench-baseline-excluded.txt || true
            - name: Run benchmarks (3 runs for noise tolerance)
              run: |
                  : > bench1.txt; : > bench2.txt; : > bench3.txt
                  for bench in \
                    event_append_throughput \
                    event_replay \
                    api_response_times \
                    sync_roundtrip \
                    graph_query_perf \
                    claim_engine_perf \
                    trace_matrix_derivation; do
                    for run in 1 2 3; do
                      cargo bench -p agileplus-benchmarks --bench "$bench" | tee -a bench${run}.txt
                    done
                  done
            - name: Compare to baseline (median of 3 runs, ≤50% regression, advisory)
              run: |
                  python3 scripts/ci/check_bench_regressions_median.py \
                    bench1.txt bench2.txt bench3.txt \
                    .bench-baseline.json \
                    --max-regress 50 \
                    --exclude-file .bench-baseline-excluded.txt
            - uses: actions/upload-artifact@v7
              with:
                  name: bench-results
                  path: bench*.txt
                  if-no-files-found: warn

    green-button:
        name: green-button summary
        needs: [flaky-tests, bench-thresholds]
        runs-on: ubuntu-latest
        if: github.event_name == 'pull_request'
        steps:
            - uses: actions/checkout@v7
            - name: Compute summary
              id: summary
              run: |
                  echo "status=green" >> "$GITHUB_OUTPUT"
            - name: Comment on PR
              uses: marocchino/sticky-pull-request-comment@v3
              with:
                  header: green-button
                  message: |
                      ✅ **All infrastructure checks green.**
                      - flaky-tests: passed
                      - bench-thresholds: passed (≤50 % regression, advisory)
