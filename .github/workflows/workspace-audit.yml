name: workspace-audit

on:
    pull_request:
        types: [opened, synchronize, reopened]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    workspace-audit:
        name: Workspace Path Dependency Audit
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Setup Python (for tomllib workspace audit)
              uses: actions/setup-python@v7
              with:
                  python-version: "3.12"

            # The workspace members are globbed (crates/*, libs/*) so a directory can
            # be added or removed without editing Cargo.toml. Real Cargo is the only
            # authority on whether the resulting graph resolves: duplicate package
            # names, missing manifests, and bad path dependencies all show up here.
            - uses: dtolnay/rust-toolchain@stable
              with:
                  toolchain: nightly-2026-07-31

            - name: Validate workspace resolves (cargo metadata)
              run: |
                  cargo metadata --no-deps --format-version 1 > /tmp/cargo-metadata.json
                  python3 -c 'import json; d=json.load(open("/tmp/cargo-metadata.json")); print("ok: workspace resolves with", len(d["workspace_members"]), "member(s)")'

            - name: Run workspace audit
              # Empirical fix (eco-044-gate-triage): the prior bash script used awk
              # to parse `members = [...]` from Cargo.toml and failed on inline
              # comments (e.g. `"rust", # agileplus-proto: tonic/prost gRPC stubs`),
              # treating the comment as part of the path. Replace with a real TOML
              # parser so trailing comments on member lines don't trip the check.
              run: |
                  python3 - <<'PY'
                  import glob, pathlib, sys, tomllib

                  cargo_toml = pathlib.Path("Cargo.toml")
                  with cargo_toml.open("rb") as fh:
                      data = tomllib.load(fh)

                  workspace = data.get("workspace") or {}
                  members = workspace.get("members") or []
                  if not members:
                      print("No workspace members found.")
                      sys.exit(0)

                  print("=== Workspace Members Check ===")
                  repo_root = pathlib.Path(".").resolve()
                  missing = []
                  for pattern in members:
                      if not isinstance(pattern, str):
                          continue
                      # Members may be globs (crates/*). Expand them, then require every
                      # matched directory to be a package so cargo will not choke on it.
                      matches = sorted(
                          p for p in glob.glob(str(repo_root / pattern))
                          if pathlib.Path(p).is_dir()
                      )
                      if not matches:
                          print(f"MISSING: {pattern} (no directories matched)")
                          missing.append(pattern)
                          continue
                      for match in matches:
                          match_path = pathlib.Path(match)
                          manifest = match_path / "Cargo.toml"
                          rel = match_path.relative_to(repo_root)
                          if not manifest.is_file():
                              print(f"MISSING: {rel}/Cargo.toml (matched by {pattern})")
                              missing.append(str(rel))
                          else:
                              print(f"OK:    {rel}")

                  if missing:
                      print("")
                      print("error: workspace audit found missing members/manifests. Fix before merging.")
                      sys.exit(1)

                  print("")
                  print("ok: all workspace members and manifests are present.")
                  PY
              env:
                  RUSTFLAGS: "-D warnings"
