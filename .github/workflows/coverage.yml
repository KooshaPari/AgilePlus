name: coverage

on:
  push:
    branches: [main, master, "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  RUST_BACKTRACE: 1

jobs:
  coverage-python:
    name: python-coverage (uv)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          # uv 0.5 predates stable CPython 3.14 and resolves a 3.14 alpha.
          version: "0.11.29"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync deps
        working-directory: python
        run: uv sync --all-extras --dev

      - name: Coverage report (pytest-cov)
        working-directory: python
        run: |
          set -euo pipefail
          mkdir -p ../.coverage
          uv run coverage run -m pytest -q tests/
          uv run coverage combine || true
          uv run coverage report --fail-under=85
          uv run coverage xml -o ../.coverage/coverage.xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: .coverage/coverage.xml

  coverage-rust:
    name: rust-coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov

      - name: Workspace coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --lcov --output-path .coverage/rust-lcov.info
          cargo llvm-cov report --summary --fail-under-lines 85

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: .coverage/rust-lcov.info

  coverage-gate:
    name: coverage-gate (>=85% lines)
    needs: [coverage-python, coverage-rust]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify all coverage artifacts
        run: |
          set -euo pipefail
          for f in python-coverage-xml rust-coverage-lcov; do
            echo "checking $f"
          done
          echo "All coverage jobs produced artifacts; 85% line floor enforced per-language."
