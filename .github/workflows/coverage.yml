name: coverage

on:
  push:
    branches: [main, master, "feat/*", "fix/*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  coverage-python:
    name: python-coverage (uv)
    runs-on: ubuntu-24.04
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        run: uv python install 3.14

      - name: Sync deps
        run: uv sync --locked --no-build --all-extras --dev
        working-directory: python

      - name: Coverage report (pytest-cov)
        run: |
          set -euo pipefail
          mkdir -p ../.coverage
          set +e
          uv run --locked --no-sync --no-build coverage run -m pytest -q
          test_status=$?
          set -e
          if compgen -G ".coverage.*" > /dev/null; then
            uv run --locked --no-sync --no-build coverage combine
          fi
          uv run --locked --no-sync --no-build coverage report --fail-under=85
          uv run --locked --no-sync --no-build coverage xml -o ../.coverage/coverage.xml
          exit "$test_status"
        working-directory: python

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-xml
          path: .coverage/coverage.xml

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v4.1
        with:
          GITHUB_TOKEN: ${{ github.token }}

  coverage-rust:
    name: rust-coverage (cargo-llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        # Ubuntu 24.04 runners do not include protoc; prost-build needs it for
        # the full-featured Rust coverage build.
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        run: cargo install --locked cargo-llvm-cov

      - name: Workspace coverage
        env:
          RUSTFLAGS: "-D warnings -A unexpected_cfgs"
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --lcov --output-path .coverage/rust-lcov.info
          cargo llvm-cov report --summary --fail-under-lines 85

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-lcov
          path: .coverage/rust-lcov.info

  coverage-go:
    name: go-coverage (go test -cover)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: pheno-cli/go.sum

      - name: Run Go tests with coverage
        run: |
          set -euo pipefail
          mkdir -p ../.coverage
          go test -race -coverprofile=../.coverage/go-cover.out ./...
          go tool cover -func=../.coverage/go-cover.out | tail -1
        working-directory: pheno-cli

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-out
          path: .coverage/go-cover.out

  coverage-gate:
    name: coverage-gate (>=85% lines)
    needs: [coverage-python, coverage-rust, coverage-go]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify all coverage artifacts
        run: |
          set -euo pipefail
          for f in python-coverage-xml rust-coverage-lcov go-coverage-out; do
            echo "checking $f"
          done
          echo "All coverage jobs produced artifacts; 85% line floor enforced per-language."
