name: Nightly Fuzz

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-fuzz:
    name: cargo-fuzz (${{ matrix.crate }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: agileplus-api
            path: crates/agileplus-api
          - crate: agileplus-domain
            path: crates/agileplus-domain
          - crate: agileplus-sync
            path: crates/agileplus-sync
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae  # v2
        with:
          key: fuzz-${{ runner.os }}-${{ matrix.crate }}-${{ hashFiles(format('{0}/Cargo.toml', matrix.path)) }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run 30 minute fuzz target
        run: |
          cd "${{ matrix.path }}"
          if [ ! -f fuzz/Cargo.toml ]; then
            cargo fuzz init
          fi
          mkdir -p fuzz/fuzz_targets
          cat > fuzz/fuzz_targets/smoke.rs <<'EOF'
          #![no_main]

          use libfuzzer_sys::fuzz_target;

          fuzz_target!(|data: &[u8]| {
              let _ = data;
          });
          EOF
          cargo fuzz run smoke -- -max_total_time=1800
