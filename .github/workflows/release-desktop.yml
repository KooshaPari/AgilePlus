# Tag-triggered release workflow for AgilePlus Desktop (Tauri 2).
# Builds platform bundles and uploads them to a GitHub Release.
name: Release Desktop

on:
  push:
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "crates/agileplus-domain/**"
      - "crates/agileplus-sqlite/**"
      - "crates/agileplus-application/**"

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: agileplus-desktop-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: agileplus-desktop-macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: agileplus-desktop-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: agileplus-desktop-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop-${{ matrix.target }}

      # ── Linux system dependencies ──────────────────────────────────
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── macOS code signing + notarization ────────────────────────────
      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Verify Certificate
        if: runner.os == 'macOS'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
            echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
            echo "Certificate imported: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found — build will be unsigned"
          fi

      # ── Frontend toolchain ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # ── Tauri build ────────────────────────────────────────────────
      - name: Build Tauri app (signed)
        if: env.CERT_ID != ''
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Build Tauri app (unsigned)
        if: env.CERT_ID == ''
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # ── Windows code signing ──────────────────────────────────────
      - name: Import Windows Certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Sign Windows Executable
        if: runner.os == 'Windows' && env.CERT_PATH != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi
          foreach ($file in $files) {
            Write-Host "Signing: $($file.FullName)"
            signtool sign /f $env:CERT_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 /d "AgilePlus Desktop" $file.FullName
          }

      # ── Stage artifacts ────────────────────────────────────────────
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="target/${{ matrix.target }}/release/bundle"
          staging="release-upload"
          mkdir -p "$staging"

          echo "Looking for bundles in: $bundle_dir"
          find "$bundle_dir" -type f 2>/dev/null | head -40 || true
          echo ""

          count=0
          while IFS= read -r -d '' f; do
            cp "$f" "$staging/"
            echo "  + $(basename "$f")"
            count=$((count + 1))
          done < <(find "$bundle_dir" -type f \( -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) -print0 2>/dev/null || true)

          if [ "$count" -eq 0 ]; then
            echo "::error::No bundle artifacts found under $bundle_dir"
            exit 1
          fi

          echo ""
          echo "Staged $count artifact(s) for upload:"
          ls -lh "$staging/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14

  universal-macos:
    name: Universal macOS Binary
    needs: build-desktop
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          name: agileplus-desktop-macos-aarch64
          path: macos-arm64

      - uses: actions/download-artifact@v4
        with:
          name: agileplus-desktop-macos-x86_64
          path: macos-x86_64

      - name: Extract and merge into universal binary
        run: |
          set -euo pipefail

          # ── Extract .app bundles from the .app.tar.gz archives ──────
          mkdir -p arm64-app x86_64-app

          ARM64_TAR=$(find macos-arm64 -name '*.app.tar.gz' | head -1)
          X86_64_TAR=$(find macos-x86_64 -name '*.app.tar.gz' | head -1)

          if [ -z "$ARM64_TAR" ] || [ -z "$X86_64_TAR" ]; then
            echo "::error::Could not find .app.tar.gz in both macOS artifacts"
            echo "arm64 files:   $(ls -R macos-arm64/)"
            echo "x86_64 files:  $(ls -R macos-x86_64/)"
            exit 1
          fi

          echo "ARM64 archive: $ARM64_TAR"
          echo "X86_64 archive: $X86_64_TAR"

          tar -xzf "$ARM64_TAR"  -C arm64-app
          tar -xzf "$X86_64_TAR" -C x86_64-app

          # Locate the .app bundles
          ARM64_APP=$(find arm64-app -maxdepth 1 -name '*.app' -type d | head -1)
          X86_64_APP=$(find x86_64-app -maxdepth 1 -name '*.app' -type d | head -1)

          echo "ARM64 app: $ARM64_APP"
          echo "X86_64 app: $X86_64_APP"

          # ── Build universal .app ──────────────────────────────────────
          UNIVERSAL_APP="AgilePlus Desktop.app"
          cp -R "$ARM64_APP" "$UNIVERSAL_APP"

          EXEC_NAME="agileplus-desktop"
          ARM64_BIN="$ARM64_APP/Contents/MacOS/$EXEC_NAME"
          X86_64_BIN="$X86_64_APP/Contents/MacOS/$EXEC_NAME"
          UNIVERSAL_BIN="$UNIVERSAL_APP/Contents/MacOS/$EXEC_NAME"

          lipo -create "$ARM64_BIN" "$X86_64_BIN" -output "$UNIVERSAL_BIN"
          echo "Merged binary:"
          file "$UNIVERSAL_BIN"
          lipo -info "$UNIVERSAL_BIN"

          # Merge any other Mach-O binaries in the bundle
          find "$UNIVERSAL_APP/Contents" -type f -perm +111 | while read -r f; do
            file_type=$(file -b "$f" | head -1)
            case "$file_type" in
              *Mach-O*)
                rel_path="${f#"$UNIVERSAL_APP/Contents/"}"
                arm64_variant="$ARM64_APP/Contents/$rel_path"
                if [ -f "$arm64_variant" ] && file -b "$arm64_variant" | grep -q 'Mach-O'; then
                  lipo -create "$f" "$arm64_variant" -output "$f" 2>/dev/null || true
                  echo "  + $rel_path"
                fi
                ;;
            esac
          done

          codesign --force --deep --sign - "$UNIVERSAL_APP" 2>/dev/null || true

          # ── Create universal DMG ─────────────────────────────────────
          # Collect existing per-arch DMGs for the release assets
          ARM64_DMG=$(find macos-arm64 -name '*.dmg' | head -1)
          X86_64_DMG=$(find macos-x86_64 -name '*.dmg' | head -1)

          DMG_FINAL="AgilePlus Desktop-universal.dmg"

          hdiutil create \
            -volname "AgilePlus Desktop" \
            -srcfolder "$UNIVERSAL_APP" \
            -ov \
            -format UDZO \
            "$DMG_FINAL"

          echo "Universal DMG: $DMG_FINAL"

          # Stage all artifacts for upload
          mkdir -p universal-output
          cp "$DMG_FINAL" universal-output/
          # Also include the per-architecture DMGs
          [ -n "${ARM64_DMG:-}" ]  && cp "$ARM64_DMG"  universal-output/ || true
          [ -n "${X86_64_DMG:-}" ] && cp "$X86_64_DMG" universal-output/ || true

          echo "Staged artifacts:"
          ls -lh universal-output/

      - uses: actions/upload-artifact@v4
        with:
          name: agileplus-desktop-macos-universal
          path: universal-output/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    needs: [build-desktop, universal-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          echo "Release assets:"
          ls -lh release-assets/
          echo ""
          echo "Total files: $(find release-assets -type f | wc -l)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
