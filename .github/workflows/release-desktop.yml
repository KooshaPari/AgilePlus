# Tag-triggered release workflow for AgilePlus Desktop (Tauri 2).
# Builds platform bundles and uploads them to a GitHub Release.
name: Release Desktop

on:
  push:
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "crates/agileplus-domain/**"
      - "crates/agileplus-sqlite/**"
      - "crates/agileplus-application/**"

permissions:
  contents: write
  attestations: write
  id-token: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-desktop:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: agileplus-desktop-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact_name: agileplus-desktop-macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact_name: agileplus-desktop-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: agileplus-desktop-windows-x86_64

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop-${{ matrix.target }}

      # ── Linux system dependencies ──────────────────────────────────
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # ── macOS code signing + notarization ────────────────────────────
      - name: Import Apple Developer Certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Verify Certificate
        if: runner.os == 'macOS'
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" || true)
          if [ -n "$CERT_INFO" ]; then
            CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
            echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
            echo "Certificate imported: $CERT_ID"
          else
            echo "::warning::No Developer ID Application certificate found — build will be unsigned"
          fi

      # ── Frontend toolchain ─────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # ── Tauri build ────────────────────────────────────────────────
      - name: Build Tauri app
        working-directory: desktop
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # ── Windows code signing ──────────────────────────────────────
      - name: Import Windows Certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [System.IO.File]::WriteAllBytes($certPath, [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Sign Windows Executable
        if: runner.os == 'Windows' && env.CERT_PATH != ''
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "desktop/src-tauri/target/${{ matrix.target }}/release/bundle" -Recurse -Include *.exe,*.msi
          foreach ($file in $files) {
            Write-Host "Signing: $($file.FullName)"
            signtool sign /f $env:CERT_PATH /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 /d "AgilePlus Desktop" $file.FullName
          }

      # ── Stage artifacts ────────────────────────────────────────────
      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          bundle_dir="desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          staging="release-upload"
          mkdir -p "$staging"

          count=0
          for pattern in \
            "$bundle_dir"/dmg/*.dmg \
            "$bundle_dir"/macos/*.app.tar.gz \
            "$bundle_dir"/deb/*.deb \
            "$bundle_dir"/rpm/*.rpm \
            "$bundle_dir"/appimage/*.AppImage \
            "$bundle_dir"/nsis/*.exe \
            "$bundle_dir"/msi/*.msi \
            ; do
            for f in $pattern; do
              [ -f "$f" ] || continue
              cp "$f" "$staging/"
              echo "  + $(basename "$f")"
              count=$((count + 1))
            done
          done

          if [ "$count" -eq 0 ]; then
            echo "::error::No bundle artifacts found under $bundle_dir"
            echo "Directory listing:"
            find "$bundle_dir" -type f 2>/dev/null | head -40 || true
            exit 1
          fi

          echo ""
          echo "Staged $count artifact(s) for upload:"
          ls -lh "$staging/"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Publish GitHub Release
    needs: build-desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          echo "Release assets:"
          ls -lh release-assets/
          echo ""
          echo "Total files: $(find release-assets -type f | wc -l)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
