name: Quality Gate (71-pillar)

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# TODO: set continue-on-error: false once all repos reach grade B
# This job is informational during BLOCK A bootstrap; per-check
# continue-on-error lets the summary table render even when individual
# pillars fail, so authors can see their ARS delta on every PR.

jobs:
  quality-gate-71:
    name: Quality Gate (71-pillar)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      QG_SCHEMA: quality-gate.toml
      PILLAR_RESULTS: ${{ github.workspace }}/.qg-pillar-results.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-git-

      - name: Init pillar results
        run: |
          echo "pillar | id | name | status | detail" > "$PILLAR_RESULTS"

      - name: Pillar 61 — CLAUDE.md exists
        id: pillar_61
        continue-on-error: true
        run: |
          if [ -f CLAUDE.md ] || [ -f AGENTS.md ]; then
            echo "61|61|context_density|PASS|CLAUDE.md/AGENTS.md present" >> "$PILLAR_RESULTS"
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "61|61|context_density|FAIL|neither CLAUDE.md nor AGENTS.md found" >> "$PILLAR_RESULTS"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Schema — quality-gate.toml valid
        id: pillar_schema
        continue-on-error: true
        run: |
          if [ ! -f "$QG_SCHEMA" ]; then
            echo "schema|schema|quality_gate_toml|FAIL|$QG_SCHEMA missing" >> "$PILLAR_RESULTS"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          python3 -c "import tomllib,sys; tomllib.loads(open('$QG_SCHEMA','rb').read()); print('toml-ok')" \
            || { python -c "import toml,sys; toml.loads(open('$QG_SCHEMA').read()); print('toml-ok')" \
                 || { echo "schema|schema|quality_gate_toml|FAIL|toml parse error" >> "$PILLAR_RESULTS"; echo "status=fail" >> "$GITHUB_OUTPUT"; exit 1; } }
          echo "schema|schema|quality_gate_toml|PASS|valid toml" >> "$PILLAR_RESULTS"
          echo "status=pass" >> "$GITHUB_OUTPUT"

      - name: Install cargo-machete
        id: install_machete
        continue-on-error: true
        run: cargo install --locked cargo-machete || true

      - name: Pillar — cargo machete (no unused deps)
        id: pillar_machete
        continue-on-error: true
        run: |
          if command -v cargo-machete >/dev/null 2>&1; then
            if cargo machete --skip-target-dir 2> "$PILLAR_RESULTS.machete.err"; then
              echo "machete|machete|no_unused_deps|PASS|no unused deps" >> "$PILLAR_RESULTS"
              echo "status=pass" >> "$GITHUB_OUTPUT"
            else
              echo "machete|machete|no_unused_deps|WARN|$(wc -l < "$PILLAR_RESULTS.machete.err) issues" >> "$PILLAR_RESULTS"
              echo "status=warn" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "machete|machete|no_unused_deps|SKIP|cargo-machete not installed" >> "$PILLAR_RESULTS"
            echo "status=skip" >> "$GITHUB_OUTPUT"
          fi

      - name: Pillar — domain deps subset of allowed_deps
        id: pillar_domain_purity
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, sys
          try:
              import tomllib
          except Exception:
              import toml as tomllib  # type: ignore
          cfg_path = "quality-gate.toml"
          with open(cfg_path, "rb") as f:
              cfg = tomllib.load(f)
          allowed = set(cfg["domain_purity"]["allowed_deps"])
          enforced = cfg["domain_purity"]["enforced_crates"]
          status = "PASS"
          details = []
          for crate in enforced:
              toml_path = f"crates/{crate}/Cargo.toml"
              if not os.path.exists(toml_path):
                  status = "WARN"
                  details.append(f"{crate}: cargo.toml missing")
                  continue
              with open(toml_path, "rb") as f:
                  dom = tomllib.load(f)
              declared = set((dom.get("dependencies") or {}).keys())
              extra = declared - allowed
              if extra:
                  status = "FAIL"
                  details.append(f"{crate} has extra deps: {sorted(extra)}")
              else:
                  details.append(f"{crate}: {len(declared)} deps all in allowed")
          line = f"purity|domain|deps_subset|{status}|{'; '.join(details)}"
          print(line)
          with open(os.environ["PILLAR_RESULTS"], "a") as out:
              out.write(line + "\n")
          sys.exit(0 if status == "PASS" else 1)
          PY
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Pillar — ADR count >= 1
        id: pillar_adrs
        continue-on-error: true
        run: |
          ADR_COUNT=$(find docs/adr -name "*.md" 2>/dev/null | wc -l | tr -d ' ')
          MIN=1
          if [ "$ADR_COUNT" -ge "$MIN" ]; then
            echo "adrs|min_adr_count|adrs_present|PASS|found $ADR_COUNT ADRs (min $MIN)" >> "$PILLAR_RESULTS"
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "adrs|min_adr_count|adrs_present|FAIL|found $ADR_COUNT ADRs (min $MIN)" >> "$PILLAR_RESULTS"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Pillar 66 — CONTRIBUTING.md exists
        id: pillar_66
        continue-on-error: true
        run: |
          if [ -f CONTRIBUTING.md ]; then
            echo "66|66|branch_strategy_clear|PASS|CONTRIBUTING.md present" >> "$PILLAR_RESULTS"
            echo "status=pass" >> "$GITHUB_OUTPUT"
          else
            echo "66|66|branch_strategy_clear|FAIL|CONTRIBUTING.md missing" >> "$PILLAR_RESULTS"
            echo "status=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Render pillar summary
        if: always()
        run: |
          {
            echo "## Quality Gate (71-pillar) — summary"
            echo ""
            echo "| Pillar | ID | Name | Status | Detail |"
            echo "|--------|----|------|--------|--------|"
            cat "$PILLAR_RESULTS" | awk -F'|' 'BEGIN{OFS="|"} {print "| " $1 " | " $2 " | " $3 " | " $4 " | " $5 " |"}'
            echo ""
            PASS=$(grep -c "|PASS|" "$PILLAR_RESULTS" || true)
            FAIL=$(grep -c "|FAIL|" "$PILLAR_RESULTS" || true)
            WARN=$(grep -c "|WARN|" "$PILLAR_RESULTS" || true)
            SKIP=$(grep -c "|SKIP|" "$PILLAR_RESULTS" || true)
            echo "PASS: $PASS | FAIL: $FAIL | WARN: $WARN | SKIP: $SKIP"
            echo ""
            echo "Bootstrap mode: continue-on-error: true (see file header TODO)."
          } >> "$GITHUB_STEP_SUMMARY"
