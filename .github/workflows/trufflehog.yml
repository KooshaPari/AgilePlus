name: TruffleHog Secrets Scan
on:
  push:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  pull_request:
    branches: [main, "chore/**", "feat/**", "fix/**"]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  trufflehog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@d03d0879a3d03548a000f6eb2640307f0815c3b3  # v3.92.0 — SHA-pinned (matches sast-quick.yml)
        with:
          extra_args: --only-verified