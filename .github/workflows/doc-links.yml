name: Doc Links

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check markdown links in docs/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: "22"
      - name: Install markdown-link-check
        run: npm install --silent --no-audit --no-fund --no-progress markdown-link-check@3.13.7
      - name: Write config
        run: |
          python3 - <<'PYEOF'
          import json, os
          cfg = {
            "ignorePatterns": [
              {"pattern": "^https?://localhost"},
              {"pattern": "^https?://127\\.0\\.0\\.1"},
              {"pattern": "^https?://0\\.0\\.0\\.0"},
              {"pattern": "^https?://example\\.com"},
              {"pattern": "^https?://www\\.iana\\.org"},
              {"pattern": "^https?://schemas\\."}
            ],
            "httpHeaders": [
              {
                "urls": ["https://github.com/"],
                "headers": {"User-Agent": "Mozilla/5.0 (doc-link-check)"}
              }
            ],
            "timeout": "20s",
            "retryOn429": True,
            "retryCount": 2
          }
          with open('/tmp/mlc-config.json', 'w') as f:
            json.dump(cfg, f, indent=2)
          print("Config written.")
          PYEOF
      - name: Run markdown-link-check on docs/
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          failed=0
          files=(docs/**/*.md)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No markdown files under docs/ - nothing to check."
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "::group::$f"
            if ! npx --no-install markdown-link-check --config /tmp/mlc-config.json "$f"; then
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "Doc link check failed for one or more files." >&2
            exit 1
          fi
