name: Publish Crate to crates.io

on:
  workflow_dispatch:
    inputs:
      crate:
        description: 'Crate name to publish (e.g., phenotype-error-core, phenotype-test-infra)'
        required: true
        type: string
      dry_run:
        description: 'Dry run (do not actually publish)'
        required: false
        type: boolean
        default: true

  push:
    tags:
      - 'phenotype-*-v*'
      - 'agileplus-*-v*'

env:
  RUST_VERSION: 'stable'
  CARGO_TERM_COLOR: always

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-action@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Parse tag (if triggered by tag)
        if: github.event_name == 'push'
        id: parse-tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          # Parse <crate>-v<version> format
          if [[ $TAG =~ ^(.+)-v(.+)$ ]]; then
            echo "crate=${BASH_REMATCH[1]}" >> $GITHUB_OUTPUT
            echo "version=${BASH_REMATCH[2]}" >> $GITHUB_OUTPUT
          else
            echo "Invalid tag format: $TAG"
            exit 1
          fi

      - name: Determine crate path
        id: crate-path
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            CRATE="${{ steps.parse-tag.outputs.crate }}"
          else
            CRATE="${{ inputs.crate }}"
          fi
          echo "crate=$CRATE" >> $GITHUB_OUTPUT

          # Find crate path
          if [ -d "crates/$CRATE" ]; then
            echo "path=crates/$CRATE" >> $GITHUB_OUTPUT
          elif [ -d "$CRATE" ]; then
            echo "path=$CRATE" >> $GITHUB_OUTPUT
          else
            # Search for Cargo.toml with matching package name
            PATH=$(find . -name "Cargo.toml" -exec grep -l "^name = \"$CRATE\"" {} \; | head -1 | xargs dirname)
            if [ -z "$PATH" ]; then
              echo "Error: Could not find crate $CRATE"
              exit 1
            fi
            echo "path=$PATH" >> $GITHUB_OUTPUT
          fi

      - name: Validate crate
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: |
          echo "Validating crate at ${{ steps.crate-path.outputs.path }}"
          cat Cargo.toml

      - name: Check formatting
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: cargo fmt -- --check

      - name: Run clippy
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: cargo test --all-features

      - name: Build documentation
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: cargo doc --no-deps

      - name: Verify package
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: |
          echo "=== Cargo.toml ==="
          cat Cargo.toml
          echo ""
          echo "=== Package contents ==="
          cargo package --list --allow-dirty

      - name: Check if crate exists on crates.io
        id: check-exists
        run: |
          CRATE="${{ steps.crate-path.outputs.crate }}"
          echo "Checking if $CRATE exists on crates.io..."
          if curl -s https://crates.io/api/v1/crates/$CRATE | grep -q '"id":"'$CRATE'"'; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Crate $CRATE already exists on crates.io"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Crate $CRATE does not exist on crates.io (will be new publish)"
          fi

      - name: Dry run publish
        if: inputs.dry_run
        working-directory: ${{ steps.crate-path.outputs.path }}
        run: |
          echo "Would publish crate: ${{ steps.crate-path.outputs.crate }}"
          echo "Location: ${{ steps.crate-path.outputs.path }}"
          echo "Dry run publish test:"
          cargo publish --dry-run

      - name: Publish to crates.io
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event_name == 'push' }}
        working-directory: ${{ steps.crate-path.outputs.path }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
        run: |
          if [ "${{ steps.check-exists.outputs.exists }}" = "false" ]; then
            echo "Publishing new crate to crates.io..."
            cargo publish --token $CARGO_REGISTRY_TOKEN
          else
            echo "Publishing new version to crates.io..."
            cargo publish --token $CARGO_REGISTRY_TOKEN
          fi

      - name: Wait for crates.io indexing
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event_name == 'push' }}
        run: |
          echo "Waiting for crates.io to index the new version..."
          sleep 30

      - name: Create GitHub Release
        if: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) || github.event_name == 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('{0}-v{1}', steps.crate-path.outputs.crate, steps.parse-tag.outputs.version || inputs.version) }}
          name: ${{ github.event_name == 'push' && github.ref_name || format('{0} v{1}', steps.crate-path.outputs.crate, steps.parse-tag.outputs.version || inputs.version) }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
