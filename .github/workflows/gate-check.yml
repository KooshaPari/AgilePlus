# Reusable workflow: quality gates for a release promotion.
# Contract: see .github/workflows/README.md ("gate-check.yml" section).
#
# Inputs:
#   language     (required, string) — Programming language
#   channel      (required, string) — Release channel (alpha, beta, stable)
#   risk_profile (required, string) — Risk profile (low, medium, high)
#
# Always runs: lint, test.
# Conditionally runs audit when channel == "stable" OR risk_profile == "high".
#
# Called by .github/workflows/promote.yml before publish.yml.
name: Quality Gate Check

on:
    workflow_call:
        inputs:
            language:
                required: true
                type: string
                description: "Programming language"
            channel:
                required: true
                type: string
                description: "Release channel (alpha, beta, stable)"
            risk_profile:
                required: true
                type: string
                description: "Risk profile (low, medium, high)"

permissions:
    contents: read

jobs:
    lint:
        name: Lint (${{ inputs.language }})
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v7
            - name: Set up toolchain
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
            - name: cargo fmt --check
              run: cargo fmt --all -- --check
            - name: cargo clippy
              run: cargo clippy --workspace --all-targets --locked -- -D warnings
              continue-on-error: false

    test:
        name: Test (${{ inputs.language }})
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v7
            - name: Set up toolchain
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
            - name: cargo test
              run: cargo test --workspace --locked --all-targets --no-fail-fast

    audit:
        name: Security audit
        if: ${{ inputs.channel == 'stable' || inputs.risk_profile == 'high' }}
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7
            - name: cargo-deny
              uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
              with:
                  command: check
                  arguments: --hide-inclusion-graph
            - name: cargo audit
              run: |
                  cargo install --locked cargo-audit
                  cargo audit --deny warnings
