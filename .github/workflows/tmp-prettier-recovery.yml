name: Temporary Prettier Recovery
on:
  push:
    branches:
      - spec/mature-product-contract-v2
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: spec/mature-product-contract-v2
          fetch-depth: 0
      - run: npm install --global prettier@3.6.2
      - name: Format changed supported files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          files_arg="$(git diff --diff-filter=ACMR --name-only origin/main...HEAD -- '*.md' '*.yml' '*.yaml' '*.json' '*.jsonc' '*.mdx')"
          if [ -z "$files_arg" ]; then exit 0; fi
          mapfile -t files <<<"$files_arg"
          ignore_args=()
          if [ -f .prettierignore ]; then ignore_args+=(--ignore-path .prettierignore); fi
          if [ -f .gitignore ] && [ ! -f .prettierignore ]; then ignore_args+=(--ignore-path .gitignore); fi
          prettier --write "${files[@]}" "${ignore_args[@]}"
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.md' '*.yml' '*.yaml' '*.json' '*.jsonc' '*.mdx'
          git commit -m "style(docs): apply scoped prettier"
          git push origin HEAD:spec/mature-product-contract-v2
