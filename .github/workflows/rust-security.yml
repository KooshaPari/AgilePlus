name: Rust Security

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "src/**", "rust/**"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "src/**", "rust/**"]

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Install cargo-audit
        uses: taiki-e/install-action@7769b73c2ec98c38dfcf2e18c83cfd4880c038c1
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@be5f7ba354c69107308c363c2374d3c64883a720
        with:
          components: clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: dtolnay/rust-toolchain@be5f7ba354c69107308c363c2374d3c64883a720
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
