name: Rust Security

permissions:
  contents: read
  security-events: write

on:
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "src/**", "rust/**"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", "crates/**", "src/**", "rust/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Cargo Audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Install cargo-audit
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912  # v2
        with:
          tool: cargo-audit@0.22.2
      - name: Run cargo audit
        run: cargo audit

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Checkout phenoShared sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/KooshaPari/phenoShared.git" \
            "${{ github.workspace }}/../phenoShared"
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3
        with:
          version: "28.x"
          repo-token: ${{ github.token }}
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
      - name: Checkout phenoShared sibling
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/KooshaPari/phenoShared.git" \
            "${{ github.workspace }}/../phenoShared"
      - uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # stable
        with:
          components: rustfmt
      - name: Format phenoShared (path dep neighbor — must be formatted before workspace check)
        run: cargo fmt --all --manifest-path "${{ github.workspace }}/../phenoShared/Cargo.toml"
      - run: cargo fmt --all -- --check
