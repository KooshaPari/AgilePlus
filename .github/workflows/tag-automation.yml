name: Tag Automation
# Delegates to phenoShared reusable workflow.
# See: https://github.com/KooshaPari/phenoShared/blob/main/.github/workflows/tag-automation.yml

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  tag:
    uses: KooshaPari/phenoShared/.github/workflows/tag-automation.yml@403be1debfce9729f4c7e99dcfab06716955ce71  # main
    permissions:
      contents: write
