name: Tag Automation
# Delegates to phenoShared reusable workflow.
# See: https://github.com/KooshaPari/phenoShared/blob/main/.github/workflows/tag-automation.yml

on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  tag:
    uses: KooshaPari/phenoShared/.github/workflows/tag-automation.yml@c3aee3361ff4888a8ced71c8861a8d54ae65fca0  # main
    permissions:
      contents: write
