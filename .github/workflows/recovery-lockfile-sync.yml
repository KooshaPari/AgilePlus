name: Recovery Lockfile Sync
on:
  push:
    branches: [spec/mature-product-contract-v2]
    paths: [".github/workflows/recovery-lockfile-sync.yml"]
permissions:
  contents: write
concurrency:
  group: recovery-lockfile-sync-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spec/mature-product-contract-v2
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Synchronize dependency graph without upgrading unrelated crates deliberately
        run: |
          cargo metadata --format-version 1 > /dev/null
          cargo tree --locked -p agileplus-sqlite --depth 1 > /dev/null
          git diff --check
          git status --short Cargo.lock
      - name: Commit resolved lockfile onto current branch without rewriting history
        run: |
          cp Cargo.lock "$RUNNER_TEMP/Cargo.lock.resolved"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin spec/mature-product-contract-v2
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/Cargo.lock.resolved" Cargo.lock
            git add Cargo.lock
            if git diff --cached --quiet; then
              echo "Cargo.lock already matches branch"
              exit 0
            fi
            git commit -m "fix(build): synchronize Cargo.lock for recovery acceptance"
            if git push origin HEAD:spec/mature-product-contract-v2; then
              echo "Updated Cargo.lock without force"
              exit 0
            fi
            echo "Branch advanced during attempt $attempt; retrying against remote"
            sleep 3
          done
          echo "Could not push lockfile without overwriting remote history" >&2
          exit 1
