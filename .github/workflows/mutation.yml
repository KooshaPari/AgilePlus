name: Mutation Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: cargo-mutants (agileplus-domain)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: mutants-${{ github.sha }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - name: Run cargo-mutants on agileplus-domain
        run: cargo mutants --manifest-path crates/agileplus-domain/Cargo.toml
        continue-on-error: true

      - name: List mutation results
        if: always()
        run: |
          if [ -f mutants.out ]; then
            echo "=== Mutation Results ==="
            cat mutants.out
          fi
          echo "---"
          ls -la mutants.out 2>/dev/null || echo "No mutants.out file"
          ls -la target/mutants/ 2>/dev/null || echo "No target/mutants/ directory"

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: |
            mutants.out
            target/mutants/
          retention-days: 14
