name: Mutation Testing & Fuzz Build Check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Fuzz targets live in crates/agileplus-domain/fuzz/ (5 targets):
#   parse_domain_config  — TOML/JSON AppConfig deserialization
#   parse_requirement_id — FromStr + constructor + JSON for domain types
#   api_types_deser      — JSON deserialization of API DTO types
#   sql_fragments        — Mock SQL sanitizer / tokenizer
#   state_machine        — FeatureState state machine transitions
# Run locally: cd crates/agileplus-domain && cargo +nightly fuzz run <target>

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    # Superseded runs are cancelled today, but every such cancellation is wasted
    # compute: the job never finishes, so it never produces mutants.out or the
    # mutation-report artifact. On `main` there is only ever one ref, so this
    # group never has legitimate concurrent work to supersede. Observed on
    # 2026-10-15: 12 of 12 runs on main concluded `cancelled`, none completed.
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    mutants:
        name: cargo-mutants (agileplus-domain)
        runs-on: ubuntu-latest
        # 180m still cancelled the job. Run 38830178393 (c505e863), job
        # 116746915954: "Found 653 mutants" at 00:34:52Z, still scoring
        # evaluation.rs at 03:33:59Z, then "The operation was canceled" at
        # 03:34:26Z. Cleanup killed cargo-mutants and an in-flight
        # credentials_file_store_integration_test. The 425/425 artifact is a
        # mid-run snapshot, not a finished campaign. Tail pace is ~38s per
        # mutant, so the ~228 not yet finished need ~144m (324m total).
        # 360 is the GitHub-hosted job maximum: about 36m of slack at that
        # pace, and the ceiling if a later mutant runs long.
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  cache-all-crates: true
                  key: mutants-${{ github.sha }}

            - name: Install cargo-mutants
              uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
              with:
                  tool: cargo-mutants

            - name: Run cargo-mutants on agileplus-domain
              run: cargo mutants --manifest-path crates/agileplus-domain/Cargo.toml
              continue-on-error: true

            - name: List mutation results
              if: always()
              run: |
                  if [ -f mutants.out ]; then
                    echo "=== Mutation Results ==="
                    cat mutants.out
                  fi
                  echo "---"
                  ls -la mutants.out 2>/dev/null || echo "No mutants.out file"
                  ls -la target/mutants/ 2>/dev/null || echo "No target/mutants/ directory"

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report
                  path: |
                      mutants.out
                      target/mutants/
                  retention-days: 14

    fuzz-check:
        name: cargo-fuzz build check (agileplus-domain)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust (nightly)
              uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
              with:
                  targets: x86_64-unknown-linux-musl

            - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  cache-all-crates: true
                  key: fuzz-${{ github.sha }}

            - name: Install cargo-fuzz
              uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
              with:
                  tool: cargo-fuzz

            - name: Install libdbus development files
              # keyring 3.6.3's sync-secret-service backend links against the
              # system libdbus via libdbus-sys, which resolves it with
              # pkg-config. Without this the fuzz target build fails with
              # "The file `dbus-1.pc` needs to be installed".
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libdbus-1-dev pkg-config

            - name: Build fuzz targets (agileplus-domain)
              run: >-
                  cargo +nightly fuzz build --target "$(rustc +nightly -vV | sed -n 's/^host: //p')"
              working-directory: crates/agileplus-domain
              env:
                  # AddressSanitizer cannot run with musl's statically linked libc.
                  RUSTFLAGS: "-C target-feature=-crt-static"
