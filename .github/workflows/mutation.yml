name: Mutation Testing & Fuzz Build Check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Fuzz targets live in crates/agileplus-domain/fuzz/ (5 targets):
#   parse_domain_config  — TOML/JSON AppConfig deserialization
#   parse_requirement_id — FromStr + constructor + JSON for domain types
#   api_types_deser      — JSON deserialization of API DTO types
#   sql_fragments        — Mock SQL sanitizer / tokenizer
#   state_machine        — FeatureState state machine transitions
# Run locally: cd crates/agileplus-domain && cargo +nightly fuzz run <target>

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    # Superseded runs are cancelled today, but every such cancellation is wasted
    # compute: the job never finishes, so it never produces mutants.out or the
    # mutation-report artifact. On `main` there is only ever one ref, so this
    # group never has legitimate concurrent work to supersede. Observed on
    # 2026-10-15: 12 of 12 runs on main concluded `cancelled`, none completed.
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    mutants:
        name: cargo-mutants (agileplus-domain)
        runs-on: ubuntu-latest
        # Keep the GitHub-hosted maximum of 360 minutes. The campaign does not
        # fit in less, so lowering the ceiling cannot make this check pass --
        # it only terminates the campaign earlier with strictly less work done
        # and still no published report.
        #
        # Evidence:
        #  * Run 38830178393 (c505e863), job 116746915954: "Found 653 mutants"
        #    at 00:34:52Z, still scoring evaluation.rs at 03:33:59Z, then "The
        #    operation was canceled" at 03:34:26Z; the job record shows
        #    started_at 2026-10-16T00:33:52Z, completed_at 03:34:38Z,
        #    conclusion "cancelled" -- i.e. it was killed by the then-180m
        #    timeout, and the 03:34Z timestamp is the wall-clock cancellation
        #    time, not an elapsed duration. Cleanup killed
        #    cargo-mutants and an in-flight
        #    credentials_file_store_integration_test. The 425/425 artifact is a
        #    mid-run snapshot, not a finished campaign. Tail pace is ~38s per
        #    mutant, so the ~228 not yet finished need ~144m more (324m total).
        #  * Run 40458764122 (main push, 2026-10-27): cargo-mutants job
        #    2026-10-27T06:03:43Z -> 11:32:10Z = 5h28m27s, ended failed with
        #    neither a job log nor a mutants.out artifact, i.e. the runner was
        #    lost before the "List mutation results" / "Upload mutation report"
        #    steps could run. The campaign was still going at 328 minutes.
        #  * Run 40459020348 (dependabot/cargo/gix-0.90.0, 2026-10-27):
        #    cargo-mutants job 2026-10-27T06:08:57Z -> 11:38:36Z = 5h29m39s,
        #    same failure shape. Still going at 329 minutes.
        # So the workload needs more than 329 minutes of wall clock and 360
        # minutes is the only value that leaves room for it to finish.
        #
        # Making this check green therefore requires scoping or sharding the
        # campaign (fewer mutants per job, or a non-blocking job), which is a
        # separate change with its own risk. See CF-2 in
        # docs/sessions/20261017-state-forward-docket/.
        timeout-minutes: 360
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  cache-all-crates: true
                  key: mutants-${{ github.sha }}

            - name: Install cargo-mutants
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-mutants

            - name: Run cargo-mutants on agileplus-domain
              run: cargo mutants --manifest-path crates/agileplus-domain/Cargo.toml
              continue-on-error: true

            - name: List mutation results
              if: always()
              run: |
                  if [ -f mutants.out ]; then
                    echo "=== Mutation Results ==="
                    cat mutants.out
                  fi
                  echo "---"
                  ls -la mutants.out 2>/dev/null || echo "No mutants.out file"
                  ls -la target/mutants/ 2>/dev/null || echo "No target/mutants/ directory"

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report
                  path: |
                      mutants.out
                      target/mutants/
                  retention-days: 14

    fuzz-check:
        name: cargo-fuzz build check (agileplus-domain)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust (nightly)
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: x86_64-unknown-linux-musl

            - uses: Swatinem/rust-cache@v2
              with:
                  cache-all-crates: true
                  key: fuzz-${{ github.sha }}

            - name: Install cargo-fuzz
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-fuzz

            - name: Build fuzz targets (agileplus-domain)
              run: >-
                  cargo +nightly fuzz build --target "$(rustc +nightly -vV | sed -n 's/^host: //p')"
              working-directory: crates/agileplus-domain
              env:
                  # AddressSanitizer cannot run with musl's statically linked libc.
                  RUSTFLAGS: "-C target-feature=-crt-static"
