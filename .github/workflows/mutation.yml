name: Mutation Testing & Fuzz Build Check

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

# Fuzz targets live in crates/agileplus-domain/fuzz/ (5 targets):
#   parse_domain_config  — TOML/JSON AppConfig deserialization
#   parse_requirement_id — FromStr + constructor + JSON for domain types
#   api_types_deser      — JSON deserialization of API DTO types
#   sql_fragments        — Mock SQL sanitizer / tokenizer
#   state_machine        — FeatureState state machine transitions
# Run locally: cd crates/agileplus-domain && cargo +nightly fuzz run <target>

permissions:
    contents: read

concurrency:
    group: mutation-${{ github.ref }}
    # Superseded runs are cancelled today, but every such cancellation is wasted
    # compute: the job never finishes, so it never produces mutants.out or the
    # mutation-report artifact. On `main` there is only ever one ref, so this
    # group never has legitimate concurrent work to supersede. Observed on
    # 2026-10-15: 12 of 12 runs on main concluded `cancelled`, none completed.
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    mutants:
        name: cargo-mutants (agileplus-domain)
        runs-on: ubuntu-latest
        # Keep the GitHub-hosted maximum of 360 minutes. The campaign does not
        # fit in less, so lowering the ceiling cannot make this check pass --
        # it only terminates the campaign earlier with strictly less work done
        # and still no published report.
        #
        # Evidence:
        #  * Run 38830178393 (c505e863), job 116746915954: "Found 653 mutants"
        #    at 00:34:52Z, still scoring evaluation.rs at 03:33:59Z, then "The
        #    operation was canceled" at 03:34:26Z; the job record shows
        #    started_at 2026-10-16T00:33:52Z, completed_at 03:34:38Z,
        #    conclusion "cancelled" -- i.e. it was killed by the then-180m
        #    timeout, and the 03:34Z timestamp is the wall-clock cancellation
        #    time, not an elapsed duration. Cleanup killed
        #    cargo-mutants and an in-flight
        #    credentials_file_store_integration_test. The 425/425 artifact is a
        #    mid-run snapshot, not a finished campaign. Tail pace is ~38s per
        #    mutant, so the ~228 not yet finished need ~144m more (324m total).
        #  * Run 40458764122 (main push, 2026-10-27): cargo-mutants job
        #    2026-10-27T06:03:43Z -> 11:32:10Z = 5h28m27s, ended failed with
        #    neither a job log nor a mutants.out artifact, i.e. the runner was
        #    lost before the "List mutation results" / "Upload mutation report"
        #    steps could run. The campaign was still going at 328 minutes.
        #  * Run 40459020348 (dependabot/cargo/gix-0.90.0, 2026-10-27):
        #    cargo-mutants job 2026-10-27T06:08:57Z -> 11:38:36Z = 5h29m39s,
        #    same failure shape. Still going at 329 minutes.
        # So the workload needs more than 329 minutes of wall clock and 360
        # minutes is the only value that leaves room for it to finish.
        #
        # That sharding change is what this PR does. The same 653-mutant
        # campaign is split four ways with --shard k/4, so each job needs about a
        # quarter of the wall clock: at the measured ~38s per mutant that is
        # ~104 min per shard, comfortably inside a hosted runner's reliable
        # lifetime and inside the 240-minute ceiling below. fail-fast is false so
        # one lost shard cannot cancel the others, and the artifact name carries
        # the shard index so the four uploads cannot collide.
        #
        # Shard indices are ZERO-BASED: cargo-mutants rejects --shard k/n unless
        # k < n, so the valid four-way split is 0/4, 1/4, 2/4, 3/4. Verified
        # locally with --list: 0/4=164, 1/4=164, 2/4=164, 3/4=161, total 653.
        # Using 1..4 silently makes shard 4 an instant no-op that still reports
        # green, which is why the "Verify the shard produced results" step below
        # exists.
        timeout-minutes: 240
        strategy:
            fail-fast: false
            matrix:
                shard: [0, 1, 2, 3]
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust (stable)
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  cache-all-crates: true
                  key: mutants-${{ github.sha }}

            - name: Install cargo-mutants
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-mutants

            - name: Run cargo-mutants on agileplus-domain
              id: mutants
              # Do not use continue-on-error: it discards the exit code, and the
              # exit code is the only way to tell "campaign ran, found problems"
              # apart from "tests were already failing" or "internal error".
              # Record it and let the guard decide.
              #
              # src/ports/execution.rs is excluded because its only mutants are
              # AtomicAcceptancePort trait-STUB defaults (`Err(NotImplemented)`).
              # Replacing them with Ok(None)/Ok(Default::default()) either fails to
              # compile (no Default on the receipt types -> unviable, zero value) or
              # makes cargo's type inference blow up. Evidence, run 40983475780
              # shard 3, both attempts: mutant order is deterministic and ascending,
              # and both attempts completed exactly 48 mutants then stalled 12-16 min
              # at the next entry, ports/execution.rs:70:9. Locally the same three
              # mutants finish in 3m (1 missed, 2 unviable), so the stall is
              # build-side, not test-side. --build-timeout caps that class of stall
              # and turns it into a TIMEOUT instead of an unkillable hang.
              run: |
                  set +e
                  cargo mutants --manifest-path crates/agileplus-domain/Cargo.toml --exclude "src/intent_graph.rs" --exclude "src/ports/mod.rs" --exclude "src/ports/execution.rs" --timeout 120 --build-timeout 300 --shard ${{ matrix.shard }}/4
                  rc=$?
                  echo "cargo-mutants exit code: $rc"
                  echo "rc=$rc" >> "$GITHUB_OUTPUT"
                  exit 0

            - name: List mutation results
              if: always()
              run: |
                  # cargo-mutants writes mutants.out as a DIRECTORY containing
                  # caught.txt, missed.txt, timeout.txt, unviable.txt,
                  # mutants.json and outcomes.json. `cat mutants.out` on the
                  # directory (the previous form) never worked.
                  ls -la mutants.out 2>/dev/null || echo "No mutants.out directory"
                  for f in missed.txt timeout.txt unviable.txt; do
                    if [ -f "mutants.out/$f" ]; then
                      echo "=== $f ($(wc -l < "mutants.out/$f") entries) ==="
                      cat "mutants.out/$f"
                    fi
                  done
                  if [ -f mutants.out/caught.txt ]; then
                    echo "=== caught.txt: $(wc -l < mutants.out/caught.txt) entries ==="
                  fi

            - name: Verify the shard produced results
              # Decides pass/fail from evidence rather than from file presence.
              # Three independent things must hold:
              #
              # 1. mutants.out exists -- it is a DIRECTORY, so -e not -f. An
              #    earlier version used -f and failed shards that had completed.
              # 2. The campaign finished. outcomes.json is NOT a completion
              #    signal on its own: cargo-mutants rewrites it after every
              #    mutant (output.rs write_lab_outcome is "Called multiple times
              #    as the lab runs, and once at the end"). LabOutcome.end_time is
              #    None until finish() sets it, so end_time is the real marker.
              # 3. The exit code is one that means "the campaign ran". cargo-
              #    mutants exit codes: 0 all caught, 1 usage, 2 missed mutants,
              #    3 test timeout, 4 BASELINE FAILED (tests already red on an
              #    unmutated tree), 5/6 filter-diff problems, 70 internal error.
              #    Only 0/2/3 say the campaign executed; 4 and 70 in particular
              #    mean the numbers are meaningless and must not pass.
              #
              # Missed mutants (2) and per-mutant timeouts (3) are tolerated on
              # purpose: this crate currently has 52 pre-existing misses outside
              # this PR's scope (acceptance.rs 33, execution.rs 6, evaluation.rs
              # 5, keychain.rs 5, memory.rs 2, feature.rs 1) and blocking on them
              # would make the check permanently red for reasons unrelated to
              # any given diff. governance_evaluator.rs, the file this PR is
              # about, has 0 misses.
              run: |
                  set -euo pipefail
                  rc="${{ steps.mutants.outputs.rc }}"
                  shard="${{ matrix.shard }}"

                  if [ ! -e mutants.out ]; then
                    echo "::error::cargo-mutants produced no mutants.out; shard $shard/4 did not run"
                    exit 1
                  fi
                  if [ ! -f mutants.out/outcomes.json ]; then
                    echo "::error::mutants.out exists but outcomes.json is missing; shard $shard/4 did not finish"
                    exit 1
                  fi

                  end_time="$(jq -r '.end_time // empty' mutants.out/outcomes.json)"
                  if [ -z "$end_time" ]; then
                    echo "::error::outcomes.json has no end_time, so shard $shard/4 did not finish"
                    jq -r '"progress: \(.caught) caught of \(.total_mutants) mutants"' mutants.out/outcomes.json
                    exit 1
                  fi

                  case "$rc" in
                    0|2|3)
                      echo "cargo-mutants exit code $rc is an acceptable campaign outcome"
                      ;;
                    "")
                      echo "::error::no cargo-mutants exit code recorded; the run step was cancelled or never completed, so shard $shard/4 is not trustworthy"
                      exit 1
                      ;;
                    *)
                      echo "::error::cargo-mutants exited $rc (1=usage, 4=baseline tests failed, 5/6=filter-diff, 70=internal error); shard $shard/4 results are not trustworthy"
                      exit 1
                      ;;
                  esac

                  jq -r --arg shard "$shard" '"shard \($shard)/4 finished at \(.end_time) with exit code '"$rc"': total=\(.total_mutants) caught=\(.caught) missed=\(.missed) timeout=\(.timeout) unviable=\(.unviable)"' mutants.out/outcomes.json

            - name: Upload mutation report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: mutation-report-shard-${{ matrix.shard }}
                  path: |
                      mutants.out
                      target/mutants/
                  retention-days: 14

    fuzz-check:
        name: cargo-fuzz build check (agileplus-domain)
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v7

            - name: Install Rust (nightly)
              uses: dtolnay/rust-toolchain@nightly
              with:
                  targets: x86_64-unknown-linux-musl

            - uses: Swatinem/rust-cache@v2
              with:
                  cache-all-crates: true
                  key: fuzz-${{ github.sha }}

            - name: Install cargo-fuzz
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-fuzz

            - name: Build fuzz targets (agileplus-domain)
              run: >-
                  cargo +nightly fuzz build --target "$(rustc +nightly -vV | sed -n 's/^host: //p')"
              working-directory: crates/agileplus-domain
              env:
                  # AddressSanitizer cannot run with musl's statically linked libc.
                  RUSTFLAGS: "-C target-feature=-crt-static"
