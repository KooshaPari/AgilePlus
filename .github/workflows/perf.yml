name: perf

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perf-proc:
    # Advisory. P95 budget enforcement was a PR blocker but k6 stack + budget
    # values have drifted; we keep the report and surface it as a comment.
    name: perf (k6 → 95p budget, advisory)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node + Python
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install k6
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yq gnupg ca-certificates
          curl -fsSL https://github.com/grafana/k6/releases/download/v0.50.0/k6-v0.50.0-linux-amd64.tar.gz \
            | tar -xz --strip-components=1 -C /usr/local/bin k6-v0.50.0-linux-amd64/k6
          k6 version

      - name: Bring up stack
        run: |
          set -euo pipefail
          docker compose -f compose/docker-compose.yml up -d --wait
          process-compose -f compose/process-compose.phase.yml up -d
          bash ./scripts/perf/warmup.sh

      - name: Run k6 (smoke + load + stress)
        run: |
          set -euo pipefail
          mkdir -p .perf-reports
          for scenario in smoke load stress; do
            echo "## Running k6 $scenario"
            k6 run \
              --out json=.perf-reports/$scenario.json \
              --summary-export=.perf-reports/$scenario-summary.json \
              ./perf/${scenario}.js
          done

      - name: Enforce p95 budget
        # Advisory only — failures here post a PR comment, do not block merge.
        run: |
          set +e
          python ./scripts/perf/check_budget.py \
            --summary .perf-reports/load-summary.json \
            --budget-file ./perf/budget.json
          budget_exit=$?
          echo "budget_exit=${budget_exit}" >> "$GITHUB_OUTPUT"
          exit 0  # always succeed; the comment step below handles reporting
        id: budget

      - name: Post perf budget status to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: perf-budget
          message: |
              ${{ steps.budget.outputs.budget_exit == '0' && '✅' || '⚠️' }} **Perf budget: ${{ steps.budget.outputs.budget_exit == '0' && 'within budget' || 'EXCEEDED (advisory)' }}**
              See workflow artifacts for full k6 summary.

      - name: Bring down stack
        if: always()
        run: |
          process-compose -f compose/process-compose.phase.yml down || true
          docker compose -f compose/docker-compose.yml down --remove-orphans -v || true

      - name: Upload perf reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-reports-${{ github.run_id }}
          path: |
            .perf-reports/**
            !.perf-reports/node_modules/**

  # perf-qe-gate removed: was a hard 100% PR-blocker cascading from perf-proc
  # failures. perf-proc is now advisory (continue-on-error: true) and posts a
  # PR comment instead of failing the workflow.
