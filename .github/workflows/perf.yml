name: perf

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: perf-${{ github.ref }}
    cancel-in-progress: true

jobs:
    perf-proc:
        name: perf (T118 real HTTP; warning targets)
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"
            - name: Validate measurement harness
              run: python -m unittest discover -s scripts/perf -p 'test_*.py' -v
            - name: Install protoc
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y protobuf-compiler
                  protoc --version
            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
            - uses: arduino/setup-protoc@v3
              with:
                  version: "28.x"
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
            - name: Build real release API
              run: cargo build --locked --release -p agileplus-api --bin agileplus-api
            - name: Measure isolated loopback HTTP workload
              run: |
                  python scripts/perf/http_benchmark.py \
                    --binary target/release/agileplus-api \
                    --report-dir .perf-reports
            - name: Upload measurements and API log
              if: always()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: perf-reports-${{ github.run_id }}
                  path: .perf-reports/
                  include-hidden-files: true
                  if-no-files-found: error

    perf-qe-gate:
        name: perf-qe-gate (execution integrity)
        needs: [perf-proc]
        runs-on: ubuntu-24.04
        if: always()
        steps:
            - name: Require complete real HTTP execution
              env:
                  PERF_RESULT: ${{ needs.perf-proc.result }}
              run: |
                  if [ "$PERF_RESULT" != "success" ]; then
                    echo "::error::Real HTTP measurement failed or did not complete."
                    exit 1
                  fi
                  echo "HTTP measurement completed; T118 latency targets remain warning-level."
