# .github/workflows/pre-commit.yml — L2 #33
# Runs pre-commit (auto + manual stages) on every PR + push to main.
# Manual stage pulls in clippy / golangci-lint / tsc / eslint so the
# slow checks are gated to CI (not local commits).
name: pre-commit

on:
  push:
    branches: [main, master, integration/consolidate]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: Clone phenoShared sibling (required by cargo hooks)
        run: |
          git clone --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/KooshaPari/phenoShared.git" \
            "${{ github.workspace }}/../phenoShared"
      - name: Install Node.js for tsc hook
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4.2.0
        with:
          node-version: '20'
      - name: Install TypeScript for tsc hook
        run: npm install -g typescript
      - name: Run pre-commit (auto + manual stages)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        with:
          extra_args: --hook-stage manual --all-files
