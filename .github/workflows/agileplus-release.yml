# Manual-trigger release for agileplus-cli (build matrix + crates.io publish).
# The tag-triggered GitHub Release is owned by .github/workflows/release.yml
# (cargo-dist). This workflow remains the manual fallback for:
#   * building the 4-OS CLI matrix (used by hand for hotfixes)
#   * publishing the workspace crates to crates.io (publish-crates.sh)
#
# If you push a tag, cargo-dist publishes the GitHub Release; this
# workflow's publish-crates job still runs and ships the crates.
# See release-lifecycle-v2 audit R1 for the consolidation rationale.
name: AgilePlus Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agileplus-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""
  PACKAGE: agileplus-cli
  BIN_NAME: agileplus

jobs:
  build-matrix:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            asset_name: agileplus-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            asset_name: agileplus-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
            asset_name: agileplus-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            asset_name: agileplus-windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Build from source
        run: |
          cargo build --release --package ${{ env.PACKAGE }} --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging="dist/${{ matrix.asset_name }}"
          mkdir -p "$staging"
          # The built binary is named by [[bin]] target (`agileplus`) or the
          # package name (`agileplus-cli`). Accept either.
          src_bin=""
          for candidate in "${{ env.BIN_NAME }}" "${{ env.PACKAGE }}"; do
            for ext in "" ".exe"; do
              if [ -f "target/${{ matrix.target }}/release/${candidate}${ext}" ]; then
                src_bin="target/${{ matrix.target }}/release/${candidate}${ext}"
                break 2
              fi
            done
          done
          if [ -z "$src_bin" ]; then
            echo "ERROR: could not find built binary" >&2
            find target/${{ matrix.target }}/release/ -maxdepth 1 -type f 2>&1
            exit 1
          fi
          dest_name="${{ env.BIN_NAME }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "$src_bin" "$staging/${dest_name}.exe"
          else
            cp "$src_bin" "$staging/${dest_name}"
          fi
          cp LICENSE "$staging/" 2>/dev/null || cp LICENSE.md "$staging/" 2>/dev/null || true
          cp docs/INSTALL.md "$staging/" 2>/dev/null || true
          mkdir -p release-upload
          if [ "${{ matrix.archive }}" = "zip" ]; then
            # windows-latest's Git Bash does not ship a `zip` binary on PATH
            # (only tar/gzip are guaranteed); use PowerShell's native
            # Compress-Archive instead of depending on an external tool.
            pwsh -NoLogo -NoProfile -Command "Compress-Archive -Path 'dist/${{ matrix.asset_name }}' -DestinationPath 'release-upload/agileplus-${version}-${{ matrix.asset_name }}.zip' -Force"
          else
            tar -C dist -czf "release-upload/agileplus-${version}-${{ matrix.asset_name }}.tar.gz" "${{ matrix.asset_name }}"
          fi
          ls -la release-upload/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 14

  publish-crates:
    name: Publish to crates.io
    needs: build-matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          version: "28.x"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish workspace crates (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: bash scripts/publish-crates.sh
