name: Security

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: "0 2 * * *" # Daily at 2am UTC
    workflow_dispatch:

concurrency:
    group: security-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    # ─── Cargo Audit ──────────────────────────────────────────────────────
    cargo-audit:
        name: Cargo Audit
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            checks: write
            # rustsec/audit-check@v2 creates one GitHub issue per advisory
            # (incl. informational) when triggered on `schedule:`. Without
            # `issues: write` the POST /repos/.../issues call returns
            # "Resource not accessible by integration" and fails the step
            # even though `cargo audit` itself reports "No vulnerabilities".
            issues: write
        steps:
            - uses: actions/checkout@v7
            - uses: rustsec/audit-check@v2.0.0
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

    # ─── Cargo Deny ───────────────────────────────────────────────────────
    cargo-deny:
        name: Cargo Deny
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - name: Install cargo-deny
              run: cargo install cargo-deny
            - name: Check advisories, licenses, duplicates
              run: cargo deny check

    # ─── Gitleaks Secret Detection ────────────────────────────────────────
    gitleaks:
        name: Gitleaks
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # ─── CodeQL SAST ──────────────────────────────────────────────────────
    codeql:
        name: CodeQL
        runs-on: ubuntu-24.04
        permissions:
            contents: read
            security-events: write
        strategy:
            matrix:
                language: [python] # cpp removed: not in repo
        steps:
            - uses: actions/checkout@v7
            - uses: github/codeql-action/init@v4
              with:
                  languages: ${{ matrix.language }}
            - uses: github/codeql-action/analyze@v4

    # ─── Python Security (bandit) ─────────────────────────────────────────
    python-security:
        name: Python Security
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                  python-version: "3.14"
            - name: Install bandit
              run: pip install bandit[toml]
            - name: Run bandit
              run: bandit -r python/src -ll
              continue-on-error: true

    # ─── OSV-Scanner (Rust lockfile; repo does not commit Cargo.lock) ───────
    # 2026-10-11 — Advisory-only while the dep-upgrade campaign reduces the
    # 49 known findings (3 critical, 19 high, 27 moderate as of push to
    # `005d7e43`). Tracking issue: #1107.
    # SARIF still uploads to Code Scanning so the dashboard reflects findings;
    # only the workflow-level red-button is suppressed. Removal criteria:
    # 0 critical and 0 high in `osv-scanner scan -L Cargo.lock` for 7
    # consecutive days.
    osv-scanner:
        name: OSV Scanner (Cargo.lock) (advisory)
        runs-on: ubuntu-24.04
        continue-on-error: true
        permissions:
            contents: read
            security-events: write
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable
            - name: Generate Cargo.lock for scanning
              run: cargo generate-lockfile
            - name: Install OSV-Scanner
              env:
                  OSV_VERSION: v2.3.5
              run: |
                  curl -fsSL -o /tmp/osv-scanner \
                    "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64"
                  chmod +x /tmp/osv-scanner
                  sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
            - name: OSV-Scanner (SARIF for Code Scanning)
              id: osv
              run: osv-scanner scan -L Cargo.lock --format sarif --output-file osv-results.sarif
            - name: Upload OSV SARIF to GitHub Code Scanning
              if: always()
              continue-on-error: true
              uses: github/codeql-action/upload-sarif@v4
              with:
                  sarif_file: osv-results.sarif
                  category: osv-cargo-lock
            - name: OSV table (on vulnerability findings)
              if: failure() && steps.osv.outcome == 'failure'
              run: osv-scanner scan -L Cargo.lock --format table
