name: qe

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: qe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qe-suite:
    name: QE suite (100% green)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: python/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.17"

      - name: Verify recoverable QE harness
        run: |
          set -euo pipefail
          for path in \
            qe/__init__.py \
            qe/conftest.py \
            qe/runtime.py \
            qe/contract/__init__.py \
            qe/contract/test_core_contract.py \
            qe/unit/__init__.py \
            qe/unit/test_runtime.py; do
            test -f "$path" || { echo "::error::missing QE harness file: $path"; exit 1; }
          done

      - name: Install locked Python dependencies
        run: uv sync --project python --locked --all-extras --dev

      - name: Install protoc for the Rust core
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          protoc --version

      - name: Build Rust core candidate
        run: cargo build --locked -p agileplus-grpc --bin agileplus-grpc

      - name: Run QE unit and core contract tests
        run: |
          set -euo pipefail
          mkdir -p .qe-evidence
          uv run --project python --locked pytest -c python/pyproject.toml -q \
            qe/unit qe/contract --junitxml=.qe-evidence/junit.xml

      - name: Upload QE evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-evidence-${{ github.run_id }}
          path: .qe-evidence/**

  qe-gate:
    name: qe-gate (100% pass required)
    needs: [qe-suite]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Decide
        run: |
          if [ "${{ needs.qe-suite.result }}" != "success" ]; then
            echo "::error::QE suite failed. 100% green is required to merge."
            exit 1
          fi
          echo "QE suite 100% green — merge allowed."
