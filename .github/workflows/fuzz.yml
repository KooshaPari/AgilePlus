name: Fuzz
on:
    push:
        branches: [main]
    pull_request:
jobs:
    fuzz:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
            - name: Install libdbus development files
              # keyring 3.6.3's sync-secret-service backend links against the
              # system libdbus via libdbus-sys, which resolves it with
              # pkg-config. Without this the fuzz target build fails with
              # "Package 'dbus-1', required by 'virtual:world', not found".
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y libdbus-1-dev pkg-config
            - run: cargo install cargo-fuzz
            - run: if [ -d fuzz ]; then cargo fuzz run 2>&1 | tail -50 || true; else echo no-fuzz; fi
