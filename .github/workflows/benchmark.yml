name: Benchmarks

on:
  push:
    branches: [main]
    paths:
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - '.github/workflows/benchmark.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**/*.rs'
      - 'Cargo.toml'
      - '.github/workflows/benchmark.yml'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10

jobs:
  # ─── Cargo Bench for phenotype-infrakit crates ─────────────────────────
  benchmark:
    name: Cargo Bench - ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - phenotype-core
          - phenotype-event-sourcing
          - phenotype-cache-adapter
          - phenotype-policy-engine
          - phenotype-state-machine
          - phenotype-error-core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-${{ matrix.crate }}
          workspaces: "."

      - name: Check for benchmark configuration
        id: check-benches
        run: |
          if [ -f "crates/${{ matrix.crate }}/Cargo.toml" ] && grep -q "\[\[bench\]" "crates/${{ matrix.crate }}/Cargo.toml"; then
            echo "has-benches=true" >> $GITHUB_OUTPUT
            echo "Benchmarks found for ${{ matrix.crate }}"
          else
            echo "has-benches=false" >> $GITHUB_OUTPUT
            echo "No benchmarks for ${{ matrix.crate }}"
          fi

      - name: Compile benchmarks
        if: steps.check-benches.outputs.has-benches == 'true'
        run: |
          cd crates/${{ matrix.crate }}
          cargo bench --no-run

      - name: Run benchmarks
        if: steps.check-benches.outputs.has-benches == 'true'
        run: |
          cd crates/${{ matrix.crate }}
          cargo bench -- --noplot 2>&1 | tee benchmark-results.txt
        continue-on-error: true

      - name: Upload benchmark results
        if: steps.check-benches.outputs.has-benches == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.crate }}
          path: crates/${{ matrix.crate }}/benchmark-results.txt
          retention-days: 30

      - name: Upload Criterion HTML reports
        if: steps.check-benches.outputs.has-benches == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: criterion-report-${{ matrix.crate }}
          path: target/criterion/
          retention-days: 14

  # ─── Summary and Report ────────────────────────────────────────────────
  benchmark-summary:
    name: Benchmark Summary
    runs-on: ubuntu-latest
    needs: benchmark
    if: always()

    steps:
      - name: Download all benchmark results
        uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          merge-multiple: true
        continue-on-error: true

      - name: Generate summary
        run: |
          echo "# Benchmark Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Crate | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          for crate in phenotype-core phenotype-event-sourcing phenotype-cache-adapter phenotype-policy-engine phenotype-state-machine phenotype-error-core; do
            if [ -f "benchmark-results-$crate.txt" ]; then
              echo "| $crate | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $crate | ⏭️ No benchmarks |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Detailed Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          for file in benchmark-results-*.txt; do
            if [ -f "$file" ]; then
              crate=$(echo "$file" | sed 's/benchmark-results-//' | sed 's/.txt//')
              echo "### $crate" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              cat "$file" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Check for missing benchmarks
        run: |
          MISSING=""
          for crate in phenotype-core phenotype-event-sourcing phenotype-cache-adapter phenotype-policy-engine phenotype-state-machine phenotype-error-core; do
            if [ ! -f "benchmark-results-$crate.txt" ]; then
              MISSING="$MISSING $crate"
            fi
          done

          if [ -n "$MISSING" ]; then
            echo "⚠️ Missing benchmarks for:$MISSING"
            echo "These crates need benchmark files created"
          fi
        continue-on-error: true
