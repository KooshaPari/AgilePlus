name: Benchmark Tracking

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Criterion Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true
          key: bench-${{ github.sha }}

      # ── Restore previous baseline (from the default branch) ──────────
      - name: Restore previous benchmark baseline
        id: restore-baseline
        uses: actions/cache/restore@v4
        with:
          path: target/criterion
          key: bench-baseline-${{ github.ref_name }}
          restore-keys: |
            bench-baseline-main

      - name: Record whether we have a baseline
        id: baseline-check
        run: |
          if [ -d target/criterion ]; then
            echo "baseline_found=true" >> "$GITHUB_OUTPUT"
            echo "Previous benchmark baseline found."
          else
            echo "baseline_found=false" >> "$GITHUB_OUTPUT"
            echo "No baseline — running cold."
          fi

      # ── Run benchmarks ──────────────────────────────────────────────
      - name: Run cargo bench
        id: bench
        run: |
          cargo bench --manifest-path crates/agileplus-benchmarks/Cargo.toml 2>&1 | tee benchmark-output.txt
          echo "bench_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # ── Extract summary from Criterion output ───────────────────────
      - name: Extract benchmark summary
        id: summary
        run: |
          echo "### Benchmark Results" > benchmark-summary.md
          echo "" >> benchmark-summary.md
          echo "**Commit:** \`${{ github.sha }}\`" >> benchmark-summary.md
          echo "**Branch:** \`${{ github.ref_name }}\`" >> benchmark-summary.md
          echo "" >> benchmark-summary.md

          if grep -q "Benchmarking" benchmark-output.txt; then
            echo '```' >> benchmark-summary.md
            grep -E "(Benchmarking|Found [0-9]+|change:|saving|estimates|time:)" benchmark-output.txt \
              >> benchmark-summary.md 2>/dev/null || true
            echo '```' >> benchmark-summary.md
          else
            echo "_Raw benchmark output captured (no structured summary parsed)._ " >> benchmark-summary.md
          fi

          echo "" >> benchmark-summary.md
          echo "---" >> benchmark-summary.md
          echo "_Run \`cargo bench --manifest-path crates/agileplus-benchmarks/Cargo.toml\` locally for full details._" >> benchmark-summary.md

      # ── Upload benchmark artifacts ──────────────────────────────────
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.sha }}
          path: |
            benchmark-output.txt
            benchmark-summary.md
            target/criterion/
          retention-days: 30

      # ── Save baseline for next run ──────────────────────────────────
      - name: Save benchmark baseline
        uses: actions/cache/save@v4
        with:
          path: target/criterion
          key: bench-baseline-${{ github.ref_name }}-${{ github.sha }}

      # ── Post PR comment with summary ────────────────────────────────
      - name: Find existing benchmark comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "## Benchmark Results"

      - name: Post or update benchmark comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: benchmark-summary.md
          edit-mode: replace

      - name: Post benchmark summary to commit
        if: github.event_name == 'push' && github.ref_name == 'main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('benchmark-summary.md', 'utf8');
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'Benchmark Summary',
              head_sha: context.sha,
              status: 'completed',
              conclusion: '${{ steps.bench.outputs.bench_exit == 0 && steps.baseline-check.outputs.baseline_found && always() && "success" || "neutral" }}',
              output: {
                title: 'Criterion Benchmarks',
                summary: summary
              }
            });
            console.log(`Created check run: ${check.html_url}`);
