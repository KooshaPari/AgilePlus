name: Testing Infrastructure

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - '**.rs'
  pull_request:
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 3 * * *'  # Weekly test run

jobs:
  bdd-tests:
    name: BDD Feature Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Run Cucumber
        run: |
          bun add @cucumber/cucumber
          bun run cucumber run tests/bdd/*.feature

  vitest-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Run Vitest
        run: |
          bun add -d vitest @vitest/coverage-v8
          bun run vitest run --reporter=json

  playwright-tests:
    name: Playwright Visual Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install & Run Playwright
        run: |
          bun add -d @playwright/test
          bunx playwright install --with-deps
          bun run playwright test

  spec-traceability:
    name: FR Traceability Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check FR References
        run: grep -r "FR-" tests/ 2>/dev/null | head -10 || echo "No FR references"
