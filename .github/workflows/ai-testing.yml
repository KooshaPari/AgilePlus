name: Testing Infrastructure
permissions: read-all

permissions:
  contents: read
  actions: read

on:
  push:
    branches: [main, feat/**]
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
      - '**.rs'
  pull_request:
    paths:
      - 'tests/**'
      - 'vitest.config.ts'
      - 'playwright.config.ts'
  schedule:
    - cron: '0 3 * * *'  # Weekly test run

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd-tests:
    name: BDD Feature Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4
        with:
          node-version: '20'

      - name: Install Cucumber
        run: npm install @cucumber/cucumber

      - name: Run BDD Tests
        run: npx cucumber-js tests/bdd/*.feature || echo "No BDD feature files found, skipping"

  vitest-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: crates/agileplus-dashboard/web
        run: npm install

      - name: Run Vitest
        working-directory: crates/agileplus-dashboard/web
        run: npx vitest run --reporter=json

  playwright-tests:
    name: Playwright Visual Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a  # v4
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: crates/agileplus-dashboard/web
        run: npm install

      - name: Install Playwright browsers
        working-directory: crates/agileplus-dashboard/web
        run: npx playwright install --with-deps

      - name: Run Playwright Visual Tests
        working-directory: crates/agileplus-dashboard/web
        run: |
          if [ -d e2e ] && ls e2e/*.spec.ts 2>/dev/null | grep -q .; then
            npx playwright test
          else
            echo "No e2e playwright specs found, skipping visual tests"
          fi

  spec-traceability:
    name: FR Traceability Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Check FR References
        run: |
          echo "Validating FR-XXX-NNN traceability in tests"
          grep -r "FR-" tests/ 2>/dev/null | head -10 || echo "No FR references"
