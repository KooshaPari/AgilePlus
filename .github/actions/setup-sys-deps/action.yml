name: Set up workspace system dependencies
description: Install Linux build dependencies for the Rust workspace.
runs:
    using: composite
    steps:
        - name: Install workspace build dependencies
          shell: bash
          run: |
              sudo apt-get update
              sudo apt-get install -y build-essential pkg-config libssl-dev protobuf-compiler libdbus-1-dev libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
