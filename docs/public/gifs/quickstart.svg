<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <linearGradient id="qs" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357abd;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="200" height="100" fill="#f8f9fa"/>
  <!-- Main card -->
  <rect x="60" y="20" width="80" height="60" rx="10" fill="url(#qs)" filter="url(#glow)" stroke="#2a5a8c" stroke-width="2"/>
  <!-- Icon elements -->
  <circle cx="85" cy="45" r="8" fill="white"/>
  <circle cx="115" cy="45" r="8" fill="white"/>
  <path d="M85 58 L100 68 L115 58" fill="none" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Label -->
  <text x="100" y="92" text-anchor="middle" font-size="12" fill="#333">Quick Start</text>
</svg>
