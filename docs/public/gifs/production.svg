<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="prod" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4cae4c;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="100" fill="#f8f9fa"/>
  <!-- Main box -->
  <rect x="30" y="25" width="140" height="50" rx="8" fill="url(#prod)" filter="url(#shadow)"/>
  <!-- Inner elements -->
  <rect x="45" y="40" width="20" height="20" rx="3" fill="white" opacity="0.9"/>
  <rect x="75" y="40" width="20" height="20" rx="3" fill="white" opacity="0.9"/>
  <rect x="105" y="40" width="20" height="20" rx="3" fill="white" opacity="0.9"/>
  <rect x="135" y="40" width="20" height="20" rx="3" fill="white" opacity="0.9"/>
  <!-- Title -->
  <text x="100" y="18" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">Production</text>
</svg>
