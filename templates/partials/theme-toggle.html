<!-- Theme toggle partial: light / dark / system -->
<div x-data="{ theme: localStorage.getItem('theme') || 'dark' }"
     x-init="$watch('theme', val => { localStorage.setItem('theme', val); document.documentElement.classList.toggle('light', val === 'light'); }); document.documentElement.classList.toggle('light', theme === 'light');">
  <button @click="theme = theme === 'dark' ? 'light' : 'dark'"
          class="px-2 py-1 text-xs rounded border border-zinc-700 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition"
          :title="'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'">
    <span x-show="theme === 'dark'">&#x2600;</span>
    <span x-show="theme !== 'dark'">&#x263E;</span>
  </button>
</div>
