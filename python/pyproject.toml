[project]
name = "phenotype-traceability"
version = "0.1.0"
description = "AgilePlus Python components: gRPC proto stubs and MCP service"
requires-python = ">=3.14"
dependencies = [
  "grpcio>=1.80.0",
  "grpcio-tools>=1.62",
  # grpcio-health-checking 1.80.x requires protobuf <7; security fixes are in 6.31.x.
  "protobuf>=6.31.1,<8.0.0",
  "fastmcp>=2.0",
  "grpcio-health-checking>=1.80.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
