[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "phenotype-traceability"
version = "0.1.0"
description = "Phenotype Traceability - FR tracking for Python tests"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["testing", "traceability", "requirements", "pytest", "unittest"]
dependencies = [
    "pytest>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "black",
    "ruff",
    "mypy",
]

[project.urls]
Homepage = "https://github.com/phenotype/AgilePlus"
Documentation = "https://github.com/phenotype/AgilePlus/blob/main/docs/TRACEABILITY.md"
Repository = "https://github.com/phenotype/AgilePlus"
Issues = "https://github.com/phenotype/AgilePlus/issues"

[project.entry-points.pytest11]
phenotype_traceability = "phenotype_traceability.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/phenotype_traceability"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
