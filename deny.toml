[advisories]
db-path = "$CARGO_HOME/advisory-db"
# Unmaintained (info-severity) advisories. All are transitive or build-time
# only; none have a drop-in fix available in the current dependency graph.
# CVE-level vulnerability advisories are handled by a separate triage pass.
#
# Stale entries (RUSTSEC-2024-0436, RUSTSEC-2024-0370, RUSTSEC-2025-0134,
# RUSTSEC-2025-0075, RUSTSEC-2025-0080, RUSTSEC-2025-0081, RUSTSEC-2025-0098,
# RUSTSEC-2025-0100, RUSTSEC-2025-0012, RUSTSEC-2024-0384) were removed in
# commit-chain 2026-10-13 because none of the underlying crates still match
# the advisory criteria after upstream migrations.
#
# The remaining advisory (RUSTSEC-2024-0449, unsafe-libyaml) is reachable
# only through the deprecated `serde_yaml` 0.9.x line via `agileplus-import`
# and `agileplus-telemetry`; the upstream recommendation is to migrate to
# `serde_yml` or `serde_norway`, tracked separately.
ignore = [
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml unmaintained: transitive via serde_yaml 0.9.x (agileplus-import, agileplus-telemetry); upstream recommends serde_yml or serde_norway, migration tracked separately." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained: build-time only via glib-macros 0.18 (tauri stack); glib 0.18 pins it, no fix until tauri/glib bump." },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  # Boost Software License (OSI-approved): xxhash-rust via redis 1.7.
  "BSL-1.0",
  "CC0-1.0",
  "CC-BY-SA-4.0",
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
