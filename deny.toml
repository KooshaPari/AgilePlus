[advisories]
db-path = "$CARGO_HOME/advisory-db"
# Unmaintained (info-severity) advisories. All are transitive or build-time
# only; none have a drop-in fix available in the current dependency graph.
# CVE-level vulnerability advisories are handled by a separate triage pass.
#
# Stale entries (RUSTSEC-2024-0436, RUSTSEC-2024-0370, RUSTSEC-2025-0134,
# RUSTSEC-2025-0075, RUSTSEC-2025-0080, RUSTSEC-2025-0081, RUSTSEC-2025-0098,
# RUSTSEC-2025-0100, RUSTSEC-2025-0012, RUSTSEC-2024-0384) were removed in
# commit-chain 2026-10-13 because none of the underlying crates still match
# the advisory criteria after upstream migrations.
#
# RUSTSEC-2024-0449 (unsafe-libyaml) was reachable only through the deprecated
# `serde_yaml` 0.9.x line. The migration in commit-chain 2026-10-13 (issue
# #1107) replaces `serde_yaml` with `serde_norway` 0.9 (the maintained
# 0.9-line fork by cafkafk/emberian, pure-Rust parser, no `unsafe-libyaml`).
# `serde_yml` was considered and rejected: deprecated in 0.0.13 in favor of
# `noyalib`. `serde_yaml_ng` (acatton's continuation of the dtolnay line)
# was also tried first and was rejected: it still pulls in `unsafe-libyaml`,
# so the advisory would persist.
#
# RUSTSEC-2024-0370 (proc-macro-error) remains: build-time only via
# glib-macros 0.18 (tauri tray-icon stack); glib 0.18 pins it, no fix until
# tauri/tray-icon bump to a version that drops the libappindicator default
# or ships a maintained ksni-only path.
#
# RUSTSEC-2024-0429 (glib VariantStrIter) was REMOVED 2026-10-18 by
# subagent fox during CI diagnosis (PRs #1156/#1157/#1161/#1162/#1163/#1164).
# Prior comment claimed "Linux-only path via libappindicator->tray-icon->tauri
# matches on Ubuntu CI" — this no longer holds: cargo-deny run on the
# ubuntu-latest CI runner (job 117607233915, run 39104463006) reports
# `advisory-not-detected: no crate matched advisory criteria`, identical
# to a local macOS run. The libappindicator path was simplified out of the
# dep graph; the ignore entry became dead code and was turning the warning
# into a hard fail. Revisit if tauri PR #16170 re-introduces the path.
#
# RUSTSEC-2026-0370/0371/0372 (zvariant / zbus_names / zvariant_derive
# unmaintained): all transitive via zbus 5.19.0 -> Tauri tray-icon Linux
# path (libappindicator -> tray-icon -> tauri). Same blast radius as the
# RUSTSEC-2024-0370 proc-macro-error entry above: no fix until tauri/tray-icon
# bump drops the libappindicator default or ships a maintained ksni-only path.
# CI was failing on these for the same reason as the RUSTSEC-2024-0429 warning
# (cargo-deny advisories FAILED); the operator's 2026-10-13 commit chain
# removed the prior 2024-dated unmaintained entries but missed the 2026
# refresh. Adding explicit ignores here so the next operator sees the
# tauri-stack coupling in one place.
#
# RUSTSEC-2026-0374 (basic-toml) is a separate chain, not the tauri stack:
# basic-toml is a transitive dependency of askama_macros 0.16, a
# proc-macro, so it only participates at build time. The upstream crate
# was archived and the advisory reports "No safe upgrade is available!";
# askama 0.16.1 is the latest release and still depends on it. This
# mirrors the entry main added in commit 5d670486 (PR #1175), keeping the
# two policy files (deny.toml and .cargo/audit.toml) consistent.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained: build-time only via glib-macros 0.18 (tauri stack); glib 0.18 pins it, no fix until tauri/tray-icon bump." },
  { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained: transitive via zbus 5.19.0 -> tauri tray-icon Linux path; no fix until tauri/tray-icon bump." },
  { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained: transitive via zbus 5.19.0 -> tauri tray-icon Linux path; no fix until tauri/tray-icon bump." },
  { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained: transitive via zbus 5.19.0 -> tauri tray-icon Linux path; no fix until tauri/tray-icon bump." },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml unmaintained (archived upstream): transitive via askama_macros proc-macro, build-time only; no safe upgrade exists." },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  # Boost Software License (OSI-approved): xxhash-rust via redis 1.7.
  "BSL-1.0",
  "CC0-1.0",
  "CC-BY-SA-4.0",
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
