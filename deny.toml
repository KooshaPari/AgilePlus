[advisories]
db-path = "$CARGO_HOME/advisory-db"
# Unmaintained (info-severity) advisories. All are transitive or build-time
# only; none have a drop-in fix available in the current dependency graph.
# CVE-level vulnerability advisories are handled by a separate triage pass.
#
# Stale entries (RUSTSEC-2024-0436, RUSTSEC-2024-0370, RUSTSEC-2025-0134,
# RUSTSEC-2025-0075, RUSTSEC-2025-0080, RUSTSEC-2025-0081, RUSTSEC-2025-0098,
# RUSTSEC-2025-0100, RUSTSEC-2025-0012, RUSTSEC-2024-0384) were removed in
# commit-chain 2026-10-13 because none of the underlying crates still match
# the advisory criteria after upstream migrations.
#
# RUSTSEC-2024-0449 (unsafe-libyaml) was reachable only through the deprecated
# `serde_yaml` 0.9.x line. The migration in commit-chain 2026-10-13 (issue
# #1107) replaces `serde_yaml` with `serde_norway` 0.9 (the maintained
# 0.9-line fork by cafkafk/emberian, pure-Rust parser, no `unsafe-libyaml`).
# `serde_yml` was considered and rejected: deprecated in 0.0.13 in favor of
# `noyalib`. `serde_yaml_ng` (acatton's continuation of the dtolnay line)
# was also tried first and was rejected: it still pulls in `unsafe-libyaml`,
# so the advisory would persist.
#
# RUSTSEC-2024-0370 (proc-macro-error) remains: build-time only via
# glib-macros 0.18 (tauri tray-icon stack); glib 0.18 pins it, no fix until
# tauri/tray-icon bump to a version that drops the libappindicator default
# or ships a maintained ksni-only path.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained: build-time only via glib-macros 0.18 (tauri stack); glib 0.18 pins it, no fix until tauri/tray-icon bump." },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSD-3-Clause-Clear",
  # Boost Software License (OSI-approved): xxhash-rust via redis 1.7.
  "BSL-1.0",
  "CC0-1.0",
  "CC-BY-SA-4.0",
  "GPL-3.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "0BSD",
  "BlueOak-1.0.0",
  "CDLA-Permissive-2.0",
  "Unlicense",
  "WTFPL",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
