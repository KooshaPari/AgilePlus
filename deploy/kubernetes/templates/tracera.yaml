{{/* Tracera deployment for AgilePlus phase-finish-stack (helm chart) */}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-tracera
  labels:
    app.kubernetes.io/name: {{ include "phase-finish-stack.name" . }}-tracera
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
    app.kubernetes.io/component: tracera
spec:
  {{- if not .Values.tracera.autoscaling.enabled }}
  replicas: {{ .Values.tracera.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "phase-finish-stack.name" . }}-tracera
      app.kubernetes.io/component: tracera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "phase-finish-stack.name" . }}-tracera
        app.kubernetes.io/component: tracera
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.tracera.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tracera
          image: "{{ .Values.tracera.image.repository }}:{{ .Values.tracera.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.tracera.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.tracera.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.tracera.resources | nindent 12 }}
          {{- if .Values.tracera.persistence.enabled }}
          volumeMounts:
            - name: tracera-data
              mountPath: /data
          {{- end }}
      {{- if .Values.tracera.persistence.enabled }}
      volumes:
        - name: tracera-data
          persistentVolumeClaim:
            claimName: {{ include "phase-finish-stack.fullname" . }}-tracera-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-tracera
  labels:
    app.kubernetes.io/component: tracera
spec:
  type: {{ .Values.tracera.service.type }}
  ports:
    - port: {{ .Values.tracera.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/component: tracera
{{- if .Values.tracera.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-tracera
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "phase-finish-stack.fullname" . }}-tracera
  minReplicas: {{ .Values.tracera.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.tracera.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.tracera.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
