apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "phase-finish-stack.fullname" . }}-data
  labels:
    app.kubernetes.io/part-of: phase-finish-stack
    app.kubernetes.io/component: data
spec:
  accessModes:
    - {{ .Values.tracera.persistence.accessModes | default "ReadWriteOnce" }}
  resources:
    requests:
      storage: {{ .Values.tracera.persistence.size | default "10Gi" }}
  {{- with .Values.tracera.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
