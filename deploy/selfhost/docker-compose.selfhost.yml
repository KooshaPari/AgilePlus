services:
  agileplus-api:
    image: rust:1.82-bookworm
    working_dir: /workspace
    command: sh -lc "cargo run --release -p agileplus-api"
    environment:
      API_HOST: 0.0.0.0
      DATABASE_URL: sqlite:/data/agileplus.db
      AGILEPLUS_API_KEY: ${AGILEPLUS_API_KEY:?AGILEPLUS_API_KEY is required}
      RUST_LOG: info
    volumes:
      - ../..:/workspace
      - agileplus-data:/data
      - agileplus-cargo-cache:/usr/local/cargo/registry
      - agileplus-target-cache:/workspace/target
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - agileplus-api
    environment:
      HOSTNAME: ${HOSTNAME:-api.agileplus.pheno.studio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    depends_on:
      - caddy
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CF_TUNNEL_TOKEN:?CF_TUNNEL_TOKEN is required}
    restart: unless-stopped

volumes:
  agileplus-data:
  agileplus-cargo-cache:
  agileplus-target-cache:
  caddy-data:
  caddy-config:
