<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ecec6"/>
      <stop offset="25%" stop-color="#2db5ab"/>
      <stop offset="50%" stop-color="#1a9e95"/>
      <stop offset="75%" stop-color="#157e77"/>
      <stop offset="100%" stop-color="#0f6962"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,70,65,0.55)"/>
    </filter>
  </defs>
  <!-- Body squircle -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bodyGrad)"/>
  <!-- Specular highlight -->
  <ellipse cx="200" cy="80" rx="180" ry="80" fill="url(#specGrad)" opacity="0.7"/>
  <!-- Velocity bars -->
  <rect x="128" y="240" width="32" height="56" rx="6" fill="rgba(255,255,255,0.50)" filter="url(#shadow)"/>
  <rect x="172" y="208" width="32" height="88" rx="6" fill="rgba(255,255,255,0.65)" filter="url(#shadow)"/>
  <rect x="216" y="172" width="32" height="124" rx="6" fill="rgba(255,255,255,0.85)" filter="url(#shadow)"/>
  <rect x="260" y="200" width="32" height="96" rx="6" fill="rgba(255,255,255,0.65)" filter="url(#shadow)"/>
  <rect x="304" y="232" width="32" height="64" rx="6" fill="rgba(255,255,255,0.50)" filter="url(#shadow)"/>
  <!-- Sprint ring -->
  <circle cx="256" cy="256" r="200" stroke="rgba(255,255,255,0.95)" stroke-width="16" stroke-linecap="round" stroke-dasharray="850 400" fill="none" transform="rotate(-105 256 256)" filter="url(#glow)"/>
  <!-- Arrow -->
  <path d="M 416 108 L 440 138 L 400 146 Z" fill="rgba(255,255,255,0.95)" filter="url(#glow)"/>
  <!-- Plus sign -->
  <rect x="236" y="184" width="40" height="104" rx="8" fill="rgba(255,255,255,0.97)" filter="url(#shadow)"/>
  <rect x="204" y="216" width="104" height="40" rx="8" fill="rgba(255,255,255,0.97)" filter="url(#shadow)"/>
</svg>