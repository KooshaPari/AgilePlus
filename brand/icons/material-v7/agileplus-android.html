<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 512px; height: 512px;
    background: transparent;
    overflow: hidden;
  }
  .root {
    width: 512px; height: 512px;
    position: relative;
    background: transparent;
  }

  /* ============================================================
     ANDROID 3D CARD STACK — skeuomorphic layered cards over glass.
     Each card is a tinted, slightly-rotated panel with cast shadow,
     creating a genuine 3D stack depth (like physical cards on glass).
     Bottom glass panel has a strong gradient base and blur.
  ============================================================ */

  /* BACKGROUND GLASS PLATE: the base glass surface the cards rest on */
  .glass-plate {
    position: absolute;
    inset: 0;
    border-radius: 108px; /* Android adaptive squircle */
    overflow: hidden;
    box-shadow:
      0 32px 80px rgba(0,55,50,0.60),
      0 10px 28px rgba(0,30,28,0.38),
      0 3px 8px rgba(0,15,14,0.25);
  }

  /* Plate: rich multi-stop teal gradient — deep, saturated, vivid */
  .plate-bg {
    position: absolute; inset: 0;
    background: linear-gradient(160deg,
      #3dd6c8 0%,
      #1db8aa 18%,
      #0d9e92 38%,
      #0a7d73 58%,
      #085e56 78%,
      #053e38 100%
    );
  }

  /* Plate refraction caustics */
  .plate-light {
    position: absolute;
    top: -80px; left: -60px;
    width: 380px; height: 320px;
    background: radial-gradient(ellipse at 48% 44%,
      rgba(180,255,248,0.38) 0%,
      rgba(120,230,222,0.20) 40%,
      transparent 68%
    );
    filter: blur(22px);
  }

  .plate-dark {
    position: absolute;
    bottom: 0; right: 0;
    width: 300px; height: 280px;
    background: radial-gradient(ellipse at 75% 85%,
      rgba(0,30,28,0.55) 0%,
      transparent 60%
    );
  }

  /* CARD STACK — 4 cards, each offset and rotated for 3D stagger */

  .card {
    position: absolute;
    border-radius: 26px;
    transform-origin: center center;
  }

  /* Card 4 — deepest back card, most rotated, visible edge only */
  .card-4 {
    top: 58px; left: 52px;
    width: 408px; height: 396px;
    transform: rotate(-9deg) translateY(-20px);
    background: linear-gradient(135deg,
      rgba(200,240,236,0.68) 0%,
      rgba(165,220,216,0.58) 40%,
      rgba(140,198,194,0.50) 100%
    );
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow:
      0 20px 60px rgba(0,50,45,0.45),
      0 6px 16px rgba(0,30,28,0.30),
      0 0 0 1px rgba(255,255,255,0.18) inset;
    border: 1px solid rgba(230,250,248,0.30);
  }

  /* Card 4 strong gradient body */
  .card-4::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 26px;
    background: linear-gradient(148deg,
      rgba(255,255,255,0.25) 0%,
      transparent 40%,
      rgba(0,60,55,0.15) 100%
    );
  }

  /* Card 3 */
  .card-3 {
    top: 62px; left: 56px;
    width: 400px; height: 388px;
    transform: rotate(-5deg) translateY(-10px);
    background: linear-gradient(130deg,
      rgba(210,245,242,0.72) 0%,
      rgba(178,228,224,0.64) 40%,
      rgba(155,210,206,0.56) 100%
    );
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow:
      0 16px 48px rgba(0,45,42,0.38),
      0 4px 12px rgba(0,25,24,0.22),
      0 0 0 1px rgba(255,255,255,0.22) inset;
    border: 1px solid rgba(235,252,250,0.35);
  }

  .card-3::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 26px;
    background: linear-gradient(145deg,
      rgba(255,255,255,0.30) 0%,
      transparent 35%,
      rgba(0,55,50,0.10) 100%
    );
  }

  /* Card 2 */
  .card-2 {
    top: 68px; left: 60px;
    width: 392px; height: 380px;
    transform: rotate(-2deg) translateY(-4px);
    background: linear-gradient(128deg,
      rgba(222,250,248,0.78) 0%,
      rgba(192,235,232,0.70) 40%,
      rgba(168,218,215,0.62) 100%
    );
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 12px 36px rgba(0,40,38,0.32),
      0 3px 10px rgba(0,22,20,0.18),
      0 0 0 1px rgba(255,255,255,0.28) inset;
    border: 1px solid rgba(240,254,252,0.40);
  }

  .card-2::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 26px;
    background: linear-gradient(142deg,
      rgba(255,255,255,0.35) 0%,
      transparent 30%,
      rgba(0,50,46,0.08) 100%
    );
  }

  /* MAIN FRONT CARD — flat on top, most vivid, with strong gradient + gloss */
  .card-main {
    top: 74px; left: 64px;
    width: 384px; height: 372px;
    transform: rotate(0deg);
    background: linear-gradient(125deg,
      #7ebab5 0%,
      #5da8a2 22%,
      #3f9490 45%,
      #2d7e7a 68%,
      #1d6360 90%,
      #124d4a 100%
    );
    box-shadow:
      0 8px 28px rgba(0,38,35,0.45),
      0 2px 8px rgba(0,20,18,0.25),
      0 0 0 1.5px rgba(255,255,255,0.28) inset,
      0 1px 0 rgba(255,255,255,0.55) inset;
    border: 1px solid rgba(200,240,236,0.30);
    overflow: hidden;
  }

  /* Card-main inner caustic / wet reflection */
  .card-main-caustic {
    position: absolute;
    top: 74px; left: 64px;
    width: 384px; height: 180px;
    border-radius: 26px 26px 0 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.22) 0%,
      rgba(255,255,255,0.08) 50%,
      transparent 100%
    );
    pointer-events: none;
  }

  /* CARD-MAIN GLOSSY BALLOON HIGHLIGHT */
  .card-balloon {
    position: absolute;
    top: 82px; left: 90px;
    width: 310px; height: 120px;
    background: radial-gradient(ellipse at 50% 35%,
      rgba(255,255,255,0.82) 0%,
      rgba(255,255,255,0.48) 25%,
      rgba(200,255,252,0.18) 55%,
      transparent 75%
    );
    border-radius: 50%;
    filter: blur(5px);
    transform: rotate(-4deg);
    pointer-events: none;
  }

  /* STAINED GLASS TINTS between cards — amber, rose, sapphire bleeding through */
  .stain-amber {
    position: absolute;
    top: 50px; left: 50px;
    width: 160px; height: 130px;
    background: radial-gradient(ellipse,
      rgba(255,185,55,0.22) 0%,
      transparent 70%
    );
    filter: blur(18px);
    pointer-events: none;
  }

  .stain-rose {
    position: absolute;
    top: 60px; right: 50px;
    width: 130px; height: 120px;
    background: radial-gradient(ellipse,
      rgba(255,80,140,0.16) 0%,
      transparent 70%
    );
    filter: blur(16px);
    pointer-events: none;
  }

  .stain-sapphire {
    position: absolute;
    bottom: 70px; left: 60px;
    width: 150px; height: 120px;
    background: radial-gradient(ellipse,
      rgba(60,100,250,0.16) 0%,
      transparent 70%
    );
    filter: blur(20px);
    pointer-events: none;
  }

  /* ART layer: centered on front card */
  .art {
    position: absolute;
    top: 74px; left: 64px;
    width: 384px; height: 372px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="root">
  <!-- Glass plate base -->
  <div class="glass-plate">
    <div class="plate-bg"></div>
    <div class="plate-light"></div>
    <div class="plate-dark"></div>
  </div>

  <!-- Stained-glass color bleeds (between cards) -->
  <div class="stain-amber"></div>
  <div class="stain-rose"></div>
  <div class="stain-sapphire"></div>

  <!-- 3D card stack: back to front -->
  <div class="card card-4"></div>
  <div class="card card-3"></div>
  <div class="card card-2"></div>
  <div class="card card-main"></div>
  <div class="card-main-caustic"></div>
  <div class="card-balloon"></div>

  <!-- Sprint-mark artwork on front card -->
  <div class="art">
    <svg width="270" height="270" viewBox="0 0 270 270" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="card-glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,50,45,0.60)"/>
        </filter>
        <linearGradient id="bar-g" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.96)"/>
          <stop offset="100%" stop-color="rgba(210,255,252,0.70)"/>
        </linearGradient>
      </defs>

      <!-- Sprint ring -->
      <circle cx="135" cy="135" r="105"
        stroke="rgba(255,255,255,0.95)" stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="485 180"
        fill="none"
        transform="rotate(-108 135 135)"
        filter="url(#card-glow)"
      />
      <path d="M 223 74 L 240 94 L 216 100 Z" fill="rgba(255,255,255,0.96)" filter="url(#card-glow)"/>

      <!-- Velocity bars -->
      <rect x="74" y="142" width="20" height="30" rx="4" fill="url(#bar-g)" opacity="0.52" filter="url(#card-shadow)"/>
      <rect x="100" y="124" width="20" height="48" rx="4" fill="url(#bar-g)" opacity="0.68" filter="url(#card-shadow)"/>
      <rect x="126" y="104" width="20" height="68" rx="4" fill="url(#bar-g)" opacity="0.90" filter="url(#card-shadow)"/>
      <rect x="152" y="118" width="20" height="54" rx="4" fill="url(#bar-g)" opacity="0.68" filter="url(#card-shadow)"/>
      <rect x="178" y="136" width="20" height="36" rx="4" fill="url(#bar-g)" opacity="0.52" filter="url(#card-shadow)"/>

      <!-- A+ cross: bold white -->
      <rect x="122" y="100" width="26" height="70" rx="7" fill="rgba(255,255,255,0.98)" filter="url(#card-glow)"/>
      <rect x="102" y="120" width="66" height="26" rx="7" fill="rgba(255,255,255,0.98)" filter="url(#card-glow)"/>
    </svg>
  </div>
</div>
</body>
</html>
