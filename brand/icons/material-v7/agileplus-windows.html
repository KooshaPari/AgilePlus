<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 512px; height: 512px;
    background: transparent;
    overflow: hidden;
  }
  .root {
    width: 512px; height: 512px;
    position: relative;
    background: transparent;
  }

  /* ============================================================
     WINDOWS MICA — stacked TILES visibly peeking out top-right.
     Each layer is an absolutely-positioned rounded square with
     explicit top/left/width/height so edges are VISIBLE.
     Back tiles are larger and offset; front tile is smallest/centered.
     All tiles have mica-translucent teal fills.
  ============================================================ */

  /* TILE SIZE: main front tile */
  /* Back tiles stick out 14px at top and right per level */

  /* Deepest tile — largest, most top-right offset */
  .tile-4 {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    background: linear-gradient(148deg,
      #3a8a86 0%,
      #2e726e 50%,
      #22585a 100%
    );
    box-shadow:
      0 12px 40px rgba(0,40,36,0.45),
      0 4px 12px rgba(0,20,18,0.28);
    border: 1.5px solid rgba(140,210,205,0.30);
    transform: translate(42px, -42px);
  }

  .tile-3 {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    background: linear-gradient(145deg,
      #4a9e9a 0%,
      #3c8480 50%,
      #2e6a66 100%
    );
    box-shadow:
      0 9px 30px rgba(0,40,36,0.36),
      0 3px 9px rgba(0,20,18,0.22);
    border: 1.5px solid rgba(165,228,224,0.34);
    transform: translate(28px, -28px);
  }

  .tile-2 {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    background: linear-gradient(142deg,
      #5ab2ae 0%,
      #4a9894 50%,
      #3a7e7c 100%
    );
    box-shadow:
      0 6px 20px rgba(0,40,36,0.26),
      0 2px 6px rgba(0,20,18,0.16);
    border: 1.5px solid rgba(188,240,238,0.38);
    transform: translate(14px, -14px);
  }

  /* MAIN FRONT TILE */
  .tile-main {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    background: linear-gradient(138deg,
      rgba(215,248,246,0.94) 0%,
      rgba(190,234,232,0.90) 30%,
      rgba(168,218,216,0.86) 60%,
      rgba(150,204,202,0.82) 100%
    );
    box-shadow:
      0 0 0 1.5px rgba(255,255,255,0.55) inset,
      0 1px 0 rgba(255,255,255,0.75) inset,
      0 4px 16px rgba(0,40,36,0.22);
    border: 1.5px solid rgba(245,255,254,0.60);
    overflow: hidden;
    transform: translate(0, 0);
  }

  /* MICA GRAIN on main tile */
  .mica-grain {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    pointer-events: none;
    opacity: 0.11;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.78' numOctaves='4' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0.4'/%3E%3C/filter%3E%3Crect width='400' height='400' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 400px 400px;
  }

  /* MICA ACRYLIC TINT */
  .mica-tint {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    pointer-events: none;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.26) 0%,
      rgba(255,255,255,0.12) 22%,
      rgba(255,255,255,0.04) 50%,
      rgba(0,0,0,0.03) 80%,
      rgba(0,0,0,0.07) 100%
    );
  }

  /* STAINED TINT BLEEDS */
  .stain-amber {
    position: absolute;
    top: 52px; left: 52px;
    width: 180px; height: 150px;
    background: radial-gradient(ellipse, rgba(255,192,60,0.20) 0%, transparent 70%);
    filter: blur(22px);
    pointer-events: none;
  }
  .stain-cyan {
    position: absolute;
    bottom: 56px; right: 56px;
    width: 170px; height: 140px;
    background: radial-gradient(ellipse, rgba(60,220,210,0.20) 0%, transparent 70%);
    filter: blur(22px);
    pointer-events: none;
  }

  /* TOP EDGE SHIMMER */
  .top-shimmer {
    position: absolute;
    top: 42px; left: 42px; right: 42px;
    height: 2px;
    border-radius: 26px 26px 0 0;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.72) 20%,
      rgba(255,255,255,0.92) 50%,
      rgba(255,255,255,0.72) 80%,
      transparent 100%
    );
    pointer-events: none;
    transform: translate(0, 0);
  }

  /* ART overlay on main tile */
  .art {
    position: absolute;
    top: 42px; left: 42px;
    width: 428px; height: 428px;
    border-radius: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="root">
  <!-- Stacked mica panes — back to front -->
  <div class="tile-4"></div>
  <div class="tile-3"></div>
  <div class="tile-2"></div>
  <div class="tile-main"></div>

  <!-- Surface details on main tile -->
  <div class="mica-grain"></div>
  <div class="mica-tint"></div>
  <div class="stain-amber"></div>
  <div class="stain-cyan"></div>
  <div class="top-shimmer"></div>

  <!-- Artwork -->
  <div class="art">
    <svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="ms" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,70,65,0.40)"/>
        </filter>
        <linearGradient id="mbar" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#1e6260"/>
          <stop offset="100%" stop-color="#144a48"/>
        </linearGradient>
      </defs>

      <!-- Sprint ring: dark teal arc -->
      <circle cx="150" cy="150" r="118"
        stroke="#1a5a56" stroke-width="14"
        stroke-linecap="round"
        stroke-dasharray="548 200"
        fill="none"
        transform="rotate(-108 150 150)"
        filter="url(#ms)"
      />
      <path d="M 252 87 L 270 108 L 244 114 Z" fill="#1a5a56" filter="url(#ms)"/>

      <!-- Velocity bars -->
      <rect x="82" y="157" width="21" height="33" rx="4" fill="url(#mbar)" opacity="0.68" filter="url(#ms)"/>
      <rect x="111" y="138" width="21" height="52" rx="4" fill="url(#mbar)" opacity="0.82" filter="url(#ms)"/>
      <rect x="140" y="116" width="21" height="74" rx="4" fill="#1e6260" filter="url(#ms)"/>
      <rect x="169" y="132" width="21" height="58" rx="4" fill="url(#mbar)" opacity="0.82" filter="url(#ms)"/>
      <rect x="198" y="151" width="21" height="39" rx="4" fill="url(#mbar)" opacity="0.68" filter="url(#ms)"/>

      <!-- A+ cross -->
      <rect x="138" y="112" width="26" height="72" rx="7" fill="#123e3d" filter="url(#ms)"/>
      <rect x="118" y="132" width="66" height="26" rx="7" fill="#123e3d" filter="url(#ms)"/>
      <!-- Mica top sheen on cross -->
      <rect x="138" y="112" width="26" height="4" rx="2" fill="rgba(255,255,255,0.32)"/>
      <rect x="118" y="132" width="66" height="3" rx="1.5" fill="rgba(255,255,255,0.24)"/>
    </svg>
  </div>
</div>
</body>
</html>
