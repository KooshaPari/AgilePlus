<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 512px; height: 512px;
    background: transparent;
    overflow: hidden;
  }
  .root {
    width: 512px; height: 512px;
    position: relative;
    background: transparent;
  }

  /* === macOS continuous-curvature squircle container === */
  .squircle {
    position: absolute;
    inset: 14px;
    border-radius: 118px;
    overflow: hidden;
    /* deep drop-shadow for icon dock lift */
    box-shadow:
      0 28px 80px rgba(0,60,55,0.55),
      0 8px 24px rgba(0,40,36,0.35),
      0 2px 6px rgba(0,30,28,0.25);
  }

  /* ============================================================
     LAYER STACK — deepest first, composited upward
     Each pane is a tinted glass shard at a different angle/hue
     creating a stained-glass refraction cathedral effect.
  ============================================================ */

  /* PANE 0: deep cobalt-teal base — the substrate */
  .p0 {
    position: absolute; inset: 0;
    background: linear-gradient(168deg,
      #0d4f4a 0%,
      #0a3d39 40%,
      #072e2b 75%,
      #041f1d 100%
    );
  }

  /* PANE 1: first stained-glass shard — amber-gold tint, angled */
  .p1 {
    position: absolute;
    top: -60px; left: -80px;
    width: 340px; height: 400px;
    background: linear-gradient(42deg,
      rgba(255,185,60,0.22) 0%,
      rgba(255,160,30,0.14) 45%,
      transparent 70%
    );
    transform: rotate(-12deg) skewX(8deg);
    mix-blend-mode: screen;
  }

  /* PANE 2: turquoise-cyan stained glass shard — middle diagonal */
  .p2 {
    position: absolute;
    top: 30px; left: 0px;
    width: 420px; height: 260px;
    background: linear-gradient(138deg,
      rgba(100,230,220,0.30) 0%,
      rgba(64,200,190,0.20) 40%,
      rgba(40,170,160,0.10) 70%,
      transparent 100%
    );
    transform: rotate(6deg) skewY(-4deg);
    mix-blend-mode: screen;
  }

  /* PANE 3: viridian-emerald glass — right-side shard */
  .p3 {
    position: absolute;
    top: -40px; right: -60px;
    width: 280px; height: 480px;
    background: linear-gradient(200deg,
      rgba(30,180,120,0.25) 0%,
      rgba(50,200,140,0.18) 40%,
      transparent 70%
    );
    transform: rotate(18deg) skewX(-6deg);
    mix-blend-mode: screen;
  }

  /* PANE 4: sapphire-blue shard — bottom-left */
  .p4 {
    position: absolute;
    bottom: -80px; left: -40px;
    width: 300px; height: 350px;
    background: linear-gradient(340deg,
      rgba(60,100,240,0.18) 0%,
      rgba(80,140,255,0.12) 50%,
      transparent 75%
    );
    transform: rotate(-20deg) skewY(10deg);
    mix-blend-mode: screen;
  }

  /* PANE 5: rose-magenta prism edge — thin top-right streak */
  .p5 {
    position: absolute;
    top: -20px; right: 40px;
    width: 160px; height: 250px;
    background: linear-gradient(160deg,
      rgba(255,80,160,0.16) 0%,
      rgba(200,60,140,0.10) 50%,
      transparent 80%
    );
    transform: rotate(30deg);
    mix-blend-mode: screen;
  }

  /* CAUSTIC POOLS: wet light caustics on glass surface */
  .caustic-a {
    position: absolute;
    top: -80px; left: -60px;
    width: 380px; height: 320px;
    background: radial-gradient(ellipse at 48% 42%,
      rgba(160,255,245,0.45) 0%,
      rgba(100,230,220,0.22) 35%,
      transparent 65%
    );
    filter: blur(14px);
    mix-blend-mode: screen;
  }

  .caustic-b {
    position: absolute;
    bottom: -30px; right: -20px;
    width: 240px; height: 280px;
    background: radial-gradient(ellipse at 55% 60%,
      rgba(200,255,250,0.25) 0%,
      rgba(126,186,181,0.15) 50%,
      transparent 75%
    );
    filter: blur(18px);
    mix-blend-mode: screen;
  }

  /* REFRACTION BAND: bright prismatic edge at top-left — like light hitting a glass edge */
  .refract-edge {
    position: absolute; inset: 0;
    background:
      linear-gradient(130deg,
        rgba(255,255,255,0.90) 0%,
        rgba(200,255,250,0.55) 7%,
        rgba(180,230,240,0.25) 14%,
        transparent 28%
      );
  }

  /* INTERNAL GLASS THICKNESS: subtle inner bevel creating a sense of lens thickness */
  .glass-bevel {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg,
        rgba(255,255,255,0.12) 0%,
        transparent 18%
      ),
      linear-gradient(90deg,
        rgba(255,255,255,0.08) 0%,
        transparent 15%
      );
  }

  /* LIQUID BALLOON HIGHLIGHT: the iconic macOS wet-glass specular dome */
  .balloon-outer {
    position: absolute;
    top: 12px; left: 38px;
    width: 370px; height: 160px;
    background: radial-gradient(ellipse at 50% 30%,
      rgba(255,255,255,0.88) 0%,
      rgba(255,255,255,0.55) 20%,
      rgba(220,255,252,0.25) 50%,
      transparent 72%
    );
    border-radius: 50%;
    filter: blur(6px);
    transform: rotate(-6deg);
  }

  /* Inner bright core of the balloon */
  .balloon-inner {
    position: absolute;
    top: 18px; left: 100px;
    width: 220px; height: 75px;
    background: radial-gradient(ellipse at 50% 40%,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.70) 40%,
      transparent 75%
    );
    border-radius: 50%;
    filter: blur(3px);
  }

  /* MICRO SPARKLE: tiny secondary glint bottom-right */
  .sparkle {
    position: absolute;
    bottom: 68px; right: 72px;
    width: 70px; height: 40px;
    background: radial-gradient(ellipse, rgba(255,255,255,0.45) 0%, transparent 70%);
    filter: blur(4px);
    border-radius: 50%;
  }

  /* DEPTH SHADOW: bottom pool of darkness for wet-look depth */
  .depth-pool {
    position: absolute;
    bottom: 0; right: 0;
    width: 280px; height: 230px;
    background: radial-gradient(ellipse at 80% 90%,
      rgba(0,30,28,0.60) 0%,
      transparent 60%
    );
  }

  /* ARTWORK LAYER */
  .art {
    position: absolute; inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div class="root">
  <div class="squircle">
    <!-- Stained-glass substrate -->
    <div class="p0"></div>
    <!-- Colored glass panes layered at different angles -->
    <div class="p1"></div>
    <div class="p2"></div>
    <div class="p3"></div>
    <div class="p4"></div>
    <div class="p5"></div>
    <!-- Wet caustic light pools -->
    <div class="caustic-a"></div>
    <div class="caustic-b"></div>
    <!-- Depth / bevel -->
    <div class="depth-pool"></div>
    <div class="glass-bevel"></div>
    <!-- Prismatic refraction edge -->
    <div class="refract-edge"></div>
    <!-- Liquid balloon highlights -->
    <div class="balloon-outer"></div>
    <div class="balloon-inner"></div>
    <div class="sparkle"></div>

    <!-- Sprint-mark artwork: glowing white on deep stained glass -->
    <div class="art">
      <svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Halo glow for balloon-glass art -->
          <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur stdDeviation="7" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="art-shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,60,55,0.70)"/>
          </filter>
          <!-- Wet glass tint on bars -->
          <linearGradient id="bar-grad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,0.98)"/>
            <stop offset="100%" stop-color="rgba(200,255,252,0.72)"/>
          </linearGradient>
          <!-- Sprint ring gradient arc -->
          <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgba(255,255,255,1.0)"/>
            <stop offset="100%" stop-color="rgba(180,255,250,0.70)"/>
          </linearGradient>
        </defs>

        <!-- Sprint ring: bright luminous arc with glow -->
        <circle cx="150" cy="150" r="118"
          stroke="url(#ring-grad)" stroke-width="15"
          stroke-linecap="round"
          stroke-dasharray="545 200"
          fill="none"
          transform="rotate(-108 150 150)"
          filter="url(#halo)"
        />
        <!-- Arrow tip -->
        <path d="M 249 82 L 267 104 L 241 110 Z"
          fill="rgba(255,255,255,0.98)"
          filter="url(#halo)"
        />

        <!-- Velocity bars — glass-white gradient bars with halo -->
        <rect x="84" y="160" width="22" height="34" rx="5" fill="url(#bar-grad)" opacity="0.52" filter="url(#art-shadow)"/>
        <rect x="114" y="140" width="22" height="54" rx="5" fill="url(#bar-grad)" opacity="0.68" filter="url(#art-shadow)"/>
        <rect x="144" y="118" width="22" height="76" rx="5" fill="url(#bar-grad)" opacity="0.90" filter="url(#art-shadow)"/>
        <rect x="174" y="134" width="22" height="60" rx="5" fill="url(#bar-grad)" opacity="0.68" filter="url(#art-shadow)"/>
        <rect x="204" y="154" width="22" height="40" rx="5" fill="url(#bar-grad)" opacity="0.52" filter="url(#art-shadow)"/>

        <!-- A+ mark: bright white cross, centered, bold -->
        <rect x="138" y="116" width="24" height="68" rx="7" fill="rgba(255,255,255,0.98)" filter="url(#halo)"/>
        <rect x="118" y="136" width="64" height="24" rx="7" fill="rgba(255,255,255,0.98)" filter="url(#halo)"/>
        <!-- Plus superscript dot — the "+" in A+ -->
        <circle cx="220" cy="118" r="10" fill="rgba(255,255,255,0.90)" filter="url(#halo)"/>
        <rect x="215" y="113" width="10" height="10" rx="2" fill="rgba(255,255,255,0.98)" filter="url(#halo)"/>
      </svg>
    </div>
  </div>
</div>
</body>
</html>
