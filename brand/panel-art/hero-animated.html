<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<title>AgilePlus — Animated Hero Banner</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  .hero {
    width: 1200px; height: 630px;
    position: relative;
    display: flex;
    background: radial-gradient(ellipse at 35% 45%, #0f2e2a 0%, #0a1a18 40%, #060e0d 70%, #040a09 100%);
    overflow: hidden;
  }
  /* Grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(46,181,171,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,181,171,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 50% 50%, black 20%, transparent 65%);
  }
  /* Ambient glow */
  .glow {
    position: absolute;
    width: 600px; height: 600px;
    top: 50%; left: 35%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(46,181,171,0.1) 0%, transparent 60%);
    filter: blur(40px);
    animation: breathe 5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  }
  /* Left content */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
    position: relative;
    z-index: 10;
  }
  .logo-row {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 32px;
  }
  .logo-icon {
    width: 80px; height: 80px;
    border-radius: 20px;
    background: linear-gradient(155deg, #5ecec6 0%, #2db5ab 25%, #1a9e95 50%, #157e77 75%, #0f6962 100%);
    box-shadow: 0 12px 40px rgba(46,181,171,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .logo-icon::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(140deg, rgba(255,255,255,0.35) 0%, transparent 25%);
    border-radius: inherit;
  }
  .logo-icon svg { width: 44px; height: 44px; filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3)); }
  .title {
    font-size: 56px; font-weight: 700;
    color: #e8f8f6;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 18px; font-weight: 400;
    color: rgba(160,220,215,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .desc {
    font-size: 15px; font-weight: 400;
    color: rgba(160,220,215,0.3);
    line-height: 1.7;
    max-width: 420px;
  }
  /* Right side */
  .right {
    width: 500px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Sprint rings */
  .ring-1 {
    position: absolute;
    width: 450px; height: 450px;
    border: 1.5px solid rgba(46,181,171,0.1);
    border-radius: 50%;
    border-top-color: rgba(46,181,171,0.25);
    border-right-color: rgba(46,181,171,0.12);
    animation: spin 18s linear infinite;
  }
  .ring-2 {
    position: absolute;
    width: 340px; height: 340px;
    border: 1px solid rgba(46,181,171,0.06);
    border-radius: 50%;
    border-bottom-color: rgba(46,181,171,0.15);
    animation: spin 12s linear infinite reverse;
  }
  .ring-3 {
    position: absolute;
    width: 220px; height: 220px;
    border: 1px dashed rgba(46,181,171,0.06);
    border-radius: 50%;
    animation: spin 25s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Velocity bars */
  .bars-right {
    position: absolute;
    right: 80px; top: 50%;
    transform: translateY(-50%) rotate(-10deg);
    display: flex; gap: 8px; align-items: flex-end;
    opacity: 0.2;
  }
  .b {
    width: 6px; border-radius: 3px;
    background: linear-gradient(to top, #0f6962, #2db5ab);
    animation: barBounce 1.8s ease-in-out infinite;
  }
  .b:nth-child(1) { height: 25px; animation-delay: 0s; }
  .b:nth-child(2) { height: 45px; animation-delay: 0.15s; }
  .b:nth-child(3) { height: 70px; animation-delay: 0.3s; }
  .b:nth-child(4) { height: 55px; animation-delay: 0.45s; }
  .b:nth-child(5) { height: 35px; animation-delay: 0.6s; }
  .b:nth-child(6) { height: 85px; animation-delay: 0.75s; }
  .b:nth-child(7) { height: 50px; animation-delay: 0.9s; }
  .b:nth-child(8) { height: 30px; animation-delay: 1.05s; }
  @keyframes barBounce {
    0%, 100% { transform: scaleY(0.6); opacity: 0.2; }
    50% { transform: scaleY(1.2); opacity: 0.8; }
  }
  /* Corner accents */
  .corner-tl {
    position: absolute; top: 40px; left: 40px;
    width: 80px; height: 80px;
    border-top: 1.5px solid rgba(46,181,171,0.15);
    border-left: 1.5px solid rgba(46,181,171,0.15);
  }
  .corner-br {
    position: absolute; bottom: 40px; right: 40px;
    width: 80px; height: 80px;
    border-bottom: 1.5px solid rgba(46,181,171,0.15);
    border-right: 1.5px solid rgba(46,181,171,0.15);
  }
  /* Top accent line */
  .top-line {
    position: absolute;
    top: 0; left: 0;
    width: 50%;
    height: 3px;
    background: linear-gradient(90deg, #5ecec6, #2db5ab, rgba(46,181,171,0.1));
    animation: lineGlow 3s ease-in-out infinite;
  }
  @keyframes lineGlow {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="top-line"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>

  <div class="left">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="30" y="52" width="12" height="24" rx="3" fill="rgba(255,255,255,0.7)"/>
          <rect x="48" y="42" width="12" height="44" rx="3" fill="rgba(255,255,255,0.8)"/>
          <rect x="66" y="32" width="12" height="56" rx="3" fill="rgba(255,255,255,0.95)"/>
          <rect x="84" y="38" width="12" height="44" rx="3" fill="rgba(255,255,255,0.8)"/>
          <circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-dasharray="220 90" stroke-linecap="round" transform="rotate(-105 60 60)"/>
          <path d="M 98 30 L 108 42 L 92 46 Z" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
    </div>
    <div class="title">AgilePlus</div>
    <div class="subtitle">spec-driven development</div>
    <div class="desc">CLI, desktop app, and gRPC server. Full traceability from spec to ship. Ship features with confidence.</div>
  </div>

  <div class="right">
    <div class="ring-1"></div>
    <div class="ring-2"></div>
    <div class="ring-3"></div>
    <div class="bars-right">
      <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
      <div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div>
    </div>
  </div>
</div>
</body>
</html>
