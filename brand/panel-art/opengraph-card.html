<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1.0">
<title>AgilePlus — OpenGraph / Social Media Card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1200px; height: 630px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  .card {
    width: 1200px; height: 630px;
    position: relative;
    display: flex;
    background: linear-gradient(135deg, #0a1f1c 0%, #060e0d 40%, #040a09 100%);
    overflow: hidden;
  }
  /* Left content */
  .left {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px;
    position: relative;
    z-index: 10;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
  }
  .logo-icon {
    width: 72px; height: 72px;
    border-radius: 18px;
    background: linear-gradient(155deg, #5ecec6 0%, #2db5ab 25%, #1a9e95 50%, #157e77 75%, #0f6962 100%);
    box-shadow: 0 8px 30px rgba(46,181,171,0.3);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .logo-icon::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(140deg, rgba(255,255,255,0.35) 0%, transparent 25%);
    border-radius: inherit;
  }
  .logo-icon svg { width: 40px; height: 40px; }
  .title {
    font-size: 52px; font-weight: 700;
    color: #e8f8f6;
    letter-spacing: -0.5px;
    margin-bottom: 16px;
  }
  .subtitle {
    font-size: 18px; font-weight: 400;
    color: rgba(160,220,215,0.5);
    line-height: 1.6;
    max-width: 500px;
  }
  .url {
    position: absolute;
    bottom: 60px; left: 80px;
    font-size: 14px; font-weight: 500;
    color: rgba(45,181,171,0.35);
    letter-spacing: 1px;
  }
  /* Right decorative */
  .right {
    width: 500px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .big-ring {
    width: 400px; height: 400px;
    border: 1.5px solid rgba(46,181,171,0.1);
    border-radius: 50%;
    border-top-color: rgba(46,181,171,0.25);
    animation: spin 18s linear infinite;
  }
  .inner-ring {
    position: absolute;
    width: 280px; height: 280px;
    border: 1px solid rgba(46,181,171,0.08);
    border-radius: 50%;
    border-bottom-color: rgba(46,181,171,0.18);
    animation: spin 12s linear infinite reverse;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Floating bars */
  .float-bars {
    position: absolute;
    right: 60px; top: 50%;
    transform: translateY(-50%) rotate(-8deg);
    display: flex; gap: 6px; align-items: flex-end;
    opacity: 0.12;
  }
  .fb { width: 4px; border-radius: 2px; background: #2db5ab; }
  .fb:nth-child(1) { height: 30px; }
  .fb:nth-child(2) { height: 55px; }
  .fb:nth-child(3) { height: 80px; }
  .fb:nth-child(4) { height: 60px; }
  .fb:nth-child(5) { height: 35px; }
  /* Top accent line */
  .top-accent {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #2db5ab, rgba(46,181,171,0.1));
  }
</style>
</head>
<body>
<div class="card">
  <div class="top-accent"></div>
  <div class="left">
    <div class="logo-row">
      <div class="logo-icon">
        <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="30" y="52" width="12" height="24" rx="3" fill="rgba(255,255,255,0.7)"/>
          <rect x="48" y="42" width="12" height="44" rx="3" fill="rgba(255,255,255,0.8)"/>
          <rect x="66" y="32" width="12" height="56" rx="3" fill="rgba(255,255,255,0.95)"/>
          <rect x="84" y="38" width="12" height="44" rx="3" fill="rgba(255,255,255,0.8)"/>
          <circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-dasharray="220 90" stroke-linecap="round" transform="rotate(-105 60 60)"/>
          <path d="M 98 30 L 108 42 L 92 46 Z" fill="rgba(255,255,255,0.9)"/>
        </svg>
      </div>
    </div>
    <div class="title">AgilePlus</div>
    <div class="subtitle">Spec-driven development platform with CLI, desktop app, and gRPC server. Ship features with full traceability.</div>
    <div class="url">github.com/Phenotype/AgilePlus</div>
  </div>
  <div class="right">
    <div class="big-ring"></div>
    <div class="inner-ring"></div>
    <div class="float-bars">
      <div class="fb"></div><div class="fb"></div><div class="fb"></div>
      <div class="fb"></div><div class="fb"></div>
    </div>
  </div>
</div>
</body>
</html>
