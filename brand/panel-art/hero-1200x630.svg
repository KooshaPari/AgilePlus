<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1f1c"/>
      <stop offset="40%" stop-color="#060e0d"/>
      <stop offset="100%" stop-color="#040a09"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5ecec6"/>
      <stop offset="25%" stop-color="#2db5ab"/>
      <stop offset="50%" stop-color="#1a9e95"/>
      <stop offset="75%" stop-color="#157e77"/>
      <stop offset="100%" stop-color="#0f6962"/>
    </linearGradient>
    <linearGradient id="specGrad" x1="0" y1="0" x2="400" y2="200">
      <stop offset="0%" stop-color="white" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="rgba(0,70,65,0.55)"/>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#heroBg)"/>

  <!-- Grid lines -->
  <g opacity="0.04" stroke="#2db5ab" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="60" y1="0" x2="60" y2="630"/><line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/><line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/><line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/><line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/><line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1080" y1="0" x2="1080" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <!-- Ambient glow -->
  <circle cx="350" cy="300" r="300" fill="rgba(46,181,171,0.08)" filter="url(#softGlow)"/>

  <!-- Sprint rings -->
  <circle cx="850" cy="315" r="250" stroke="rgba(46,181,171,0.1)" stroke-width="1.5" fill="none"
    stroke-dasharray="1000 570" stroke-linecap="round" transform="rotate(-105 850 315)"/>
  <circle cx="850" cy="315" r="200" stroke="rgba(46,181,171,0.06)" stroke-width="1" fill="none"
    stroke-dasharray="800 460" stroke-linecap="round" transform="rotate(30 850 315)"/>

  <!-- Left content area -->
  <!-- Logo icon -->
  <g transform="translate(120, 180)">
    <rect width="80" height="80" rx="20" fill="url(#tealGrad)"/>
    <rect width="80" height="80" rx="20" fill="url(#specGrad)" opacity="0.3"/>
    <!-- Mini velocity bars -->
    <rect x="20" y="38" width="6" height="10" rx="2" fill="rgba(255,255,255,0.6)"/>
    <rect x="29" y="33" width="6" height="18" rx="2" fill="rgba(255,255,255,0.75)"/>
    <rect x="38" y="26" width="6" height="28" rx="2" fill="rgba(255,255,255,0.9)"/>
    <rect x="47" y="30" width="6" height="22" rx="2" fill="rgba(255,255,255,0.75)"/>
    <rect x="56" y="36" width="6" height="14" rx="2" fill="rgba(255,255,255,0.6)"/>
    <!-- Mini sprint ring -->
    <circle cx="40" cy="40" r="32" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none"
      stroke-dasharray="140 60" stroke-linecap="round" transform="rotate(-105 40 40)"/>
    <!-- Plus -->
    <rect x="36" y="24" width="8" height="22" rx="2" fill="white"/>
    <rect x="30" y="30" width="20" height="8" rx="2" fill="white"/>
  </g>

  <!-- Title text -->
  <text x="120" y="320" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Segoe UI, sans-serif"
    font-size="56" font-weight="700" fill="#e8f8f6" letter-spacing="-0.5">AgilePlus</text>
  <text x="120" y="360" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Segoe UI, sans-serif"
    font-size="18" font-weight="400" fill="rgba(160,220,215,0.5)" letter-spacing="3">SPEC-DRIVEN DEVELOPMENT</text>

  <!-- Description -->
  <text x="120" y="420" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Segoe UI, sans-serif"
    font-size="15" font-weight="400" fill="rgba(160,220,215,0.3)">CLI · Desktop App · gRPC Server</text>
  <text x="120" y="448" font-family="-apple-system, BlinkMacSystemFont, SF Pro Display, Segoe UI, sans-serif"
    font-size="15" font-weight="400" fill="rgba(160,220,215,0.3)">Full traceability from spec to ship.</text>

  <!-- Right side decorative velocity bars -->
  <g transform="translate(850, 200)" opacity="0.15">
    <rect x="0" y="60" width="8" height="30" rx="4" fill="#2db5ab"/>
    <rect x="16" y="35" width="8" height="55" rx="4" fill="#2db5ab"/>
    <rect x="32" y="10" width="8" height="80" rx="4" fill="#2db5ab"/>
    <rect x="48" y="25" width="8" height="65" rx="4" fill="#2db5ab"/>
    <rect x="64" y="50" width="8" height="40" rx="4" fill="#2db5ab"/>
  </g>

  <!-- Corner accents -->
  <line x1="40" y1="40" x2="120" y2="40" stroke="rgba(46,181,171,0.15)" stroke-width="1.5"/>
  <line x1="40" y1="40" x2="40" y2="120" stroke="rgba(46,181,171,0.15)" stroke-width="1.5"/>
  <line x1="1160" y1="590" x2="1080" y2="590" stroke="rgba(46,181,171,0.15)" stroke-width="1.5"/>
  <line x1="1160" y1="590" x2="1160" y2="510" stroke="rgba(46,181,171,0.15)" stroke-width="1.5"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="600" height="3" fill="url(#tealGrad)" opacity="0.6"/>
  <rect x="600" y="0" width="600" height="3" fill="#2db5ab" opacity="0.1"/>
</svg>
