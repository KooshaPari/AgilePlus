<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>AgilePlus Panel Art — Dashboard Hero</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: #060e0d;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
  }
  .panel {
    width: 1920px; height: 1080px;
    position: relative;
    background: linear-gradient(160deg, #0a1f1c 0%, #060e0d 50%, #040a09 100%);
  }
  /* Floating velocity bars */
  .float-bars {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) rotate(-12deg);
    display: flex; gap: 16px; align-items: flex-end;
    opacity: 0.15;
  }
  .fbar {
    width: 8px; border-radius: 4px;
    background: linear-gradient(to top, transparent, #2db5ab);
    animation: floatBar 3s ease-in-out infinite;
  }
  .fbar:nth-child(1) { height: 80px; animation-delay: 0s; }
  .fbar:nth-child(2) { height: 140px; animation-delay: 0.2s; }
  .fbar:nth-child(3) { height: 220px; animation-delay: 0.4s; }
  .fbar:nth-child(4) { height: 180px; animation-delay: 0.6s; }
  .fbar:nth-child(5) { height: 100px; animation-delay: 0.8s; }
  .fbar:nth-child(6) { height: 260px; animation-delay: 1.0s; }
  .fbar:nth-child(7) { height: 160px; animation-delay: 1.2s; }
  .fbar:nth-child(8) { height: 120px; animation-delay: 1.4s; }
  @keyframes floatBar {
    0%, 100% { transform: scaleY(1); opacity: 0.15; }
    50% { transform: scaleY(1.3); opacity: 0.35; }
  }
  /* Sprint ring */
  .sprint-ring {
    position: absolute;
    width: 600px; height: 600px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1.5px solid rgba(46,181,171,0.08);
    border-radius: 50%;
    border-top-color: rgba(46,181,171,0.2);
    border-right-color: rgba(46,181,171,0.12);
    animation: spin 20s linear infinite;
  }
  .sprint-ring-2 {
    position: absolute;
    width: 500px; height: 500px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 1px solid rgba(46,181,171,0.06);
    border-radius: 50%;
    border-bottom-color: rgba(46,181,171,0.15);
    animation: spin 30s linear infinite reverse;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
  /* Corner accents */
  .corner-tl {
    position: absolute; top: 40px; left: 40px;
    width: 80px; height: 80px;
    border-top: 1.5px solid rgba(46,181,171,0.15);
    border-left: 1.5px solid rgba(46,181,171,0.15);
  }
  .corner-br {
    position: absolute; bottom: 40px; right: 40px;
    width: 80px; height: 80px;
    border-bottom: 1.5px solid rgba(46,181,171,0.15);
    border-right: 1.5px solid rgba(46,181,171,0.15);
  }
  /* Text overlay */
  .overlay-text {
    position: absolute;
    bottom: 80px; right: 80px;
    text-align: right;
  }
  .overlay-text h2 {
    font-size: 28px; font-weight: 600;
    color: rgba(232,248,246,0.12);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .overlay-text p {
    font-size: 14px; font-weight: 400;
    color: rgba(160,220,215,0.08);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="panel">
  <div class="float-bars">
    <div class="fbar"></div><div class="fbar"></div><div class="fbar"></div>
    <div class="fbar"></div><div class="fbar"></div><div class="fbar"></div>
    <div class="fbar"></div><div class="fbar"></div>
  </div>
  <div class="sprint-ring"></div>
  <div class="sprint-ring-2"></div>
  <div class="corner-tl"></div>
  <div class="corner-br"></div>
  <div class="overlay-text">
    <h2>AgilePlus</h2>
    <p>spec-driven development</p>
  </div>
</div>
</body>
</html>
