<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1.0">
<title>AgilePlus Splash Screen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px;
    background: #0a1a18;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
  }
  .splash-root {
    width: 1920px; height: 1080px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 45%, #0f3832 0%, #0a1a18 60%, #060e0d 100%);
  }
  /* Ambient teal glow */
  .glow-main {
    position: absolute;
    width: 900px; height: 900px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(46,181,171,0.15) 0%, rgba(46,181,171,0.05) 40%, transparent 70%);
    filter: blur(60px);
    animation: pulse 4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
  }
  /* Grid lines */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(46,181,171,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,181,171,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    mask-image: radial-gradient(ellipse at 50% 50%, black 30%, transparent 70%);
  }
  /* Center content */
  .center {
    position: relative; z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 32px;
  }
  .logo-icon {
    width: 160px; height: 160px;
    border-radius: 36px;
    background: linear-gradient(155deg, #5ecec6 0%, #2db5ab 25%, #1a9e95 50%, #157e77 75%, #0f6962 100%);
    box-shadow: 0 20px 60px rgba(46,181,171,0.3), 0 0 120px rgba(46,181,171,0.1);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .logo-icon::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(140deg, rgba(255,255,255,0.4) 0%, transparent 25%);
    border-radius: inherit;
  }
  .logo-icon svg {
    width: 90px; height: 90px;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.3));
  }
  .title {
    font-size: 56px; font-weight: 700;
    color: #e8f8f6;
    letter-spacing: -0.5px;
  }
  .subtitle {
    font-size: 20px; font-weight: 400;
    color: rgba(160,220,215,0.6);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  /* Velocity bars decoration */
  .bars {
    position: absolute;
    bottom: 120px; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 8px; align-items: flex-end;
    opacity: 0.3;
  }
  .bar {
    width: 4px;
    background: linear-gradient(to top, transparent, #2db5ab);
    border-radius: 2px;
    animation: barPulse 2s ease-in-out infinite;
  }
  .bar:nth-child(1) { height: 20px; animation-delay: 0s; }
  .bar:nth-child(2) { height: 35px; animation-delay: 0.15s; }
  .bar:nth-child(3) { height: 50px; animation-delay: 0.3s; }
  .bar:nth-child(4) { height: 35px; animation-delay: 0.45s; }
  .bar:nth-child(5) { height: 20px; animation-delay: 0.6s; }
  @keyframes barPulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.8; }
  }
  /* Sprint ring */
  .ring {
    position: absolute;
    width: 300px; height: 300px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(46,181,171,0.1);
    border-radius: 50%;
    border-top-color: rgba(46,181,171,0.3);
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
</style>
</head>
<body>
<div class="splash-root">
  <div class="glow-main"></div>
  <div class="grid"></div>
  <div class="ring"></div>
  <div class="center">
    <div class="logo-icon">
      <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="30" y="52" width="12" height="24" rx="3" fill="rgba(255,255,255,0.7)"/>
        <rect x="48" y="42" width="12" height="44" rx="3" fill="rgba(255,255,255,0.8)"/>
        <rect x="66" y="32" width="12" height="56" rx="3" fill="rgba(255,255,255,0.95)"/>
        <rect x="84" y="38" width="12" height="44" rx="3" fill="rgba(255,255,255,0.8)"/>
        <circle cx="60" cy="60" r="50" stroke="rgba(255,255,255,0.3)" stroke-width="3" fill="none" stroke-dasharray="220 90" stroke-linecap="round" transform="rotate(-105 60 60)"/>
        <path d="M 98 30 L 108 42 L 92 46 Z" fill="rgba(255,255,255,0.9)"/>
      </svg>
    </div>
    <div class="title">AgilePlus</div>
    <div class="subtitle">Spec-Driven Development</div>
  </div>
  <div class="bars">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>
</body>
</html>
