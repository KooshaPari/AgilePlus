# =============================================================================
# AgilePlus — Rust Workspace
# =============================================================================
#
# 21-crate Cargo workspace powering the AgilePlus platform: a Rust+TypeScript
# product & engineering management system with an Axum HTTP/gRPC backend, a
# SQLite-backed local store, an Electrobun desktop app, and a React/TS
# dashboard.
#
# Crate layout (each crate has its own README and CHANGELOG):
#
#   Domain & Application core (pure-Rust, no I/O):
#     - agileplus-domain         Domain types, aggregates, invariants
#     - agileplus-application    Use cases / services orchestrating domain
#     - agileplus-config         Typed config loading & validation
#     - agileplus-events         Domain event taxonomy & envelope
#     - agileplus-proto          Generated prost/tonic protobuf bindings
#     - agileplus-fixtures       Test data builders (dev-dep)
#
#   Infrastructure adapters (I/O-bound):
#     - agileplus-sqlite         SQLite repository implementation
#     - agileplus-cache          In-memory + SQLite cache layer
#     - agileplus-git            gix-based Git adapter
#     - agileplus-nats           Async-nats pub/sub adapter
#     - agileplus-telemetry      OpenTelemetry + tracing init
#     - agileplus-import         Bulk import from GitHub / Plane
#
#   Interfaces (transport / surface):
#     - agileplus-api            Axum HTTP server + REST endpoints
#     - agileplus-grpc           Tonic gRPC server
#     - agileplus-dashboard      React/TS web dashboard + health server
#     - agileplus-github         GitHub webhook + sync adapter
#     - agileplus-plane          Plane.so adapter
#     - agileplus-p2p            libp2p / p2p sync transport
#     - agileplus-triage         Triage queue / classifier
#
#   Operations & DX:
#     - agileplus-cli            Top-level binary `agileplus` (clap subcmds)
#     - xtask-anti-patterns      Build-time linter catching cargo anti-patterns
#
# Build & verify:
#   cargo build --workspace --all-targets      # compile everything
#   cargo test  --workspace                    # 646 tests
#   cargo clippy --workspace --all-targets -- -D warnings
#   cargo run -p xtask-anti-patterns           # workspace linter
#
# See SPEC.md, FUNCTIONAL_REQUIREMENTS.md, AGENTS.md, and CONTRIBUTING.md
# for design rationale and contributor workflow.
# =============================================================================

[workspace]
resolver = "3"
# All workspace members removed — AgilePlus has no Rust source files.
# The real codebase lives in agile-main worktree (rust/ dir).
# Canonical Cargo.toml updated to remove all empty members to prevent
# "failed to load manifest: no targets specified" errors.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[package]
name = "agileplus"
version.workspace = true
edition.workspace = true
license = "MIT OR Apache-2.0"
description = "AgilePlus — Rust+TypeScript product & engineering management platform with Axum HTTP/gRPC backend, SQLite local store, Electrobun desktop app, and React/TS dashboard"
homepage = "https://github.com/KooshaPari/AgilePlus"
documentation = "https://docs.rs/agileplus"
repository = "https://github.com/KooshaPari/AgilePlus"
readme = "README.md"
publish = false
keywords = ["phenotype", "agileplus"]
categories = ["development-tools"]
authors = ["kooshapari"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
axum.workspace = true
chrono.workspace = true

[package.metadata.cargo-machete]
ignored = [
  "anyhow",
  "axum",
  "chrono",
  "serde",
  "serde_json",
  "thiserror",
  "tokio",
  "tracing",
]

[dev-dependencies]
axum-test = "20.1.0"
chrono.workspace = true
clap = { version = "4", features = ["derive"] }
clap-ext = { git = "https://github.com/KooshaPari/clap-ext", tag = "v0.1.0" }
cucumber = "0.23"
sha2.workspace = true

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.46", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "fmt",
  "json",
] }
tracing-appender = "0.2"
serde_yaml = "0.9"
url = "2"
dirs = "5"
tempfile = "3"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
tonic = { version = "0.13", features = ["transport", "prost"] }
tonic-build = "0.13"
prost = "0.13"
prost-build = "0.13"
gix = "0.83.0"
# OpenTelemetry - matching versions for compatibility
opentelemetry = { version = "0.27", features = ["metrics"] }
opentelemetry_sdk = { version = "0.27", features = [
  "metrics",
  "trace",
  "rt-tokio",
] }
opentelemetry-otlp = { version = "0.27", features = [
  "tonic",
  "gzip-tonic",
  "http-proto",
  "reqwest-client",
] }
# OpenTelemetry tracing bridge — uncomment when ready to use
tracing-opentelemetry = "0.27"
utoipa = "4"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
async-nats = "0.47"
paste = "1"
phenotype-error-core = { git = "https://github.com/KooshaPari/phenoShared", branch = "main" }
traceability-core = { path = "crates/traceability-core" }
indexmap = { version = "2", features = ["serde"] }
phenotype-logging = { git = "https://github.com/KooshaPari/phenoShared", branch = "main" }
agileplus-api = { path = "crates/agileplus-api" }
agileplus-artifacts = { path = "crates/agileplus-artifacts" }
agileplus-cache = { path = "crates/agileplus-cache" }
agileplus-config = { path = "crates/agileplus-config" }
agileplus-convoy = { path = "crates/agileplus-convoy" }
agileplus-domain = { path = "crates/agileplus-domain" }
agileplus-events = { path = "crates/agileplus-events" }
agileplus-graph = { path = "crates/agileplus-graph" }
agileplus-nats = { path = "crates/agileplus-nats" }
agileplus-proto = { path = "crates/agileplus-proto" }
agileplus-telemetry = { path = "crates/agileplus-telemetry" }
agileplus-validate = { path = "crates/agileplus-validate" }
agileplus-witness = { path = "crates/agileplus-witness" }
shared-traceability = { path = "crates/shared-traceability" }
toml = "0.8"
tokio-stream = { version = "0.1", features = ["net", "sync"] }

# cargo-machete false-positive ignores (dev-only / proc-macro / build-deps)
[workspace.metadata.cargo-machete]
ignored = ["cucumber", "axum-test", "paste", "dirs", "serde_yaml", "uuid", "async-trait", "tracing-subscriber", "tracing-appender", "tracing-opentelemetry", "futures", "futures-util", "tonic", "tonic-build", "prost", "prost-build", "utoipa", "opentelemetry", "opentelemetry_sdk", "opentelemetry-otlp", "gix", "tempfile"]

