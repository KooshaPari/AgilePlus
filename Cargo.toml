[workspace]
resolver = "2"
# Active members — only crates/libs with actual source files.
# Remaining scaffolding (44 crates, 19 libs) tracked but excluded from
# workspace until source is implemented. See: kitty-specs/003-agileplus-platform-completion.
members = [
  "tests/e2e", # installed-CLI round-trip; workflow runs this crate from its manifest directory
  "tests/e2e-desktop", # E2E tests for the Tauri desktop app (DB, CLI bridge, tray, config)
  "tests/transport", # Transport-layer integration tests (gRPC, CLI, IPC)
  "tests/bdd", # fixture and Cucumber acceptance tests
  "crates/agileplus-proto", # canonical tonic/prost gRPC contract
  "crates/agileplus-grpc", # loopback Rust core consumed by the MCP bridge
  "crates/agileplus-cli", # agileplus: spec-first CLI binary
  "crates/agileplus-subcmds", # platform/dashboard CLI subcommands (platform health)
  "crates/agileplus-api", # HTTP API binary (default port 3000)
  "crates/agileplus-application",
  "crates/agileplus-domain",
  "crates/agileplus-governance", # SpecKitty scorecard enforcement (rubric + scoring)
  "crates/traceability-core", # unified PM/traceability spine (un-park 2026-07-04)
  "crates/agileplus-git",
  "crates/agileplus-github",
  "crates/agileplus-graph",
  "crates/agileplus-plane",
  "crates/agileplus-sqlite",
  "crates/agileplus-triage",
  "crates/agileplus-telemetry",
  "crates/agileplus-dashboard",
  "crates/agileplus-events",
  "crates/agileplus-benchmarks",
  "crates/agileplus-api-types",
  "crates/agileplus-cache",
  "crates/agileplus-contract-tests",
  "crates/agileplus-error-core",
  "crates/agileplus-import",
  "crates/agileplus-integration-tests",
  "crates/agileplus-nats",
  "crates/agileplus-p2p",
  "crates/agileplus-sync",
  "agileplus-agents/crates/agileplus-agent-dispatch",
  "agileplus-agents/crates/agileplus-agent-review",
  "agileplus-agents/crates/agileplus-agent-service",
  "desktop/src-tauri", # Tauri desktop app
  # NOTE: clap-ext temporarily excluded — incompatible clap version constraint (4.3.x vs 4.6.x). Tracked in PR #924.
]

[workspace.package]
version = "0.2.3"
edition = "2024"
license = "MIT"
rust-version = "1.88"
authors = ["Koosha Pari <kooshapari@kooshapari.com>"]
repository = "https://github.com/KooshaPari/AgilePlus"
homepage = "https://phenotype.space/agileplus"
description = "AgilePlus — spec-first project management CLI (FR/NFR traceability)"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

# Config for 'dist'
[workspace.metadata.dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Which actions to run on pull requests
pr-run-mode = "plan"
# Whether to install an updater program
install-updater = false

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Async runtime
tokio = { version = "1.39", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
futures-util = "0.3"

# Error handling
thiserror = "2"
anyhow = "1"

# Domain / traceability-core support (un-park 2026-07-04)
# (toml/dirs-next/zeroize/async-trait already declared below.)
indexmap = { version = "2", features = ["serde"] }
regex = "1"

# Web / HTTP
axum = { version = "0.8", features = ["json", "macros"] }
axum-extra = { version = "0.12", features = ["typed-header"] }
tower = { version = "0.5", features = ["limit", "timeout"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
hyper = "1"
hyper-util = "0.1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
opentelemetry = { version = "0.32", features = ["metrics"] }
opentelemetry_sdk = { version = "0.32.1", features = [
  "metrics",
  "trace",
  "rt-tokio",
] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic", "gzip-tonic"] }
tracing-opentelemetry = "0.33"
sentry = { version = "0.34", features = ["tracing"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Crypto / hashing
sha2 = "0.11"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.23"
aes-gcm = "0.11"
argon2 = "0.6"

# gRPC / proto (used by agileplus-proto, agileplus-grpc, plugin-grpc, agent-service)
tonic = { version = "0.14", features = ["transport"] }
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tonic-health = "0.14"
prost = "0.14"
prost-build = "0.14"

# Async utilities
async-trait = "0.1"

# Templating
askama = "0.16"

# Plugin crates (external from separate repos) — disabled for standalone build
# agileplus-plugin-core = { git = "https://github.com/KooshaPari/agileplus-plugin-core" }
# agileplus-plugin-git = { git = "https://github.com/KooshaPari/agileplus-plugin-git" }
# agileplus-plugin-sqlite = { git = "https://github.com/KooshaPari/agileplus-plugin-sqlite" }

# Git
gix = "0.87"
git2 = "0.19"

# CLI
clap = { version = "4", features = ["derive"] }
assert_cmd = "2"
predicates = "3"

# Data / storage
rusqlite = { version = "0.40", features = ["bundled"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# Benchmarks
criterion = "0.8"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
toml = "1.1"
dirs-next = "2"
keyring = "4"
# Test-only deps used by legacy/obsolete test files (traceability integration tests).
tempfile = "3"
proptest = "1"
tokio-test = "0.4"

# OpenAPI
utoipa = "5"
# Concurrency
dashmap = "6"

# Internal crates (newly absorbed)
agileplus-error-core = { path = "crates/agileplus-error-core" }

# Async-nats
async-nats = "0.38"
paste = "1"
agileplus-config = { path = "crates/agileplus-config" }
agileplus-proto = { path = "crates/agileplus-proto" }
agileplus-telemetry = { version = "0.2.1", path = "crates/agileplus-telemetry" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# cargo-machete false-positive ignores (dev-only / proc-macro / build-deps)
[workspace.metadata.cargo-machete]
ignored = [
  "cucumber",
  "axum-test",
  "paste",
  "dirs",
  "serde_yaml",
  "uuid",
  "async-trait",
  "tracing-subscriber",
  "tracing-appender",
  "tracing-opentelemetry",
  "futures",
  "futures-util",
  "tonic",
  "tonic-build",
  "prost",
  "prost-build",
  "utoipa",
  "opentelemetry",
  "opentelemetry_sdk",
  "opentelemetry-otlp",
  "gix",
  "tempfile",
]
