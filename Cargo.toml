[workspace]
resolver = "3"
# All workspace members removed — AgilePlus has no Rust source files.
# The real codebase lives in agile-main worktree (rust/ dir).
# Canonical Cargo.toml updated to remove all empty members to prevent
# "failed to load manifest: no targets specified" errors.

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["AgilePlus Team"]
repository = "https://github.com/KooshaPari/AgilePlus"
keywords = ["agile", "project-management", "software-development"]
categories = ["Software Development", "Project Management"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
tokio = { version = "1.39", features = ["full"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-opentelemetry = "0.32"
futures-util = "0.3"
axum = { version = "0.8", features = ["json", "macros"] }
tonic = { version = "0.13", features = ["transport"] }
tonic-build = { version = "0.13", features = ["prost"] }
prost = "0.13"
opentelemetry = { version = "0.31", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.31", features = [
  "trace",
  "metrics",
  "http-proto",
  "reqwest-client",
] }
opentelemetry_sdk = { version = "0.31", features = [
  "trace",
  "metrics",
  "rt-tokio",
] }
criterion = { version = "0.5", features = ["async_tokio", "html_reports"] }
time = ">=0.3.47"
trait-variant = "0.1"
async-trait = "0.1"
sentry = { version = "0.33", features = [
  "backtrace",
  "contexts",
  "debug-images",
] }

# OpenAPI scaffolding (utoipa). See WP: feat/rest-openapi-scaffold (#138, #118).
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

# Plugin crates (external from separate repos) were removed in #144:
# the three git remotes (agileplus-plugin-{core,git,sqlite}) all return 404.
# Re-introduce either by vendoring into `crates/` or publishing the stubs
# under KooshaPari/ before re-adding. Tracked in GH issues #79/#82/#138/#142/#144.

# Git operations
gix = "0.82"
git2 = "0.20"

# Database
rusqlite = { version = "0.33", features = ["bundled"] }
