[package]
name = "agileplus-desktop"
version = "0.2.0"
description = "AgilePlus desktop client (Tauri). Offline-first, operates on local repo state."
authors = ["Phenotype <kooshapari@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/KooshaPari/AgilePlus"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# AgilePlus core crates
agileplus-domain = { path = "../../crates/agileplus-domain" }
agileplus-sqlite = { path = "../../crates/agileplus-sqlite" }
agileplus-application = { path = "../../crates/agileplus-application" }

# Database
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs-next = "2"

[package.metadata.dist]
dist = false
