<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgilePlus Desktop</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash" class="splash">
    <div class="splash-content">
      <div class="splash-logo">
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" fill="#1c2029"/>
          <rect x="1" y="1" width="62" height="62" rx="13" stroke="#4f8cff" stroke-width="1.5" stroke-opacity="0.3"/>
          <path d="M20 44V20h6l8 12 8-12h6v24h-5V29l-7 10h-4l-7-10v15h-5z" fill="#4f8cff"/>
          <circle cx="52" cy="16" r="4" fill="#6ee7b7"/>
        </svg>
      </div>
      <h1 class="splash-title">AgilePlus</h1>
      <p class="splash-subtitle">Spec-Driven Development</p>
      <div class="splash-spinner">
        <div class="spinner"></div>
      </div>
      <p class="splash-status" id="splash-status">Initializing...</p>
    </div>
  </div>

  <!-- Main App (hidden until splash completes) -->
  <div id="app" class="app hidden">
    <header class="app-header">
      <div class="app-brand">
        <svg class="app-icon" width="22" height="22" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="14" fill="#1c2029"/>
          <path d="M20 44V20h6l8 12 8-12h6v24h-5V29l-7 10h-4l-7-10v15h-5z" fill="#4f8cff"/>
          <circle cx="52" cy="16" r="4" fill="#6ee7b7"/>
        </svg>
        <h1>AgilePlus</h1>
      </div>
      <span class="repo-root" id="repo-root">local mode</span>
    </header>

    <nav class="sidebar" id="sidebar"></nav>

    <main class="content" id="content">
      <div class="loading"><div class="spinner spinner-inline"></div></div>
    </main>

    <footer class="app-footer">
      <span>offline &middot; local SQLite &middot; Tauri desktop</span>
    </footer>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
