<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgilePlus Desktop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 {
            color: #4ade80;
            margin-bottom: 20px;
        }
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #0f3460;
        }
        .stat-card h3 {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 8px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #4ade80;
        }
        .features {
            background: #16213e;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #0f3460;
        }
        .features h2 {
            margin-bottom: 15px;
            color: #a0aec0;
        }
        .feature-list {
            list-style: none;
        }
        .feature-item {
            padding: 12px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .feature-item:last-child {
            border-bottom: none;
        }
        .feature-name {
            font-weight: 500;
        }
        .feature-state {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }
        .state-created { background: #374151; color: #9ca3af; }
        .state-specified { background: #1e40af; color: #93c5fd; }
        .state-researched { background: #7c3aed; color: #c4b5fd; }
        .state-planned { background: #b45309; color: #fcd34d; }
        .state-implementing { background: #047857; color: #6ee7b7; }
        .state-validated { background: #0369a1; color: #7dd3fc; }
        .state-shipped { background: #15803d; color: #86efac; }
        .state-retrospected { background: #6b21a8; color: #d8b4fe; }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        button {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
        }
        button:hover {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <h1>AgilePlus Desktop</h1>
    
    <div class="dashboard">
        <div class="stat-card">
            <h3>Total Features</h3>
            <div class="value" id="total-features">0</div>
        </div>
        <div class="stat-card">
            <h3>In Progress</h3>
            <div class="value" id="in-progress">0</div>
        </div>
        <div class="stat-card">
            <h3>Shipped</h3>
            <div class="value" id="shipped">0</div>
        </div>
    </div>

    <div class="features">
        <h2>Features</h2>
        <ul class="feature-list" id="feature-list">
            <li class="empty-state">No features yet. Create one to get started!</li>
        </ul>
    </div>

    <script>
        // This will be populated with Tauri invoke calls
        async function loadDashboard() {
            try {
                // Placeholder for Tauri invoke
                console.log('Loading dashboard...');
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        async function loadFeatures() {
            try {
                // Placeholder for Tauri invoke
                console.log('Loading features...');
            } catch (error) {
                console.error('Failed to load features:', error);
            }
        }

        // Initialize
        loadDashboard();
        loadFeatures();
    </script>
</body>
</html>
