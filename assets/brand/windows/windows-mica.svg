<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AgilePlus Windows Mica">
  <title>AgilePlus</title>
  <desc>AI-coded SVG: phenotype design-system windows-mica recipe. Stacked stained-mica: blur(40px) saturate(1.8), fill 82-85%, FLAT divider border (no white specular), accent tint 6% dark-only, radius 8. Teal #7ebab5 on midnight #090a0c.</desc>
  <defs>
    <!-- Mica heavy blur: 40px, saturate 1.8 -->
    <filter id="wm-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="saturate" values="1.8" result="saturated"/>
    </filter>

    <!-- Mica stain layer 1: deep midnight with teal tint -->
    <linearGradient id="wm-mica1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090a0c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0d1412" stop-opacity="0.82"/>
    </linearGradient>

    <!-- Mica stain layer 2: teal accent tint (6% dark-only) -->
    <linearGradient id="wm-mica2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ebab5" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#569691" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Mica stain layer 3: slate overlay -->
    <linearGradient id="wm-mica3" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#353a40" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Mica fill: 83% average opacity, no specular highlights -->
    <linearGradient id="wm-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111618" stop-opacity="0.83"/>
      <stop offset="50%" stop-color="#0d1412" stop-opacity="0.84"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Sprint loop teal -->
    <linearGradient id="wm-loop" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ebab5"/>
      <stop offset="100%" stop-color="#95ccc8"/>
    </linearGradient>

    <!-- Bars -->
    <linearGradient id="wm-bars" x1="176" y1="336" x2="336" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#569691"/>
      <stop offset="100%" stop-color="#7ebab5"/>
    </linearGradient>

    <clipPath id="wm-clip">
      <rect x="24" y="24" width="464" height="464" rx="8" ry="8"/>
    </clipPath>
  </defs>

  <!-- === STACKED STAINED-MICA BACKGROUND === -->
  <!-- 1. Midnight base -->
  <rect x="24" y="24" width="464" height="464" rx="8" ry="8" fill="#090a0c"/>

  <g clip-path="url(#wm-clip)">
    <!-- 2. Mica blur substrate (teal-stained, heavy 40px blur) -->
    <ellipse cx="256" cy="256" rx="230" ry="200" fill="#7ebab5" opacity="0.14" filter="url(#wm-blur)"/>
    <ellipse cx="180" cy="320" rx="150" ry="120" fill="#353a40" opacity="0.22" filter="url(#wm-blur)"/>
    <ellipse cx="330" cy="160" rx="130" ry="110" fill="#569691" opacity="0.10" filter="url(#wm-blur)"/>

    <!-- 3. Mica stain layer 1 (main opaque body, 82-85%) -->
    <rect x="24" y="24" width="464" height="464" fill="url(#wm-fill)"/>

    <!-- 4. Teal accent stain (6% dark-only) -->
    <rect x="24" y="24" width="464" height="464" fill="url(#wm-mica2)"/>

    <!-- 5. Slate diagonal stain -->
    <rect x="24" y="24" width="464" height="464" fill="url(#wm-mica3)"/>

    <!-- 6. Subtle horizontal divider stripe (FLAT, no specular — Mica style) -->
    <!-- Top divider at ~10% = 46px from top -->
    <rect x="24" y="69" width="464" height="1" fill="#7ebab5" opacity="0.12"/>
    <!-- Bottom divider at ~90% -->
    <rect x="24" y="443" width="464" height="1" fill="#7ebab5" opacity="0.10"/>
  </g>

  <!-- 7. Flat divider border: no white specular, just a thin slate/teal line -->
  <rect x="24" y="24" width="464" height="464" rx="8" ry="8" fill="none"
        stroke="#353a40" stroke-width="1.5" stroke-opacity="0.70"/>
  <!-- Subtle teal accent border tint -->
  <rect x="24" y="24" width="464" height="464" rx="8" ry="8" fill="none"
        stroke="#7ebab5" stroke-width="0.5" stroke-opacity="0.18"/>

  <!-- === ICON CONTENT === -->
  <path d="M 300 130 A 138 138 0 1 1 196 142"
        fill="none" stroke="url(#wm-loop)" stroke-width="30" stroke-linecap="round"/>
  <path d="M 282 100 L 318 130 L 282 160 Z" fill="#7ebab5"/>

  <rect x="196" y="300" width="32" height="52" rx="8" fill="url(#wm-bars)" opacity="0.95"/>
  <rect x="238" y="266" width="32" height="86" rx="8" fill="url(#wm-bars)" opacity="0.95"/>
  <rect x="280" y="224" width="32" height="128" rx="8" fill="url(#wm-bars)" opacity="0.95"/>

  <g fill="#f6f5f5" opacity="0.92">
    <rect x="350" y="158" width="52" height="16" rx="6"/>
    <rect x="368" y="140" width="16" height="52" rx="6"/>
  </g>
</svg>
