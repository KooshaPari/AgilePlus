<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="AgilePlus macOS Liquid">
  <title>AgilePlus</title>
  <desc>AI-coded SVG: phenotype design-system macos-liquid recipe. blur(20px) saturate(1.4), fill 60%, top-edge specular gradient 70%->0% over 8% height, inner highlight 80%/10%, border 55%/10%, radius 14. Teal #7ebab5 on midnight #090a0c.</desc>
  <defs>
    <!-- macOS liquid blur: 20px, saturate 1.4 -->
    <filter id="ml-blur" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="saturate" values="1.4" result="saturated"/>
    </filter>

    <!-- Top-edge specular via feSpecularLighting: 70%->0% over 8% height (~37px) -->
    <filter id="ml-topspec" x="0%" y="0%" width="100%" height="100%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="ablur"/>
      <feSpecularLighting in="ablur" surfaceScale="6" specularConstant="0.8" specularExponent="30" result="spec" lighting-color="white">
        <feDistantLight azimuth="270" elevation="75"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in"/>
    </filter>

    <!-- Glass fill: 60% opacity teal-to-midnight -->
    <linearGradient id="ml-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ebab5" stop-opacity="0.42"/>
      <stop offset="50%" stop-color="#353a40" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0.78"/>
    </linearGradient>

    <!-- Top-edge specular: 70% at top, 0% at 8% height (40px) -->
    <linearGradient id="ml-topedge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.70"/>
      <stop offset="8%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="16%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Inner highlight gradient: 80% opacity, 10% from edge -->
    <linearGradient id="ml-inner-hl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="10%" stop-color="#7ebab5" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7ebab5" stop-opacity="0"/>
    </linearGradient>

    <!-- Liquid depth: subtle teal mid-body refraction -->
    <radialGradient id="ml-depth" cx="40%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#95ccc8" stop-opacity="0.28"/>
      <stop offset="70%" stop-color="#7ebab5" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#090a0c" stop-opacity="0"/>
    </radialGradient>

    <!-- Sprint loop teal -->
    <linearGradient id="ml-loop" x1="96" y1="96" x2="416" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7ebab5"/>
      <stop offset="100%" stop-color="#95ccc8"/>
    </linearGradient>

    <!-- Bars -->
    <linearGradient id="ml-bars" x1="176" y1="336" x2="336" y2="176" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#569691"/>
      <stop offset="100%" stop-color="#7ebab5"/>
    </linearGradient>

    <clipPath id="ml-clip">
      <rect x="24" y="24" width="464" height="464" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- === LIQUID GLASS BACKGROUND === -->
  <!-- 1. Midnight base -->
  <rect x="24" y="24" width="464" height="464" rx="14" ry="14" fill="#090a0c"/>

  <g clip-path="url(#ml-clip)">
    <!-- 2. Frosted teal ambient (blur layer, 60% fill) -->
    <ellipse cx="256" cy="180" rx="220" ry="170" fill="#7ebab5" opacity="0.20" filter="url(#ml-blur)"/>
    <ellipse cx="310" cy="350" rx="140" ry="110" fill="#95ccc8" opacity="0.12" filter="url(#ml-blur)"/>

    <!-- 3. Main liquid fill: 60% opacity -->
    <rect x="24" y="24" width="464" height="464" fill="url(#ml-fill)" opacity="0.60"/>

    <!-- 4. Radial depth/refraction tint -->
    <rect x="24" y="24" width="464" height="464" fill="url(#ml-depth)"/>

    <!-- 5. Inner highlight strip: 80% opacity, 10% height from top = 46px tall strip -->
    <rect x="34" y="34" width="444" height="46" rx="10" fill="url(#ml-inner-hl)"/>

    <!-- 6. Top-edge specular: 70% white -> 0% over 8% = ~37px -->
    <rect x="24" y="24" width="464" height="37" rx="14" fill="url(#ml-topedge)"/>
  </g>

  <!-- 7. Border: 55% opacity, 10% stroke-width (≈46px inset feel → use 1.5px crisp outer) -->
  <rect x="24" y="24" width="464" height="464" rx="14" ry="14" fill="none"
        stroke="white" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- === ICON CONTENT === -->
  <path d="M 300 130 A 138 138 0 1 1 196 142"
        fill="none" stroke="url(#ml-loop)" stroke-width="30" stroke-linecap="round"/>
  <path d="M 282 100 L 318 130 L 282 160 Z" fill="#7ebab5"/>

  <rect x="196" y="300" width="32" height="52" rx="10" fill="url(#ml-bars)" opacity="0.95"/>
  <rect x="238" y="266" width="32" height="86" rx="10" fill="url(#ml-bars)" opacity="0.95"/>
  <rect x="280" y="224" width="32" height="128" rx="10" fill="url(#ml-bars)" opacity="0.95"/>

  <g fill="#f6f5f5" opacity="0.95">
    <rect x="350" y="158" width="52" height="16" rx="8"/>
    <rect x="368" y="140" width="16" height="52" rx="8"/>
  </g>
</svg>
