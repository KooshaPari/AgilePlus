[advisories]
# Repository-local config for `cargo audit` / rustsec/audit-check.
#
# PATH IS LOAD-BEARING (A/B verified 2026-10-15): cargo-audit resolves the
# repo-local config from `.cargo/audit.toml`, NOT from `./audit.toml`. A root
# `audit.toml` existed with 8 IDs and was silently dead config; it was removed
# and its content merged here.
#
# A/B PROOF: with only the root file present, `cargo audit --json` reported
# `settings.ignore` as the CLI flag alone (the root file was never read); with
# `.cargo/audit.toml` present, all 10 IDs appeared in `settings.ignore`.
#
# DO NOT ATTRIBUTE THE CRON FAILURE HISTORY TO THIS FILE. The longest
# schedule-run failure streak in the 100-run window ending 2026-10-15
# is 6 consecutive runs, 2026-10-11T08:06Z to 2026-10-12T00:08Z, all on
# commit 2701f24 (the next run on that commit at 2026-10-12T03:49Z was
# success). Its ONE root cause was the missing `issues: write` grant
# (fixed by 61f0aade; verified by cargo-audit schedule run 38550458606
# on 2026-10-14T10:33:56Z, "No vulnerabilities were found"). An
# ignore-list change does not control the exit code here -- every entry
# below was individually removed and `cargo audit` still exited 0,
# because these advisories classify as informational warnings, not
# `vulnerabilities`. See run 37617720114, which failed with
# `Resource not accessible by integration` while reporting
# `vulnerabilities count:3` — the gate asserts on the issue POST, not
# on the advisory count.
ignore = [
  # rsa: Marvin Attack (RUSTSEC-2023-0071) — no fixed release upstream;
  # low risk in our usage (verification only, no decryption oracle).
  "RUSTSEC-2023-0071",
  # backoff: unmaintained (RUSTSEC-2025-0012) — retry utility pulled in
  # transitively; no security impact.
  "RUSTSEC-2025-0012",
  # instant: unmaintained (RUSTSEC-2024-0384) — superseded by web-time
  # upstream but pinned by transitive deps. No security impact.
  "RUSTSEC-2024-0384",
  # paste: no longer maintained (RUSTSEC-2024-0436) — archival advisory, no
  # security impact; proc-macro contexts only.
  "RUSTSEC-2024-0436",
  # proc-macro-error: unmaintained, build-time only via glib-macros 0.18
  # (tauri tray-icon stack). glib 0.18 pins it; no fix until tauri/tray-icon
  # bump. Classified informational/unmaintained, not a code vuln.
  "RUSTSEC-2024-0370",
  # custom_derive: unmaintained macro helper (RUSTSEC-2025-0058).
  "RUSTSEC-2025-0058",
  # rustls-pemfile: unmaintained (RUSTSEC-2025-0134) — archived 2025-08; the
  # crate is a thin wrapper over rustls-pki-types' PemObject, so migration is
  # straightforward. Pulled in transitively (rustls/rcgen side of the tree).
  # NOTE: rustls-pemfile is a different crate from rustls; the rustls
  # RUSTSEC-2026-03xx advisories were closed by the 0.23.46 bump (51be78be).
  "RUSTSEC-2025-0134",
  # glib VariantStrIter: 0.18.5 is latest resolvable in this tauri graph;
  # fixed in 0.20.0 behind tauri PR #16170 ("update gtk crates to 0.19").
  # Dependabot run 38524349833 (2026-10-14) confirmed
  # security_update_not_possible: latest-resolvable 0.18.5,
  # lowest-non-vulnerable 0.20.0, conflicting-dependencies [].
  # Re-evaluate when tauri PR #16170 lands.
  "RUSTSEC-2024-0429",
  # Pre-existing entries retained verbatim (no per-entry rationale was
  # recorded in the old .cargo/audit.toml).
  "RUSTSEC-2025-0140",
  "RUSTSEC-2026-0049",
]
