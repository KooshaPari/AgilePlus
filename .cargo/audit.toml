[advisories]
# Repository-local config for `cargo audit` / rustsec/audit-check.
#
# PATH IS LOAD-BEARING (A/B verified 2026-10-15): cargo-audit resolves the
# repo-local config from `.cargo/audit.toml`, NOT from `./audit.toml`. A root
# `audit.toml` existed with 8 IDs and was silently dead config; it was removed
# and its content merged here.
#
# A/B PROOF: with only the root file present, `cargo audit --json` reported
# `settings.ignore` as the CLI flag alone (the root file was never read); with
# `.cargo/audit.toml` present, all 10 IDs appeared in `settings.ignore`.
#
# DO NOT ATTRIBUTE THE CRON FAILURE HISTORY TO THIS FILE. The
# schedule-run failure history (event=schedule on the `cargo-audit`
# workflow, 200-run window ending 2026-10-15) actually shows two
# distinct streaks, both ending in success, both with the SAME
# root cause (missing `issues: write`):
#   1. EARLIER STREAK (not closed by this campaign): 7 consecutive
#      weekly failures 2026-07-08T07:55:15Z -> 2026-08-19T06:00:00Z,
#      heads a83a7677 / a83a7677 / a086185b / 5d5a460e / 559ca8a8 /
#      b3237672 / 193477e8 -> runs 28926852265, 29397528502,
#      29902093285, 30434341172, 30987617489, 31571925705, 32221570076.
#      All seven failed with `##[error]Resource not accessible by
#      integration` (verified by direct log inspection of
#      32221570076, the last of the streak), the same root cause
#      as the 6-streak below. The 2026-08-26 run 32936521807
#      (head 130b60b3) succeeded ONLY because rustsec/audit-check
#      found that the 2 unmaintained warnings (paste, rustls-pemfile)
#      were already mentioned in the issues/PRs and skipped
#      issue-creation, so the API call was never made. The
#      workflow file at that head still had no `issues: write`,
#      so the next schedule run (2026-09-02) regressed to the
#      same failure mode. Out of scope for this campaign only
#      because the fix wasn't applied at the time; the same
#      commit (e7086b16) would have closed it too.
#   2. CAMPAIGN-CLOSED STREAK: 6 consecutive weekly failures
#      2026-09-02T09:52:42Z -> 2026-10-07T11:58:24Z, each on a
#      different head SHA in mainline order: f1b4b59e48 (33616502499),
#      82130cae16 (34338261424), 3cc0c145ae (35084023071),
#      26e3d9a96b (35847731401), e367f89e37 (36707907906),
#      13d5c88407 (37617720114). The next weekly schedule run
#      2026-10-14T10:33:56Z (38550458606, head 45bb5c9fde) was the
#      first success after the streak.
# ONE root cause for BOTH streaks: the missing `issues: write` grant
# on the `cargo-audit` workflow file, fixed by `e7086b16` (the same
# day, `61f0aade` did the parallel fix for `security.yml`; the
# schedule workflow is `cargo-audit.yml`, not `security.yml`).
# Verified by run 38550458606, "No vulnerabilities were found". An
# ignore-list change does not control the exit code here -- every
# entry below was individually removed and `cargo audit` still exited
# 0, because these advisories classify as informational warnings, not
# `vulnerabilities`. See run 37617720114, which failed with
# `Resource not accessible by integration` while reporting
# `vulnerabilities count:3` -- the gate asserts on the issue POST,
# not on the advisory count. (The 7-streak runs had a different
# vulnerability count: run 32221570076 reported `vulnerabilities
# count:1` (RUSTSEC-2026-0258, h2) plus 6 warnings; same failure mode,
# same root cause.)
ignore = [
  # rsa: Marvin Attack (RUSTSEC-2023-0071) — no fixed release upstream;
  # low risk in our usage (verification only, no decryption oracle).
  "RUSTSEC-2023-0071",
  # backoff: unmaintained (RUSTSEC-2025-0012) — retry utility pulled in
  # transitively; no security impact.
  "RUSTSEC-2025-0012",
  # instant: unmaintained (RUSTSEC-2024-0384) — superseded by web-time
  # upstream but pinned by transitive deps. No security impact.
  "RUSTSEC-2024-0384",
  # paste: no longer maintained (RUSTSEC-2024-0436) — archival advisory, no
  # security impact; proc-macro contexts only.
  "RUSTSEC-2024-0436",
  # proc-macro-error: unmaintained, build-time only via glib-macros 0.18
  # (tauri tray-icon stack). glib 0.18 pins it; no fix until tauri/tray-icon
  # bump. Classified informational/unmaintained, not a code vuln.
  "RUSTSEC-2024-0370",
  # custom_derive: unmaintained macro helper (RUSTSEC-2025-0058).
  "RUSTSEC-2025-0058",
  # rustls-pemfile: unmaintained (RUSTSEC-2025-0134) — archived 2025-08; the
  # crate is a thin wrapper over rustls-pki-types' PemObject, so migration is
  # straightforward. Pulled in transitively (rustls/rcgen side of the tree).
  # NOTE: rustls-pemfile is a different crate from rustls; the rustls
  # RUSTSEC-2026-03xx advisories were closed by the 0.23.46 bump (51be78be).
  "RUSTSEC-2025-0134",
  # glib VariantStrIter: 0.18.5 is latest resolvable in this tauri graph;
  # fixed in 0.20.0 behind tauri PR #16170 ("update gtk crates to 0.19").
  # Dependabot run 38524349833 (2026-10-14) confirmed
  # security_update_not_possible: latest-resolvable 0.18.5,
  # lowest-non-vulnerable 0.20.0, conflicting-dependencies [].
  # Re-evaluate when tauri PR #16170 lands.
  "RUSTSEC-2024-0429",
  # Pre-existing entries retained verbatim (no per-entry rationale was
  # recorded in the old .cargo/audit.toml).
  "RUSTSEC-2025-0140",
  "RUSTSEC-2026-0049",
]
