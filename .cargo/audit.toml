# cargo-audit configuration.
#
# RUSTSEC-2023-0071 ("Marvin Attack" — potential key-recovery timing
# sidechannel in the `rsa` crate) has NO fixed upstream release: every
# published version of `rsa` is affected and the patch is still unreleased.
# `rsa` is pulled in transitively (via sqlx-mysql) and is not used for any
# attacker-facing RSA decryption path here. There is no upgrade that resolves
# it, so it is explicitly acknowledged rather than masked. Revisit when a
# patched `rsa` ships.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
