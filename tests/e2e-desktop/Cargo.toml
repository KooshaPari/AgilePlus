[package]
name = "agileplus-e2e-desktop"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
assert_cmd = "2"
predicates = "3"
serde_json = "1"

[[test]]
name = "desktop_lifecycle"
path = "tests/desktop_lifecycle.rs"
harness = true

[package.metadata.dist]
dist = false
