[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]
repository = "https://github.com/KooshaPari/phenotype-infrakit"
description = "Phenotype Infrastructure Kit"

[workspace]
resolver = "2"
members = [
    "crates/phenotype-analytics",
    "crates/phenotype-bdd",
    "crates/phenotype-compliance-scanner",
    "crates/phenotype-config-core",
    "crates/phenotype-config-loader",
    "crates/phenotype-contract-tests",
    "crates/phenotype-git-core",
    "crates/phenotype-health",
    "crates/phenotype-http-client",
    "crates/phenotype-project-registry",
    "crates/phenotype-rate-limiter",
    "crates/phenotype-security-aggregator",
    "crates/phenotype-sentry-config",
    "crates/phenotype-testing",
    "crates/phenotype-validation",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
hyper = { version = "1.0", features = ["client", "server"] }
axum = "0.7"
http = "1.0"
http-body = "1.0"
http-body-util = "0.1"
url = "2.5"
jsonschema = "0.17"
schemars = "0.8"
validator = { version = "0.16", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
chrono = { version = "0.4", features = ["serde"] }
time = { version = "0.3", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
once_cell = "1.19"
parking_lot = "0.12"
dashmap = "5"
bytes = "1"
glob = "0.3"
regex = "1.10"
base64 = "0.22"
dirs = "5"
walkdir = "2.5"
lru = "0.12"
sentry = { version = "0.32", features = ["backtrace"] }
tempfile = "3"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }
fake = { version = "3.0", features = ["derive"] }
tokio-test = "0.4"
tokio-retry = "0.3"
mockall = "0.12"
wiremock = "0.6"
sha2 = "0.10"
blake3 = "1"
hex = "0.4"
strum = { version = "0.26", features = ["derive"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
