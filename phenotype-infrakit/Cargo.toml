[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"
authors = ["Phenotype Team"]

[workspace]
resolver = "2"
members = [
    "crates/phenotype-analytics",
    "crates/phenotype-bdd",
    "crates/phenotype-compliance-scanner",
    "crates/phenotype-config-core",
    "crates/phenotype-config-loader",
    "crates/phenotype-contract-tests",
    "crates/phenotype-git-core",
    "crates/phenotype-health",
    "crates/phenotype-http-client",
    "crates/phenotype-project-registry",
    "crates/phenotype-rate-limiter",
    "crates/phenotype-security-aggregator",
    "crates/phenotype-sentry-config",
    "crates/phenotype-testing",
    "crates/phenotype-validation",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
regex = "1.10"
tempfile = "3"
sentry = { version = "0.32", features = ["backtrace"] }
git2 = "0.18"
metrics = "0.22"
futures = "0.3"
parking_lot = "0.12"
dashmap = "5"
http = "1"
http-body = "1"
http-body-util = "0.1"
walkdir = "2.5"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
serde_yaml_ng = "0.10"
base64 = "0.22"
bytes = "1"
url = "2.5"
once_cell = "1.19"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = "z"
lto = true
