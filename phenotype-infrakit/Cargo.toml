[workspace]
resolver = "2"
members = [
    "crates/phenotype-analytics",
    "crates/phenotype-bdd",
    "crates/phenotype-config-core",
    "crates/phenotype-config-loader",
    "crates/phenotype-contract-tests",
    "crates/phenotype-git-core",
    "crates/phenotype-health",
    "crates/phenotype-http-client",
    "crates/phenotype-rate-limiter",
    "crates/phenotype-sentry-config",
    "crates/phenotype-testing",
    "crates/phenotype-validation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
regex = "1.10"
tempfile = "3"
sentry = { version = "0.32", features = ["backtrace"] }
git2 = "0.18"
metrics = "0.22"
futures = "0.3"
parking_lot = "0.12"
