# Configuration for git-cliff: https://git-cliff.org/

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.
"""

body = """
{%- for group, commits in commits | group_by(attribute="group") %}
## {{ group }}

{%- for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/KooshaPari/AgilePlus/commit/{{ commit.id }}))
{%- endfor %}
{%- endfor %}
"""

footer = """
---

**Release Date:** (generated)
"""

trim = true

[git]
conventional_commits = true

commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
]

tag_pattern = "v[0-9].*"
skip_tags = ""
sort_commits = "newest"

[remote.github]
owner = "KooshaPari"
repo = "AgilePlus"
